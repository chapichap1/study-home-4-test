 ньому немає пішоходів. Чи можете Ви проїхати, не зменшуючи швидкість?","options":["Так.","Ні."],"provisional_correct_index":null},{"id":"35-166","topic":"35","number":166,"question":"Чи  дозволено  водієві  сірого   автомобіля  виконати  зупинку у цьому місці?","options":["Дозволено.","Заборонено."],"provisional_correct_index":0},{"id":"35-167","topic":"35","number":167,"question":"Чи повинні Ви зупинитись у даному випадку, якщо водій зустрічного автомобіля, не переконавшись у безпечності маневру, виконує поворот ліворуч?","options":["Повинні.","Ні, тому, що маєте перевагу в русі."],"provisional_correct_index":null},{"id":"35-168","topic":"35","number":168,"question":"Чи потрібно збільшувати боковий інтервал, коли Ви наближаєтесь до вантажного автомобіля?","options":["Так.","Ні."],"provisional_correct_index":0},{"id":"35-169","topic":"35","number":169,"question":"Чи повинні Ви під час руху прямо в даному випадку враховувати те, що велосипедист у будь-який момент може розпочати рух?","options":["Так.","Ні."],"provisional_correct_index":0},{"id":"35-170","topic":"35","number":170,"question":"Чи   потрібно   зменшити   швидкість,   проїжджаючи   повз пішохода у даному випадку?","options":["Так.","Ні."],"provisional_correct_index":0},{"id":"35-171","topic":"35","number":171,"question":"Які фактори можуть призвести до засліплення водія?","options":["Мокрий сніг.","Сильна злива.","Інтенсивний снігопад.","Світло."],"provisional_correct_index":3},{"id":"36-001","topic":"36","number":1,"question":"Який орган має право розглядати оскарження  адміністративного затримання, особистого огляду, огляду речей, огляду, а також вилучення речей і документів, у тому числі посвідчення водія?","options":["Тільки суд.","Тільки вищестоящий орган (вища посадова особа) щодо органу, який застосував ці заходи.","Органи, зазначені у відповідях 1 і 2."],"provisional_correct_index":2},{"id":"36-002","topic":"36","number":2,"question":"Результати особистого огляду або огляду речей офіційно повинні бути зафіксовані:","options":["Складанням протоколу.","Відповідним записом у протоколі про адміністративне правопорушення або в протоколі про адміністративне затримання.","Робиться так, як зазначено у відповідях 1 або 2."],"provisional_correct_index":2},{"id":"36-003","topic":"36","number":3,"question":"В'їзд водіїв на залізничний переїзд на заборонний сигнал світлофора при закритому шлагбаумі тягне за собою:","options":["Накладення штрафу або позбавлення права керування транспортним засобом.","Безкоштовне вилучення транспортного засобу.","Усне попередження від чергового по переїзду."],"provisional_correct_index":0},{"id":"36-004","topic":"36","number":4,"question":"Чи мають право посадові особи правоохоронних органів вилучати речі і документи під час затримання, особистого огляду або огляду речей?","options":["Мають право вилучати будь-які речі і документи на розсуд посадової особи.","Мають право вилучати тільки ті речі  і документи,  які є знаряддям або безпосереднім об'єктом правопорушення.","Мають право вилучати речі і документи, зазначені у відповідях 1 або 2."],"provisional_correct_index":1},{"id":"36-005","topic":"36","number":5,"question":"Водії, які керують транспортними засобами і щодо яких є достатні підстави вважати, що вони перебувають у стані сп'яніння:","options":["Підлягають відстороненню від керування цими транспортними засобами та огляду на стан сп'яніння.","Підлягають тільки огляду на стан сп'яніння."],"provisional_correct_index":0},{"id":"36-006","topic":"36","number":6,"question":"Чи дозволено органам внутрішніх справ (Національною поліцією) провести адміністративне затримання, якщо водій порушив Правила дорожнього руху?","options":["Дозволено.","Заборонено."],"provisional_correct_index":0},{"id":"36-007","topic":"36","number":7,"question":"Адміністративне  затримання  особи,  яка  вчинила  адміністративне правопорушення, може тривати не більше ніж:","options":["П'ять годин.","Чотири години.","Три години."],"provisional_correct_index":2},{"id":"36-008","topic":"36","number":8,"question":"Залишення водіями місця ДТП, до якої вони причетні, тягне за собою:","options":["Накладення штрафу або громадські роботи, або адміністративний арешт.","Тільки накладення штрафу.","Особа не несе відповідальність за «втечу» з місця ДТП."],"provisional_correct_index":0},{"id":"37-001","topic":"37","number":1,"question":"Унаслідок ДТП у мотоцикліста на правій гомілці видима рана, з якої виступає уламок кістки. Яка перша домедична допомога?","options":["На рану накласти стерильну пов'язку, провести фіксацію суглобів вище  і нижче місця перелому, транспортувати потерпілого в зручному для нього положенні.","Потерпілого покласти на спину, підклавши під ногу валик, дати випити таблетку анальгіну."],"provisional_correct_index":0},{"id":"37-002","topic":"37","number":2,"question":"Що слід зробити в разі перелому ключиці в потерпілого?","options":["Накласти холодний компрес на місце перелому і туго забинтувати.","Підвісити руку на косинку або прибинтувати випрямлену руку до тулуба.","Підкласти валик з бинта або вати в    пахвову   ділянку     і   прибинтувати зігнуту в лікті руку до тулуба."],"provisional_correct_index":2},{"id":"37-003","topic":"37","number":3,"question":"В якій послідовності слід надавати допомогу постраждалому:","options":["Зупинка масивної кровотечі – відновлення прохідності дихальних шляхів – забезпечення адекватного дихання.","Відновлення прохідності дихальних шляхів - зупинка масивна кровотечі –– забезпечення адекватного дихання.","Забезпечення адекватного дихання - відновлення прохідності дихальних шляхів - зупинка масивна кровотечі."],"provisional_correct_index":0},{"id":"37-004","topic":"37","number":4,"question":"Яка ознака зупинки серця у постраждалих враховується в базовому алгоритмі серцево-легеневої реанімації:","options":["Розширення зіниць.","Відсутність дихання.","Відсутність пульсу на сонних артеріях."],"provisional_correct_index":1},{"id":"37-005","topic":"37","number":5,"question":"Яка частота натискань на грудну клітку при проведенні серцево- легеневої реанімації у постраждалих:","options":["80 в хв.","100 в хв.","Немає різниці, головне тиснути без зупинки."],"provisional_correct_index":1},{"id":"37-006","topic":"37","number":6,"question":"Яке співвідношення проведення частоти натискань на грудну клітку та штучного  дихання  є  правильним  при  проведенні  серцево-легеневої реанімації?","options":["5 до 1.","15 до 1.","30 до 2."],"provisional_correct_index":2},{"id":"37-007","topic":"37","number":7,"question":"У постраждалого внаслідок опіку на шкірі утворилися пухирі. Які дії є правильними?","options":["Накласти на місце опіку чисту пов’язку. Обережно зафіксувати без створення додаткового тиску.","Проколоти пухирі гострим предметом після чого накласти чисту пов’язку.","Накласти на місце опіку тугу бинтову пов’язку."],"provisional_correct_index":0},{"id":"37-008","topic":"37","number":8,"question":"Яка допомога при опіку є найбільш правильною?","options":["Накласти на місце опіку пакет з льодом як мінімум на 30 хв.","Припинити горіння. Охолодити місце опіку прохолодною водою. Накласти чисту марлеву пов’язку.","Припинити горіння. Обробити місце опіку антисептиком (спирт, йод, зеленка). Накласти чисту марлеву пов’язку."],"provisional_correct_index":1},{"id":"37-009","topic":"37","number":9,"question":"В якому випадку слід припинити проведення серцево-легеневої реанімації у постраждалих?","options":["Через 15 хвилин проведення серцево-легеневої реанімації.","Через 30 хвилин проведення серцево-легеневої реанімації.","Поява ознак життя (дихання, свідомість)."],"provisional_correct_index":2},{"id":"37-010","topic":"37","number":10,"question":"В якому  випадку  слід  припинити  проведення  серцево-легеневої реанімації у постраждалих?","options":["Прибуття  бригади  ЕМД,  після  чого  вони  продовжать  проведення реанімаційних заходів.","Через 15 хвилин проведення серцево-легеневої реанімації.","Через 30 хвилин проведення серцево-легеневої реанімації."],"provisional_correct_index":0},{"id":"37-011","topic":"37","number":11,"question":"У випадку коли Вам чітко відоме джерело масивної кровотечі, джгут слід накласти:","options":["На 2-3 см вище рани.","На 5-7 см вище рани.","На 10-12 см вище рани."],"provisional_correct_index":1},{"id":"37-012","topic":"37","number":12,"question":"При наявності стороннього тіла в рані необхідно:","options":["Накласти пов’язку, не виймаючи стороннього тіла.","Вийняти стороннє тіло після чого накласти пов’язку.","Зафіксувати стороннє тіло тільки якщо воно виступає над раною не менше ніж на 5 см."],"provisional_correct_index":0},{"id":"37-013","topic":"37","number":13,"question":"У мотоцикліста при перелітанні через перепону перш за все слід підозрювати травму:","options":["Шийного відділу хребта.","Перелом кістки правого плеча.","Перелом кісток тазу."],"provisional_correct_index":0},{"id":"37-014","topic":"37","number":14,"question":"Кровоспинний джгут треба затягувати на кінцівці:","options":["До появи болю.","До зупинки кровотечі.","Скільки є сили."],"provisional_correct_index":1},{"id":"37-015","topic":"37","number":15,"question":"Якщо людина знаходиться без свідомості і не має травм, її треба:","options":["Посадити, щоб голова була в при піднятому положенні.","Не чіпати.","Перевести в стабільне положення."],"provisional_correct_index":2},{"id":"37-016","topic":"37","number":16,"question":"Порядок дій при масивній артеріальній кровотечі:","options":[". Викликати 103 і накласти пов'язку, що тисне.","Викликати 103, накласти джгут, вказати час накладання.","Накласти джгут, вказати час накладання, викликати 103."],"provisional_correct_index":2},{"id":"37-017","topic":"37","number":17,"question":"Що  першочергово  потрібно   зробити  при  наданні  домедичної допомоги постраждалому при ДТП?","options":["Переконатися у відсутності небезпеки.","Спочатку треба відновити прохідність дихальних шляхів.","Спочатку необхідно впевнитись в наявності дихання у постраждалого."],"provisional_correct_index":0},{"id":"37-018","topic":"37","number":18,"question":"У постраждалого кровотеча з рани в області шиї. Який метод зупинки кровотечі буде найбільш правильний:","options":["Накладання кровоспинного джгута.","Накладання тугої бинтової пов’язки.","Пальцеве притискання рани."],"provisional_correct_index":2},{"id":"37-019","topic":"37","number":19,"question":"Ви не бачите джерело кровотечі з кінцівки у постраждалого, однак визначили що вона масивна. Де Ви накладете джгут:","options":["Максимально високо на кінцівку.","Посередині кінцівки.","Джгут в будь-якому випадку слід накласти тільки після виявлення рани."],"provisional_correct_index":0},{"id":"37-020","topic":"37","number":20,"question":"Як надати домедичну допомогу в разі отруєння випарами бензину?","options":["Винести пацієнта на свіже повітря, зігріти, зробити штучне дихання.","Промити шлунок великою кількістю рідини.","Винести пацієнта на свіже повітря і дати йому гарячого чаю."],"provisional_correct_index":0},{"id":"37-021","topic":"37","number":21,"question":"Як потрібно обробити уражені електролітом ділянки шкіри?","options":["Тільки промити великою кількістю води.","Тільки обробити розчином йоду.","Тільки протерти розчином перекису водню.","Виконати всі перелічені вище дії."],"provisional_correct_index":0},{"id":"37-022","topic":"37","number":22,"question":"Як надати домедичну допомогу в разі харчового отруєння в дорозі?","options":["Зупинитися. Вийти на свіже повітря, вжити валеріанові краплі і по змозі випити гарячого чаю або кави.","Зупинитися. Спожити багато рідини, викликати штучно блювоту, вжити активоване вугілля.","Виконати дії, зазначені у відповіді 1 або 2."],"provisional_correct_index":1},{"id":"37-023","topic":"37","number":23,"question":"Як надати домедичну допомогу в разі забою живота?","options":["Розтерти забите місце жорстким матеріалом, накласти пов'язку, дати багато пити.","Масажувати забите місце, а потім прогріти його грілкою.","Забезпечити потерпілому повний спокій, забите місце охолодити."],"provisional_correct_index":2},{"id":"37-024","topic":"37","number":24,"question":"За відсутності дихання в потерпілого потрібно:","options":["Оцінити наявність пульсу на променевій артерії протягом однієї хвилини.","Розпочати проведення серцево-легеневої реанімації.","Покласти потерпілого на спину і дати йому понюхати нашатирний спирт."],"provisional_correct_index":1},{"id":"37-025","topic":"37","number":25,"question":"Як надати домедичну допомогу в   разі термічного опіку в дорозі?","options":["Винести потерпілого із зони високої температури, проколоти пухирі, обробити уражену поверхню вазеліном або олією і присипати порошком.","Винести потерпілого із зони високої температури, накласти суху асептичну пов'язку або чисту бавовняну тканину.","Виконати дії, зазначені у відповіді 1 або 2."],"provisional_correct_index":1},{"id":"37-026","topic":"37","number":26,"question":"Як надати домедичну допомогу при стенокардії (біль у серці) в дорозі?","options":["Обличчя і груди хворого змочити холодною водою, дати йому понюхати ватку, змочену нашатирним спиртом.","Забезпечити доступ повітря до хворого, дати йому таблетку нітрогліцерину (валідолу) під язик.","Виконати дії, зазначені у відповідях 1 і 2."],"provisional_correct_index":1},{"id":"37-027","topic":"37","number":27,"question":"У разі перелому кінцівки слід:","options":["Перев'язати місце перелому.","Зафіксувати кінцівку за допомогою шини або предмета, що замінює її.","Вкласти кінцівку в будь-якому зручному для потерпілого положенні."],"provisional_correct_index":1},{"id":"37-028","topic":"37","number":28,"question":"Як впливає алкоголь на час реакції водія?","options":["Не впливає на реакцію водія.","Час реакції збільшується.","Час реакції зменшується."],"provisional_correct_index":1},{"id":"37-029","topic":"37","number":29,"question":"Найбільш небезпечною кровотечею у постраждалих є:","options":["Артеріальна.","Венозна.","Капілярна."],"provisional_correct_index":0},{"id":"37-030","topic":"37","number":30,"question":"Зупинка масивної артеріальної кровотечі, як правило, проводиться:","options":["Накладанням бинтової пов’язки.","За допомогою кровоспинного джгута.","Як правило, зупиняється самостійно."],"provisional_correct_index":1},{"id":"37-031","topic":"37","number":31,"question":"Зупинка венозної кровотечі як правило проводиться:","options":["Накладанням пов’язки, що тисне.","За допомогою кровоспинного джгута.","Як правило, зупиняється самостійно."],"provisional_correct_index":0},{"id":"37-032","topic":"37","number":32,"question":"Ознаки артеріальної кровотечі:","options":["Повільно витікає з рани, темного кольору.","Витікає з рани краплями.","Пульсує, швидко витікає, яскравого кольору."],"provisional_correct_index":2},{"id":"37-033","topic":"37","number":33,"question":"Ознаки венозної кровотечі:","options":["Повільно витікає з рани, темного кольору.","Пульсує, швидко витікає, яскравого   кольору.","Витікає з рани краплями."],"provisional_correct_index":0},{"id":"37-034","topic":"37","number":34,"question":"Ви не бачите джерело кровотечі з кінцівки у постраждалого, однак визначили що вона масивна. Де Ви накладете джгут:","options":["Максимально високо на кінцівку.","Посередині кінцівки.","Джгут в будь-якому випадку слід накласти тільки після виявлення рани."],"provisional_correct_index":0},{"id":"37-035","topic":"37","number":35,"question":"Яке положення треба надати постраждалому з травмою грудної клітки?","options":["Зручне положення, при якому йому найлегше дихати.","Стабільне бокове положення.","Положення лежачи з піднятими ногами."],"provisional_correct_index":0},{"id":"37-036","topic":"37","number":36,"question":"Які ваші першочергові дії при наданні домедичної допомоги дорослому в разі раптової зупинки кровообігу та відсутності дихання?","options":["Розпочати серцево-легеневу реанімацію, тільки після появи дихання викликати екстрену медичну допомогу.","Викликати  екстрену  (швидку)  медичну  допомогу  та  дотримуватись указівок диспетчера, розпочати серцево-легеневу реанімацію.","Перевести дорослого у стабільне бокове положення, при цьому кожні 5 хвилин перевіряти наявність дихання."],"provisional_correct_index":1},{"id":"37-037","topic":"37","number":37,"question":"У постраждалого внаслідок термічного опіку на шкірі утворилися пухирі. Які дії будуть правильними?","options":["Не пошкоджуючи пухирі, охолодити місце опіку та накласти чисту, стерильну суху марлеву пов’язку, яка не тиснутиме на м’які тканини.","Проколоти пухирі гострим предметом, після чого накласти на місце опіку чисту, стерильну суху марлеву пов’язку, яка не тиснутиме на м’які тканини."],"provisional_correct_index":0},{"id":"37-038","topic":"37","number":38,"question":"Що насамперед необхідно враховувати під час надання домедичної допомоги постраждалим із термічними опіками?","options":["Ступінь пошкодження шкіри та м’яких тканин.","Місцезнаходження потерпілого під час отримання термічного опіку.","Вік, зріст і стать потерпілого."],"provisional_correct_index":0},{"id":"37-039","topic":"37","number":39,"question":"Невідкладний  стан,  спричинений  дією  високих  температур, у результаті чого виникає пошкодження шкіри та м’яких тканин, – це:","options":["Тепловий удар.","Термічний опік.","Порушення прохідності дихальних шляхів."],"provisional_correct_index":1},{"id":"37-040","topic":"37","number":40,"question":"Що  слід  зробити,  якщо  при  наданні  домедичної  допомоги постраждалому з ознаками термічного опіку було випадково пошкоджено пухирі?","options":["Накласти на місце опіку чисту, стерильну суху марлеву пов’язку, яка не тиснутиме на м’які тканини.","Охолодити місце опіку шляхом   промивання  протягом  щонайменше 20 хвилин холодною водою.","Обробити місце опіку дезінфікувальним засобом."],"provisional_correct_index":0},{"id":"37-041","topic":"37","number":41,"question":"Якщо під час огляду постраждалого виявлено проникну травму черевної порожнини з фіксованим стороннім предметом у ній, Ви:","options":["Обережно витягнете сторонній предмет та накладете стерильну пов’язку.","Надійно  зафіксуєте  сторонній  предмет  у  рані  та  наглядатимете  за постраждалим до приїзду бригади екстреної (швидкої) медичної допомоги."],"provisional_correct_index":1},{"id":"37-042","topic":"37","number":42,"question":"Швидке, інтенсивне витікання крові з рани постраждалого є основною ознакою:","options":["Масивної зовнішньої кровотечі.","Внутрішньої кровотечі."],"provisional_correct_index":0},{"id":"37-043","topic":"37","number":43,"question":"Основні ознаки відкритого перелому кінцівки:","options":["Наявність рани в місці перелому, кровотеча з рани, наявність уламків кістки в рані.","Неприродне положення кінцівки, біль у ділянці рани / деформації кінцівки, гематома в ділянці перелому (збільшення кінцівки в об’ємі)."],"provisional_correct_index":0},{"id":"37-044","topic":"37","number":44,"question":"За наявності ран у ділянці голови у жодному разі не можна:","options":["Проводити пальпацію рани.","Натискати на рану.","Використовувати антисептики під час обробки ран.","Усі відповіді правильні."],"provisional_correct_index":3},{"id":"37-045","topic":"37","number":45,"question":"Часткове або повне порушення цілісності кістки без пошкодження шкірних покривів у проєкції перелому – це:","options":["Відкритий перелом.","Закритий перелом."],"provisional_correct_index":1},{"id":"37-046","topic":"37","number":46,"question":"Часткове  або  повне порушення  цілісності  кістки  з одночасним пошкодженням шкірного покриву в проєкції перелому – це:","options":["Відкритий перелом.","Закритий перелом."],"provisional_correct_index":0},{"id":"37-047","topic":"37","number":47,"question":"Якщо у постраждалого є ознаки закритого перелому, потрібно:","options":["Допомогти постраждалому прийняти зручне положення (таке, яке завдає найменше болю).","Іммобілізувати  (знерухомити)  пошкоджену  кінцівку  за  допомогою стандартного обладнання (шин) чи підручних засобів.","Усі відповіді правильні."],"provisional_correct_index":2},{"id":"37-048","topic":"37","number":48,"question":"Якими будуть Ваші першочергові дії при наданні домедичної допомоги постраждалому у випадку ДТП?","options":["Переконатися у відсутності небезпеки для себе, оточення, постраждалого і тільки за її відсутності перейти до надання допомоги.","Незалежно від наявності небезпеки почати надавати домедичну допомогу постраждалому."],"provisional_correct_index":0},{"id":"37-049","topic":"37","number":49,"question":"Причинами виникнення шоку в постраждалого можуть бути:","options":["Масивна зовнішня кровотеча.","Внутрішня кровотеча.","Серцевий напад.","Усі відповіді правильні."],"provisional_correct_index":3},{"id":"37-050","topic":"37","number":50,"question":"Першочергові дії при наданні домедичної допомоги постраждалим за підозри шоку:","options":["Здійснити  виклик  екстреної  медичної  допомоги  та  дотримуватись указівок диспетчера прийому виклику, за можливості виявити та усунути причину виникнення шоку, надати постраждалому протишокове положення.","Дати постраждалому заспокійливе, за можливості виявити й усунути причину виникнення шоку, здійснити виклик екстреної медичної допомоги та дотримуватись указівок диспетчера прийому виклику."],"provisional_correct_index":0},{"id":"37-051","topic":"37","number":51,"question":"Що  з наведеного насамперед зобов’язаний зробити причетний до дорожньо-транспортної пригоди водій, якщо в результаті події є потерпілі особи?","options":["Ужити можливих заходів для надання домедичної допомоги потерпілим, викликати бригаду екстреної (швидкої) медичної допомоги, а в разі відсутності можливості вжити зазначених заходів звернутися по допомогу до присутніх і відправити потерпілих до закладу охорони здоров’я.","Повідомити про дорожньо-транспортну пригоду орган чи уповноважений підрозділ Національної поліції, записати прізвища та адреси очевидців, чекати прибуття поліцейських.","Вжити всіх можливих заходів для збереження слідів пригоди, їх огородження та організувати об’їзд місця пригоди."],"provisional_correct_index":0},{"id":"37-052","topic":"37","number":52,"question":"Ви бачите джерело масивної зовнішньої кровотечі з рани на кінцівці постраждалого. Що Ви повинні зробити насамперед?","options":["Якнайсильніше натиснути на рану руками та накласти пов’язку, що тисне.","Промити рану великою кількістю води."],"provisional_correct_index":0},{"id":"37-053","topic":"37","number":53,"question":"Що слід зробити, якщо після накладання кровоспинного джгута кровотеча з рани на кінцівці постраждалого не спинилася?","options":["Збільшити  тиск  кровоспинного  джгута  та/або  накласти  ще  один кровоспинний джгут вище від першого.","Затиснути рану руками і тримати до приїзду бригади екстреної (швидкої) медичної допомоги або виконати тампонування рани.","Обидва варіанти правильні."],"provisional_correct_index":2},{"id":"37-054","topic":"37","number":54,"question":"Що Ви повинні насамперед зробити у разі виявлення в потерпілого у ДТП масивної зовнішньої кровотечі з рани, яка локалізована в основі шиї?","options":["Здійснити максимально можливий тиск на рану.","Заспокоїти постраждалого та пояснити подальші дії.","Допомогти    постраждалому   прийняти зручне положення."],"provisional_correct_index":0},{"id":"37-055","topic":"37","number":55,"question":"Що Ви повинні насамперед зробити у разі виявлення в потерпілого у ДТП масивної зовнішньої кровотечі з рани, яка локалізована в пахвових ділянках?","options":["Допомогти постраждалому прийняти зручне положення.","Заспокоїти постраждалого та пояснити подальші дії.","Здійснити максимально можливий тиск на рану."],"provisional_correct_index":2},{"id":"37-056","topic":"37","number":56,"question":"За яких умов Ви повинні припинити проведення серцево-легеневої реанімації постраждалого в ДТП до прибуття бригади екстреної (швидкої) медичної допомоги?","options":["За появи у постраждалого явних ознак життя: відновлення самостійного дихання, координованої рухової активності.","У разі виникнення загрози життю, Вашому та / або постраждалого.","Якщо проводити  серцево-легеневу  реанімацію неможливо  внаслідок Вашого значного фізичного виснаження.","За будь-якої з вищевказаних умов."],"provisional_correct_index":3},{"id":"37-057","topic":"37","number":57,"question":"Що потрібно насамперед зробити під час надання домедичної допомоги постраждалому в ДТП у разі підозри в нього травми голови до приїзду бригади екстреної (швидкої) медичної допомоги?","options":["Обмежити рухи постраждалого в ділянці шийного відділу хребта.","Вкрити постраждалого термопокривалом / ковдрою.","Здійснювати фіксацію шийного відділу хребта за допомогою шийного коміра."],"provisional_correct_index":0},{"id":"37-058","topic":"37","number":58,"question":"За наявності у постраждалого в ДТП ран у ділянці голови необхідно:","options":["Накласти марлеву пов’язку та зафіксувати її без створення надмірного тиску.","Обробити рани з використанням антисептиків та накласти тугу марлеву пов’язку.","Здійснювати тиск на рани до повної зупинки кровотечі."],"provisional_correct_index":0},{"id":"37-059","topic":"37","number":59,"question":"Які ознаки тупої травми органів черевної порожнини?","options":["Наявність забоїв та гематоми передньої та / або бокової стінки живота.","Біль у ділянці живота.","Правильні відповіді 1 і 2."],"provisional_correct_index":2},{"id":"37-060","topic":"37","number":60,"question":"Що із переліченого належить до ознак гострого мозкового інсульту?","options":["Раптова зміна виразу обличчя, порушення його симетрії.","Раптова слабкість та / або оніміння в руці чи нозі з одного боку.","Раптове порушення мовлення / розуміння простих команд / запитань.","Усе вищеперелічене."],"provisional_correct_index":3},{"id":"38-001","topic":"38","number":1,"question":"Як у цій ситуації ви визначаєте   порядок руху?","options":["Не гальмуєте, тому що вантажівка повинна вас пропустити.","Гальмуєте, тому що ви зобов’язані пропустити вантажівку.","Керуєтеся ПДР та діями іншого водія."],"provisional_correct_index":2},{"id":"38-002","topic":"38","number":2,"question":"Якими будуть ваші  дії, якщо вантажний  автомобіль  не зменшує швидкість, виїжджаючи на міст?","options":["Продовжувати рух, бо у вас перевага в русі.","Почати гальмування, щоб не створювати аварійну ситуацію.","Ввімкнути дальнє світло, щоб водій зупинився від засліплення."],"provisional_correct_index":1},{"id":"38-003","topic":"38","number":3,"question":"Якими будуть ваші дії, якщо вантажний автомобіль декілька разів увімкнув дальнє світло?","options":["Теж ввімкнути декілька разів дальнє світло, не припиняючи рух.","Подати звуковий сигнал, попереджаючи іншого водія, що у вас перевага в русі.","Почати гальмування, щоб визначити подальші дії іншого водія."],"provisional_correct_index":2},{"id":"38-004","topic":"38","number":4,"question":"Що може означати короткочасне ввімкнення стоп-сигналів автомобіля, що рухається попереду в щільному транспортному потоці?","options":["Прохання про збільшення дистанції.","Попередження про наступне гальмування (зупинку).","Усе перелічене."],"provisional_correct_index":2},{"id":"38-005","topic":"38","number":5,"question":"Як повинен діяти водій автомобіля, який обганяють, що рухається з дальнім світлом фар у темний час доби?","options":["Переключитися на ближнє світло фар у момент, коли автомобілі порівнялися, рухаючись сусідніми смугами руху.","Відразу переключитися на ближнє світло, як тільки водій наступного за ним автомобіля почав виїжджати на зустрічну смугу руху.","Включити світло фар, як тільки автомобіль, що обганяє, виявився попереду, та рухатися з ввімкненими габаритними вогнями до моменту, поки автомобіль, що рухається попереду, не віддалився на значну відстань."],"provisional_correct_index":0},{"id":"38-006","topic":"38","number":6,"question":"Що необхідно зробити перед тим, як вийти з автомобіля після зупинки на дорозі?","options":["Вжити заходів, які виключають мимовільний рух транспортного засобу.","Через дзеркало заднього виду або поворотом голови назад переконатися в безпеці виходу і потім лише виходити.","У темну пору доби на неосвітленій ділянці дороги (крім житлових зон) ввімкнути габаритні чи стоянкові ліхтарі.","Виконати все, перелічене вище."],"provisional_correct_index":3},{"id":"38-007","topic":"38","number":7,"question":"Які з перерахованих дій учасників дорожнього руху можуть призвести до виникнення аварійної ситуації під час перестоювання в транспортному потоці?","options":["Перестроювання автомобіля в «сліпій» (мертвій) зоні.","Різке гальмування автомобіля, що рухається попереду.","Різке прискорення автомобіля, що рухається позаду сусідньою смугою руху.","Усі, перелічені вище."],"provisional_correct_index":3},{"id":"38-008","topic":"38","number":8,"question":"Під час руху по дорозі поза населеним пунктом Ви зібралися зробити обгін вантажного автомобіля. Після ввімкнення Вами лівого покажчика повороту водій вантажного автомобіля ввімкнув та вимкнув сигнал лівого повороту. Що це може означати?","options":["Водій вантажного  автомобіля, порушуючи Правила дорожнього  руху, перешкоджає виконанню обгону.","Водій вантажного автомобіля попереджає Вас про небезпеку під час здійснення обгону, яку Ви не в змозі виявити.","Водій вантажного автомобіля зібрався сам виконати обгін, але, побачивши Ваші дії, відмовився від запланованого."],"provisional_correct_index":1},{"id":"38-009","topic":"38","number":9,"question":"Під час руху в темний час доби автомобіль, що рухався перед Вами, різко загальмував на смузі руху. Які Ваші дії в ситуації, що склалася, будуть найбезпечнішими?","options":["Подати звуковий сигнал та об’їхати автомобіль, що зупинився, узбіччям.","Ввімкнути лівий покажчик повороту та об’їхати автомобіль, що зупинився, зустрічною смугою руху.","Зупинитися у полосі руху, ввімкнувши аварійну світлову сигналізацію, та не об’їжджати автомобіль, що зупинився, не переконавшись у безпеці такого маневру."],"provisional_correct_index":2},{"id":"38-010","topic":"38","number":10,"question":"В який бік необхідно дивитися водію при зустрічному роз’їзді в темний час доби для того, щоб зменшити вірогідність засліплення?","options":["У бік лівого узбіччя, контролюючи край проїжджої частини дороги.","У бік правого узбіччя, контролюючи край проїжджої частини дороги.","По центру проїжджої частини дороги, контролюючи лінію, що розділяє транспортні потоки протилежних напрямків."],"provisional_correct_index":1},{"id":"38-011","topic":"38","number":11,"question":"Відносно якої лінії дорожньої розмітки найбільш безпечно контролювати положення свого автомобіля при зустрічному роз’їзді в темний час доби?","options":["Відносно лінії, що позначає лівий край проїжджої частини дороги.","Відносно лінії, що позначає правий край проїжджої частини дороги.","Відносно лінії, що розділяє транспортні потоки протилежних напрямків."],"provisional_correct_index":1},{"id":"38-012","topic":"38","number":12,"question":"Чи змінюється поле зору водія при збільшенні швидкості руху?","options":["Звужується.","Розширюється.","Не змінюється."],"provisional_correct_index":0},{"id":"38-013","topic":"38","number":13,"question":"Гальмівний шлях на дорозі одразу після дощу:","options":["Збільшується.","Зменшується.","Не змінюється."],"provisional_correct_index":0},{"id":"38-014","topic":"38","number":14,"question":"При русі в транспортному потоці водій, що рухався по сусідній смузі, різко перелаштувався на Вашу смугу руху, змусивши Вас загальмувати. Що необхідно Вам зробити в даній ситуації?","options":["Подати світловий сигнал фарами.","Випередити порушника, перестроїтись перед ним на його смугу  і різко загальмувати.","На найближчому світлофорі при заборонному сигналі підійти до його автомобілю і зробити зауваження порушнику.","Неприпустима жодна з перерахованих дій."],"provisional_correct_index":3},{"id":"39-001","topic":"39","number":1,"question":"Оберіть правильне твердження однієї з умов використання спільного повідомлення про дорожньо-транспортну пригоду (Європротоколу):","options":["Наявність у одного з водіїв чинного страхового полісу (страховий сертифікат «Зелена картка») про укладання договору обов’язкового страхування цивільно- правової відповідальності власників наземних транспортних засобів.","Наявність у обох водіїв транспортних засобів чинних страхових полісів (страхових   сертифікатів   «Зелена   картка»)  про   укладання   договорів обов’язкового страхування цивільно-правової відповідальності.","Наявність  у  водіїв  транспортних  засобів  чинних  страхових  полісів (страхових сертифікатів «Зелена картка») про укладання договорів обов’язкового страхування  цивільно-правової  відповідальності  або  посвідчення  учасника бойових дій, особи з інвалідністю внаслідок війни або особи з інвалідністю І групи.","Всі твердження вірні."],"provisional_correct_index":1},{"id":"39-002","topic":"39","number":2,"question":"Чи можна скласти спільне повідомлення про дорожньо-транспортну пригоду (Європротокол) у разі завдання шкоди об’єктам крім ТЗ?","options":["Так.","Ні.","Так, якщо власник пошкодженого майна не має претензій до учасників події.","Жодне з тверджень не вірне."],"provisional_correct_index":1},{"id":"39-003","topic":"39","number":3,"question":"Чи  складається  спільне  повідомлення  про  дорожньо-транспортну пригоду (Європротокол) якщо шкода завдана третьому ТЗ, крім двох учасників ДТП?","options":["Так.","Ні.","Так, якщо шкода завдана третьому ТЗ незначна.","Так, якщо пошкоджено не більше 5 ТЗ."],"provisional_correct_index":1},{"id":"39-004","topic":"39","number":4,"question":"Ким  складається  спільне повідомлення  про дорожньо-транспортну пригоду (Європротокол)?","options":["Поліцейськими.","Водіями транспортних засобів, що є учасниками ДТП.","Водієм транспортного засобу винного у ДТП та потерпілими.","Всі відповіді вірні."],"provisional_correct_index":1},{"id":"39-005","topic":"39","number":5,"question":"Хто з водіїв, учасників ДТП, заповнює пункт «Транспортний засіб А» при  оформленні  спільного  повідомлення  про  дорожньо-транспортну пригоду (Європротоколу)?)","options":["Це вирішують поліцейські.","Винуватець ДТП.","Потерпілий в ДТП.","Будь-хто з водіїв транспортних засобів — учасників ДТП."],"provisional_correct_index":3},{"id":"39-006","topic":"39","number":6,"question":"В разі завдання шкоди життю та здоров’ю учаснику (учасникам) ДТП чи складається спільне повідомлення про дорожньо-транспортну пригоду (Європротокол)?","options":["Так.","Ні.","Ні, якщо є загиблі.","Так, якщо шкода є незначною."],"provisional_correct_index":1},{"id":"40-001","topic":"40","number":1,"question":"Хто з водіїв може рухатися з більш високою швидкістю на автомагістралі?","options":["Водій мотоцикла – зі швидкістю 130 км/год.","Водій легкового автомобіля з причепом – зі швидкістю 90 км/год.","Обидва повинні рухатися зі швидкістю не більш ніж 80 км/год."],"provisional_correct_index":2},{"id":"40-002","topic":"40","number":2,"question":"Кому з водіїв дозволено рух з більш високою швидкістю?","options":["Водієві мотоцикла.","Водієві автомобіля.","Швидкість обох не повинна перевищувати 20 км/год."],"provisional_correct_index":2},{"id":"40-003","topic":"40","number":3,"question":"Проїжджаючи це перехрестя, водії повинні керуватися:","options":["Знаками пріоритету.","Сигналами світлофора.","Правильні обидва варіанти."],"provisional_correct_index":1},{"id":"40-004","topic":"40","number":4,"question":"Чим Ви як водій мопеда повинні керуватися під час проїзду цього перехрестя?","options":["Сигналами світлофора.","Знаками пріоритету.","Сигналами регулювальника.","Перешкодою праворуч."],"provisional_correct_index":2},{"id":"40-005","topic":"40","number":5,"question":"Які транспортні засоби поставлені з порушенням Правил дорожнього руху?","options":["Велосипеди.","Мопеди.","Зелений мотоцикл із боковим причепом.","Коричневий мотоцикл із боковим причепом."],"provisional_correct_index":3},{"id":"40-006","topic":"40","number":6,"question":"З  якою  максимальною  швидкістю  дозволено  рух  мопедів на автомагістралях?","options":["60 км/год.","80 км/год.","90 км/год.","110 км/год.","130 км/год."],"provisional_correct_index":0},{"id":"40-007"," еровому чи електронному носії або відображення інформації про його наявність в електронному свідоцтві про реєстрацію транспортного засобу).","Дійсну медичну довідку встановленого зразка.","Відповіді 1, 2 і 3.","Відповіді, зазначені в пунктах 1 і 2."],"provisional_correct_index":4},{"id":"42-018","topic":"42","number":18,"question":"Кому має право передавати управління власник мотоцикла, а також особа, яка використовує цей мотоцикл на законних підставах?","options":["Будь-якій іншій особі.","Іншій особі, що має при собі посвідчення водія на право керування транспортним засобом відповідної категорії.","Близькому родичу (чоловік або дружина, брат або сестра) під час його навчання водінню."],"provisional_correct_index":1},{"id":"42-019","topic":"42","number":19,"question":"Які документи повинен мати при собі водій мотоцикла?","options":["Реєстраційний документ на транспортний засіб.","Посвідчення водія на право керування транспортним засобом відповідної категорії  і поліс (сертифікат) обов'язкового страхування цивільно- правової відповідальності власників наземних транспортних засобів (крім водіїв, які відповідно  до  законодавства  звільняються  від  обов’язкового  страхування цивільно-правової відповідальності власників наземних транспортних засобів на території України).","Генеральна довіреність на транспортний засіб або тимчасовий реєстраційний талон.","Усе перелічене вище.","Відповіді 1 і 2."],"provisional_correct_index":4},{"id":"42-020","topic":"42","number":20,"question":"Які з перерахованих транспортних засобів дозволяється експлуатувати без медичної аптечки?","options":["Автомобілі.","Автобуси.","Всі мотоцикли.","Тільки мотоцикли без бокового причепа."],"provisional_correct_index":3},{"id":"43-001","topic":"43","number":1,"question":"Чи  зобов'язані  водії  та  пасажири  мотоциклів   і  мопедів  бути  в застебнутих мотошоломах?","options":["Зобов'язані.","Не зобов'язані.","Не зобов'язані під час руху в населених пунктах."],"provisional_correct_index":0},{"id":"43-002","topic":"43","number":2,"question":"Які зовнішні світлові пристрої повинні бути ввімкнені на мопедах  і велосипедах під час руху в темний час доби незалежно  від ступеня освітлення дороги?","options":["Фари або ліхтарі.","Досить наявності встановлених світловідбивачів.","Досить мати світловідбивачі на одязі."],"provisional_correct_index":0},{"id":"43-003","topic":"43","number":3,"question":"Які з перерахованих транспортних засобів дозволяється експлуатувати без вогнегасника?","options":["Автомобілі.","Автобуси.","Всі мотоцикли.","Тільки  мотоцикли  без  бокового   причепа."],"provisional_correct_index":2},{"id":"43-004","topic":"43","number":4,"question":"Ви, рухаючись на мотоциклі, потрапили в порив сильного вітру. Ваші дії:","options":["Щоб пом'якшити удар вітру, нахиліть мотоцикл за вітром.","2.Наскільки це можливо нахиліть мотоцикл проти вітру.","Перенесіть вагу тіла на підніжки, міцно тримаючись за кермо.","Відповіді 1 і 3.","Відповіді 2 і 3."],"provisional_correct_index":4},{"id":"43-005","topic":"43","number":5,"question":"У мокру погоду або в дощ найкраще гальмувати:","options":["Натиснути переднє і заднє гальмо.","Повністю натиснути переднє гальмо, трохи пригальмовуючи заднім.","Використовувати тільки заднє гальмо, не чіпаючи передній.","Використовувати обидва гальма, як в суху погоду.","Гальмувати, плавно і акуратно натискаючи переднє і заднє гальмо."],"provisional_correct_index":4},{"id":"43-006","topic":"43","number":6,"question":"При їзді по дорогах з гравійним покриттям на мотоциклі (мопеді) потрібно:","options":["Відкривати газ плавно, щоб не зариватися в гравій.","При необхідності знизити швидкість.","При прискоренні, відхилятися назад і газувати.","Використовувати гальма обережно.","Відповіді 2 і 4."],"provisional_correct_index":4},{"id":"43-007","topic":"43","number":7,"question":"При їзді по гравійним дорогам, керуючи мотоциклом, Ви повинні:","options":["Дивитися на дорогу прямо перед переднім колесом.","Дивитися на дорогу трохи далі, ніж зазвичай.","Трохи зменшити швидкість.","Відповіді 1 і 3.","Відповіді 2 і 3."],"provisional_correct_index":4},{"id":"43-008","topic":"43","number":8,"question":"Щоб водію мотоцикла (мопеда) знизити швидкість на гравійній дорозі, потрібно:","options":["Використовувати тільки заднє гальмо.","Обережно використовувати обидва гальма.","Натискати на гальма наповну.","Взагалі не використовувати гальма."],"provisional_correct_index":1},{"id":"43-009","topic":"43","number":9,"question":"У момент повороту на перехресті ви розумієте, що під колесами мотоцикла знаходиться пісок або гравій. Ваші дії:","options":["Вирівняти мотоцикл і виїхати на зустрічну смугу, якщо там немає автомобілів.","Збільшити нахил, щоб уникнути вильоту на узбіччя.","Не застосовувати гальма.","Використовувати гальма обережно."],"provisional_correct_index":2},{"id":"43-010","topic":"43","number":10,"question":"Якщо водію мотоцикла (мопеда) на швидкості необхідно зробити швидкий маневр вліво для ухилення від перешкоди, потрібно:","options":["Сильно натиснути на праву ручку керма.","Сильно натиснути на ліву ручку    керма.","Перенести вагу тіла вліво.","Сильніше натиснути на праву ручку, переносячи вагу тіла вліво наскільки це можливо."],"provisional_correct_index":null},{"id":"43-011","topic":"43","number":11,"question":"Що потрібно зробити, якщо ви проїхали по купі сміття на мотоциклі (мопеді):","options":["Заїхати в найближчий мотосалон і перевірити, чи все в порядку.","Якщо не чути ніяких сторонніх звуків, оглянути мотоцикл після поїздки.","Зупинитися з дотриманням вимог ПДР, оглянути мотоцикл, особливу увагу звернути на стан шин, ободів, спиць коліс, а також підкрильним просторам.","Поставити в плани заміну масла."],"provisional_correct_index":1},{"id":"43-012","topic":"43","number":12,"question":"При перетині залізничного переїзду:","options":["При перетині рейок трохи збільшити швидкість.","Намагатися переїжджати рейки під прямим кутом, трохи збільшуючи швидкість.","Сучасні шини цілком справляються з перетином залізничних рейок, тому можна не хвилюватися і їхати, як зазвичай.","Перетинати рейки під прямим кутом на звичайній швидкості, або трохи знизити швидкість."],"provisional_correct_index":2},{"id":"43-013","topic":"43","number":13,"question":"Якщо на вашому шляху переїзд з металевих листів:","options":["Ніколи не перетинайте переїзди з металевим покриттям, оскільки це може закінчитися падінням з мотоцикла. Такі покриття завжди дуже слизькі.","У міру наближення до переїзду знизьте швидкість, наскільки це можливо. У момент переїзду не натискайте на гальмо і не додавайте газ.","На таких переїздах треба бути дуже обережним, навіть в суху погоду вони можуть бути слизькими.","Відповіді 2 і 3."],"provisional_correct_index":3},{"id":"43-014","topic":"43","number":14,"question":"Найкращий спосіб проїхати ділянку на мотоциклі (мопеді) зі знятим асфальтом:","options":["Зупинитися і повернути назад. Взагалі не їздити по ділянках дороги зі знятим асфальтом.","Не застосовувати гальма при знятому асфальті.","Використовувати в основному заднє гальмо.","Знизити швидкість, зберігати спокій, використовувати  і переднє  і заднє гальмо обережно, взяти до уваги, що мотоцикл може носити з боку в бік при збільшенні швидкості."],"provisional_correct_index":3},{"id":"43-015","topic":"43","number":15,"question":"Що слід враховувати і як правильно діяти водію мотоцикла перетинаючи ділянки доріг з дорожньою розміткою (пішохідні переходи і т.д.):","options":["Дорожня розмітка дуже слизька в мокру погоду, слід об'їжджати такі ділянки дороги.","Дорожня розмітка не така слизька, як думають деякі, оскільки в фарбу, якою наносять розмітку, додають пісок.","Пригальмувати до швидкості, на 15- 20 км  / год. нижче встановленої  і не хвилюватися.","Переконатися, що мотоцикл знаходиться у стійкому положенні, обережно використовувати гальма, намагатися уникати руху через самі лінії розмітки смуг або пішохідних переходів."],"provisional_correct_index":null},{"id":"43-016","topic":"43","number":16,"question":"Як ви повинні вчинити, якщо під час руху відмовив у роботі спідометр на мотоциклі?","options":["Продовжити намічену поїздку з особливою обережністю.","Припинити подальший рух.","Спробувати усунути  несправність на  місці,  а якщо це неможливо, то слідувати до  місця  стоянки  або  ремонту, ввімкнувши  аварійну  світлову сигналізацію або встановивши ззаду на транспортному засобі знак аварійної зупинки."],"provisional_correct_index":null},{"id":"43-017","topic":"43","number":17,"question":"У якому місці водій мотоцикла повинен зупинити свій транспортний засіб на залізничному переїзді?","options":["Перед шлагбаумом, якщо немає розмітки \"стоп-лінія\".","Перед дорожньою розміткою «стоп-лінія».","У будь-якому з місць, перелічених вище."],"provisional_correct_index":null},{"id":"43-018","topic":"43","number":18,"question":"Чим повинен керуватися водій мотоцикла під час проїзду залізничного переїзду?","options":["Світловою і звуковою сигналізацією.","Вказівками і сигналами чергового по переїзду.","Положенням шлагбаума.","Дорожньої розміткою.","Усім переліченим вище."],"provisional_correct_index":2},{"id":"43-019","topic":"43","number":19,"question":"За яких умов дозволено перевозити дітей на задньому сидінні мотоцикла та мопеда?","options":["Якщо зріст дитини 150 см і більше.","Якщо зріст дитини менше 145 см.","Якщо дитина досягла 12-річного віку."],"provisional_correct_index":2},{"id":"43-020","topic":"43","number":20,"question":"Що з переліченого екіпірування для водіїв транспортних засобів категорій А, А1 є обов'язковим до застосування?","options":["Спеціальні бутси та рукавички.","Мотошолом.","Захисний одяг."],"provisional_correct_index":null},{"id":"43-021","topic":"43","number":21,"question":"Що з переліченого екіпірування водіям транспортних засобів категорій А, А1 рекомендується до застосування?","options":["Спеціальні бутси, рукавички, захисний одяг.","Речовий рюкзак, шарф.","Пляшка з водою."],"provisional_correct_index":0},{"id":"43-022","topic":"43","number":22,"question":"Чи обов'язково застібати мотошолом під час руху зі швидкістю до 15 км/год.?","options":["Не обов'язково.","Обов'язково, коли швидкість перевищує 15 км/год.","Обов'язково у будь-якому випадку."],"provisional_correct_index":1},{"id":"43-023","topic":"43","number":23,"question":"Чи можна знімати мотошолом під час руху?","options":["Можна, якщо він обмежує оглядовість.","Не можна в жодному разі.","Можна, коли швидкість не перевищує 10 км/год."],"provisional_correct_index":0},{"id":"43-024","topic":"43","number":24,"question":"Чи можна перевозити пасажирів без мотошоломів?","options":["Так, можна.","Не можна – тільки в мотошоломі.","Не можна – тільки в застебнутому мотошоломі."],"provisional_correct_index":2},{"id":"43-025","topic":"43","number":25,"question":"Чи варто враховувати обмежену видимість мотоцикла в дзеркалі автомобіля, що їде попереду, під час виконання обгону або об'їзду?","options":["Не варто: мотоцикл видно так само, як і автомобіль.","Не варто, якщо мотоцикл набагато голосніше працює.","Обов'язково варто враховувати."],"provisional_correct_index":1},{"id":"43-026","topic":"43","number":26,"question":"Що варто враховувати мотоциклістові під час під'їзду до автопоїзда?","options":["Довжину автопоїзда.","Смугу руху автопоїзда.","Наявність \"сліпих\" зон, коли водій автопоїзда не бачить водія мотоцикла."],"provisional_correct_index":2},{"id":"43-027","topic":"43","number":27,"question":"Що дозволяється робити мотоциклістові в разі затору?","options":["Дозволяється проїхати між транспортними засобами ближче до перехрестя.","Дозволяється об'їхати потік, що стоїть, узбіччям.","Зупинитись, оцінити обстановку, продовжити рух лише переконавшись, що подальший шлях вільний для руху."],"provisional_correct_index":2},{"id":"43-028","topic":"43","number":28,"question":"Що зобов'язаний зробити водій мотоцикла перед виїздом?","options":["Перевірити  й  забезпечити  технічно  справний  стан   і  комплектність транспортного засобу, правильність розміщення та кріплення вантажу.","Перевірити наявність насоса, а також буксирувального троса.","Усе перелічене вище."],"provisional_correct_index":2},{"id":"43-029","topic":"43","number":29,"question":"Для  забезпечення  безпеки  дорожнього  руху  водій  мотоцикла зобов'язаний...","options":["Завжди вмикати габаритні ліхтарі.","Не вчиняти дій, у результаті яких   може бути пошкоджено автомобільні дороги та їхні складові, а також завдано шкоди користувачам.","Не створювати своїми діями загрози безпеці дорожнього руху.","Усе перелічене вище.","Відповіді 2 і 3."],"provisional_correct_index":2},{"id":"43-030","topic":"43","number":30,"question":"Як ви повинні вчинити в ситуації, коли автомобіль, що їде перед вами, спочатку почав знижувати швидкість, а потім  і зовсім зупинився перед нерегульованим пішохідним переходом?","options":["Подати звуковий сигнал і знизити швидкість руху.","Знизити швидкість і обережно проїхати пішохідний перехід.","Зменшити швидкість (у разі потреби – зупинитися) і продовжити рух, тільки переконавшись, що на пішохідному переході немає пішоходів, для яких може бути створена перешкода чи небезпека."],"provisional_correct_index":0},{"id":"43-031","topic":"43","number":31,"question":"На  якій  відстані  до  зустрічного транспортного  засобу  необхідно переключити дальнє світло на ближнє в темний час доби рухаючись на мотоциклі?","options":["На відстані не менше 100 м.","На відстані не менше 150 м.","На відстані не менше 250 м.","На відстані не менше 300 м."],"provisional_correct_index":null},{"id":"43-032","topic":"43","number":32,"question":"Як повинен вчинити водій мотоцикла, який рухається  з дальнім світлом фар у темний час доби, якщо водії зустрічних транспортних засобів, що  знаходяться на  відстані  більше  ніж  250  м,  періодично перемикають світло фар?","options":["Негайно переключитися на ближнє світло.","Негайно переключитися на протитуманні фари.","Переключитися на ближнє світло тільки на відстані 250 м."],"provisional_correct_index":2},{"id":"43-033","topic":"43","number":33,"question":"Водії мотоциклів та мопедів можуть перетинати залізничні колії лише:","options":["На залізничних переїздах з шлагбаумом.","На залізничних переїздах без шлагбаума.","У будь-якому місці, де залізничні колії добре проглядаються.","На будь-якому залізничному переїзді.","Відповіді 3 і 4."],"provisional_correct_index":2},{"id":"43-034","topic":"43","number":34,"question":"Ви рухалися на мотоциклі без коляски. Тепер Ви пересіли на мотоцикл з коляскою (коляска справа, без гальм). Що зміниться?","options":["При поворотах ліворуч коляска може відірватися від землі.","При гальмуванні мотоцикл з коляскою тягне вліво.","Відповіді 1 і 2."],"provisional_correct_index":0},{"id":"44-001","topic":"44","number":1,"question":"Ви, як водій автомобіля, маєте право використовувати узбіччя:","options":["Для руху.","Для зупинки та стоянки.","Відповіді, зазначені в пунктах 1, 2."],"provisional_correct_index":1},{"id":"44-002","topic":"44","number":2,"question":"З якого віку надається право на керування транспортними засобами категорії В?","options":["З 16 років.","З 18 років.","З 19 років.","З 21 року."],"provisional_correct_index":1},{"id":"44-003","topic":"44","number":3,"question":"Яку максимальну швидкість руху встановлено в населених пунктах, позначених даним дорожнім знаком?","options":["50 км/год.","60 км/год.","70 км/год.","80 км/год."],"provisional_correct_index":0},{"id":"44-004","topic":"44","number":4,"question":"Кожна особа, під час проходження навчання практичному водінню на легковому автомобілі (категорія В), зобов'язана отримати:","options":["Практичне керування автомобілем на майданчику.","Практичне керування автомобілем на майданчику в темну пору доби.","Навички руху заднім ходом за допомогою дзеркал заднього виду.","Відповіді 1, 2 і 3 правильні."],"provisional_correct_index":3},{"id":"44-005","topic":"44","number":5,"question":"Рухаючись у темну пору доби, водій механічного транспортного засобу незалежно від ступеня освітлення дороги повинен ввімкнути такі зовнішні світлові пристрої:","options":["Габаритні ліхтарі.","Фари ближнього або дальнього світла.","Протитуманні фари і задній протитуманний ліхтар."],"provisional_correct_index":1},{"id":"44-006","topic":"44","number":6,"question":"У якому місці повинні здійснюватися зупинка і стоянка транспортного засобу на дорозі?","options":["У спеціально відведених місцях.","На узбіччі.","Відповіді 1 і 2."],"provisional_correct_index":2},{"id":"44-007","topic":"44","number":7,"question":"Що повинен враховувати водій під час вибору безпечної дистанції та інтервалу?","options":["Швидкість руху.","Дорожню обстановку.","Особливості вантажу, що перевозиться.","Стан транспортного засобу.","Відповіді 1, 2, 3 і 4."],"provisional_correct_index":4},{"id":"44-008","topic":"44","number":8,"question":"Як має рухатися нерейковий транспортний засіб на дорозі, яка має по дві й  більше  смуг  для  руху  в кожному  напрямку,  вільній  від інших транспортних засобів, якщо немає необхідності виконувати маневри?","options":["Якнайближче до правого краю проїзної частини.","У будь-якій смузі – на розсуд водія.","Продовжувати рух по тій самій смузі де і їхав."],"provisional_correct_index":0},{"id":"44-009","topic":"44","number":9,"question":"Водій, який рухається по перехрестю, де організовано круговий рух, не маючи наміру змінювати своєї смуги, зобов'язаний:","options":["Включити лівий поворот, щоб показати всім свій рух по колу.","Включити правий поворот, щоб попередити всіх, що він скоро поїде праворуч.","Не вмикати покажчики поворотів, поки він рухається по одній смузі."],"provisional_correct_index":2},{"id":"44-010","topic":"44","number":10,"question":"Рухаючись  поза  населеним  пунктом  у  світлу  пору  доби,  водій механічного транспортного засобу повинен увімкнути:","options":["Аварійну світлову сигналізацію.","Денні ходові вогні, а в разі їх відсутності у конструкції транспортного засобу – дальнє світло фар.","Денні ходові вогні, а в разі їх відсутності у конструкції транспортного засобу – ближнє світло фар."],"provisional_correct_index":2},{"id":"44-011","topic":"44","number":11,"question":"Де заборонене подавання звукового сигналу?","options":["У населених пунктах, окрім випадків, коли без цього неможливо запобігти дорожньо-транспортній пригоді.","Поза населеними пунктами, в місцях, де встановлений знак «Подавання звукового сигналу заборонено», крім випадків, коли без цього неможливо запобігти дорожньо-транспортній пригоді.","Відповіді 1 і 2."],"provisional_correct_index":2},{"id":"44-012","topic":"44","number":12,"question":"Ви рухаєтесь на автомобілі, у    якого несправні світлові покажчики поворотів, але Вам необхідно повернути праворуч. Ваші дії:","options":["Витягнете праву руку в праву сторону і зігнете під прямим кутом вгору.","Витягнете ліву руку в ліву сторону.","Витягнете ліву руку в ліву сторону у вікно і зігнете під прямим кутом вгору."],"provisional_correct_index":2},{"id":"44-013","topic":"44","number":13,"question":"Що з переліченого нижче входить в обов'язки учасників дорожнього руху?","options":["Бути уважним, стежити за дорожньою обстановкою.","Не забруднювати проїзну частину та смугу відведення автомобільних доріг.","Не створювати своїми діями загрози безпеці дорожнього руху.","Повідомляти дорожньо-експлуатаційним організаціям про виявлені факти створення перешкод для дорожнього руху.","Відповіді 1,2,3,4 входять в обов’язки."],"provisional_correct_index":4},{"id":"44-014","topic":"44","number":14,"question":"Які документи повинен мати при собі водій механічного транспортного засобу?","options":["Реєстраційний документ на транспортний засіб.","Посвідчення водія на право керування транспортним засобом відповідної категорії  і поліс (сертифікат) обов'язкового страхування цивільно-правової відповідальності власників наземних транспортних засобів (крім водіїв, які відповідно  до  законодавства  звільняються  від  обов’язкового  страхування цивільно-правової відповідальності власників наземних транспортних засобів на території України).","Генеральна довіреність на транспортний засіб або тимчасовий реєстраційний талон.","Усе перелічене вище.","Відповіді 1 і 2."],"provisional_correct_index":4},{"id":"44-015","topic":"44","number":15,"question":"Яку максимальну кількість пасажирів має право перевозити водій з категорією “В”?","options":["Менше дев'яти.","Більше сімнадцяти.","Більше дев'яти."],"provisional_correct_index":0},{"id":"44-016","topic":"44","number":16,"question":"Зміст навчального матеріалу та кількість практичних годин для проходження навчання практичному водінню на легковому автомобілі (категорія В), визначається:","options":["Кожним навчальним закладом самостійно, в залежності від рівня вмінь особи, що навчається.","Кожним спеціалістом з практичного навчання самостійно, в залежності від рівня вмінь особи, що навчається.","Типовою навчальною програмою  підготовки  та  перепідготовки  водіїв транспортних засобів."],"provisional_correct_index":2},{"id":"45-001","topic":"45","number":1,"question":"Недостатньою видимістю вважається:","options":["Видимість дороги в напрямку руху менше 300 метрів, обмежена поворотом дороги.","Видимість дороги в напрямку руху менше 300 м у сутінках, в умовах туману, дощу, снігопаду тощо.","Небезпечний поворот, небезпечний підйом, небезпечний спуск."],"provisional_correct_index":1},{"id":"45-002","topic":"45","number":2,"question":"Що означає вимога дати дорогу?","options":["Вимога до учасника дорожнього руху не продовжувати або не відновлювати рух, не здійснювати будь-яких маневрів (за винятком вимоги звільнити займану смугу руху), якщо це може примусити інших учасників дорожнього руху, які мають перевагу, змінити напрямок руху або швидкість.","Вимога обов'язкової зупинки, щоб дати дорогу всім учасникам дорожнього руху.","Вимога обов'язкової зупинки перед дорожнім знаком «Дати дорогу»."],"provisional_correct_index":0},{"id":"45-003","topic":"45","number":3,"question":"Перехрестям вважається:","options":["Перехрещення, прилягання або розгалуження доріг на одному рівні, межею якого є уявні лінії між початком заокруглень країв проїзної частини кожної з доріг та яке не є виїздом з прилеглих територій.","Місце перетину дороги над іншою   дорогою (залізницею) на різних рівнях за допомогою шляхопроводу.","Місце прилягання до дороги виїзду з прилеглої території.","Відповіді, зазначені в пунктах 2, 3."],"provisional_correct_index":0},{"id":"45-004","topic":"45","number":4,"question":"Що з переліченого нижче відповідає терміну «видимість у напрямку руху»?","options":["Мінімальна відстань, на якій з місця водія можна побачити «стоп-лінію».","Максимальна відстань вправо від напрямку руху, на якому можна розпізнати транспортні засоби, що наближаються до перехрестя по головній дорозі.","Максимальна відстань, на якій з місця водія можна чітко розпізнати межі елементів  дороги  та  розміщення  учасників  руху, що  дає  змогу  водієві орієнтуватися під час керування транспортним засобом."],"provisional_correct_index":2},{"id":"45-005","topic":"45","number":5,"question":"За наявності якої несправності дозволяється експлуатація транспортного засобу?","options":["Не працюють запори горловин паливних баків.","Не працює механізм регулювання сидіння водія.","Не працює пристрій для обігрівання та обдування скла.","Не працює склопідйомник."],"provisional_correct_index":3},{"id":"45-006","topic":"45","number":6,"question":"Яку максимальну кількість пасажирів Ви, як водій з категорією В, маєте право перевозити?","options":["Не більше 9, не враховуючи місце водія.","Не більше 9 з урахуванням місця водія.","Не більше 7.","Не більше 5."],"provisional_correct_index":1},{"id":"45-007","topic":"45","number":7,"question":"У якому випадку дозволяється експлуатація транспортного засобу?","options":["Порушено регулювання фар.","На світлових приладах використовуються розсіювачі, що не відповідають типу конкретного світлового приладу.","Відсутні протитуманні фари."],"provisional_correct_index":2},{"id":"45-008","topic":"45","number":8,"question":"Ви маєте право експлуатувати легковий автомобіль за відсутності:","options":["Аптечки.","Вогнегасника.","Знака аварійної зупинки.","Противідкатних упорів."],"provisional_correct_index":3},{"id":"45-009","topic":"45","number":9,"question":"У разі виникнення якої несправності заборонено подальший рух навіть до місця ремонту або стоянки?","options":["Несправна  робоча  гальмова  система  не  дає  змоги  водієві  зупинити транспортний засіб при русі навіть з мінімальною швидкістю.","Несправна система випуску відпрацьованих газів.","Не працює склоочисник."],"provisional_correct_index":0},{"id":"45-010","topic":"45","number":10,"question":"Для чого здійснюють балансування коліс?","options":["Для запобігання биттю колеса під    час руху.","Для зменшення витрати палива.","Для покращення аеродинамічних показників автомобіля."],"provisional_correct_index":0},{"id":"45-011","topic":"45","number":11,"question":"На автомобілі з автоматичною коробкою передач щоб зняти автомобіль з позиції P необхідно натиснути педаль гальма:","options":["Так, неможливо зняти не натиснувши на педаль гальма.","Не потрібно натискати, достатньо переключити у необхідне положення."],"provisional_correct_index":0},{"id":"45-012","topic":"45","number":12,"question":"Під час руху на автомобілі загорівся попереджувальний індикатор № 4, це означає:","options":["Несправність акумулятора.","Падіння рівня моторного масла.","Несправність гальмової системи.","Високу температуру теплоносія."],"provisional_correct_index":0},{"id":"45-013","topic":"45","number":13,"question":"Під час руху на автомобілі загорівся попереджувальний індикатор № 1, це означає:","options":["Несправність акумулятора.","Падіння тиску в системі змащування або низький рівень масла.","Несправність гальмової системи.","Високу температуру теплоносія."],"provisional_correct_index":1},{"id":"45-014","topic":"45","number":14,"question":"Виберіть індикатор, що відображає увімкнення ближнього світла фар:","options":["А.","В.","С. ачинені двері?","options":["1.","2.","3.","4."],"provisional_correct_index":2},{"id":"45-032","topic":"45","number":32,"question":"Який із наведених індикаторів попереджає водія транспортного засобу про перегрів двигуна?","options":["1.","2.","3.","4."],"provisional_correct_index":3},{"id":"45-033","topic":"45","number":33,"question":"Цей індикатор вказує, що в автомобілі увімкнено:","options":["Протитуманні фари.","Ближнє світло фар.","Дальнє світло фар."],"provisional_correct_index":2},{"id":"46-001","topic":"46","number":1,"question":"В яких випадках водій має право відступати від вимог законодавства?","options":["В умовах дії непереборної сили.","Коли іншими засобами неможливо запобігти власній загибелі чи каліцтву громадян.","У випадках, зазначених в пунктах 1 та/або 2."],"provisional_correct_index":2},{"id":"46-002","topic":"46","number":2,"question":"Яка необхідна умова при огляді на предмет алкогольного сп’яніння водія на місці зупинки транспортного засобу?","options":["Присутність двох свідків та поліцейського.","Присутність двох свідків.","Присутність одного понятого.","Присутність щонайменше двох поліцейських."],"provisional_correct_index":1},{"id":"46-003","topic":"46","number":3,"question":"Приогляді Вашогоавтомобіля необхідноюумовою є:","options":["Присутність щонайменше двох свідків та двох поліцейських.","Присутність одного понятого та двох поліцейських.","Присутність двох понятих.","Присутність щонайменше двох поліцейських."],"provisional_correct_index":2},{"id":"46-004","topic":"46","number":4,"question":"При особистому огляді і огляді речей необхідною умовою є:","options":["Присутність двох понятих.","Присутність щонайменше двох свідків.","Присутність одного понятого.","Присутність щонайменше двох поліцейських."],"provisional_correct_index":0},{"id":"46-005","topic":"46","number":5,"question":"За які правопорушення Вас може бути позбавлено права керування транспортним засобом?","options":["За керування транспортним засобом в стані алкогольного, на :33,"question":"З яких основних частин складається двигун внутрішнього згоряння?","options":["Головка блоку циліндрів з газорозподільним механізмом.","Блок циліндрів з кривошипно-шатунним механізмом і оливним піддоном.","З наведених вище частин."],"provisional_correct_index":2},{"id":"53-034","topic":"53","number":34,"question":"Чи потрібна система запалювання для дизельного двигуна?","options":["Потрібна обов'язково.","Потрібна частково.","Не потрібна."],"provisional_correct_index":2},{"id":"53-035","topic":"53","number":35,"question":"Для чого необхідна муфта зчеплення в трансмісії?","options":["Для тимчасового від'єднання двигуна від трансмісії.","Для плавного приєднання двигуна до трансмісії.","Для згладжування вібрацій.","Усі перелічені вище варіанти."],"provisional_correct_index":3},{"id":"53-036","topic":"53","number":36,"question":"Для чого здійснюють балансування шин?","options":["Для запобігання биттю колеса під час руху.","Для зменшення витрати палива.","Для покращення аеродинамічних показників автомобіля."],"provisional_correct_index":0},{"id":"53-037","topic":"53","number":37,"question":"Які бувають типи шин?","options":["Штамповані та литі.","Дискові та бездискові.","Камерні і безкамерні."],"provisional_correct_index":1},{"id":"53-038","topic":"53","number":38,"question":"Чи потрібно замінювати оливний  фільтр  під  час  заміни  моторної оливи?","options":["Завжди після зливання моторної оливи необхідно замінювати оливний фільтр.","Якщо знову використовувати злиту оливу, можна не заміняти фільтр.","Можна не замінювати оливний фільтр під час заміни моторної оливи."],"provisional_correct_index":0},{"id":"53-039","topic":"53","number":39,"question":"Що буде, якщо значно перевищити рівень моторної оливи в двигуні?","options":["Нічого не буде, зайва олива вигорить.","Впаде потужність двигуна через більший опір обертанню.","Може пошкодитися оливний насос.","Через спінювання оливи може впасти її тиск і виникнути оливне голодування."],"provisional_correct_inde <script src="study-home-4-3-images.js"></script>
<script>
'use strict';
/* ====== ДАНІ (база запитань не змінюється) ====== */
const db=JSON.parse(document.getElementById('data').textContent);
const qs=db.questions,topics=db.topics;
const byId=new Map(qs.map(q=>[q.id,q]));
const topicById=new Map(topics.map(t=>[t.id,t]));
const hasKey=q=>q.provisional_correct_index!==null&&q.provisional_correct_index!==undefined;

/* ====== ЗБЕРЕЖЕННЯ (той самий ключ, що у 4.0 / 4.1 / 4.2) ====== */
const KEY='studyhome_pdr_v4_test';
/* 4.3: власний ключ для незавершеного тесту (формат 4.3 містить відповіді); ключ 4.2 не чіпаємо */
const SESSION_KEY='studyhome_pdr_v4_test_session_v43';
/* 4.3: одноразова копія прогресу у тому вигляді, в якому він був до першого запуску 4.3 */
const PRE43_KEY='studyhome_pdr_v4_test_backup_before_4_3';
const HISTORY_MAX=40,REVIEW_MAX=20;
const DAY=24*3600*1000,BACKUP_EVERY=7*DAY,BACKUP_SNOOZE=3*DAY;
/* Категорії: склад визначено за назвами тем у базі (див. CATEGORY_INFO). Офіційно не звірено. */
const CATEGORIES={
  B:{label:'B (B1, B)',topics:['44','45','46','47']},
  A:{label:'A (A1, A)',topics:['40','41','42','43']},
  C:{label:'C (C1, C)',topics:['48','49','50','51']},
  D:{label:'D (D1, D)',topics:['52','53','54','55']},
  E:{label:'BE, C1E, CE, D1E, DE',topics:['56','57','58','59']},
  T:{label:'T',topics:['60','61','62','63']},
  ALL:{label:'Усі теми (як у 4.2)',topics:null}
};
const CATEGORY_INFO='Склад категорій визначено за назвами тем у базі: теми 1–39 — загальні для всіх, теми 40–63 — додаткові для окремих категорій. Назви тем 41–43 і 62 у базі обрізані, тому їхню належність визначено за сусідніми темами. Склад офіційно не звірено з програмою ГСЦ МВС.';
const DEFAULTS={coins:0,xp:0,wrong:[],history:[],owned:[],totalAnswered:0,hidden:[],wall:'wall-lav',floor:'floor-honey',layout:{},category:'B',lastBackupAt:0,backupSnoozeUntil:0};
const clampN=(n,a,b)=>Math.min(b,Math.max(a,n));
const nonNeg=v=>{const n=Number(v);return Number.isFinite(n)&&n>0?Math.floor(n):0};
function sanitizeReview(r){
  if(!Array.isArray(r))return undefined;
  return r.filter(x=>x&&typeof x==='object'&&typeof x.id==='string').slice(0,REVIEW_MAX).map(x=>({
    id:x.id,n:nonNeg(x.n),sel:Number.isInteger(x.sel)&&x.sel>=0?x.sel:null,key:Number.isInteger(x.key)&&x.key>=0?x.key:null}));
}
function sanitize(o){
  const s={...DEFAULTS,...(o&&typeof o==='object'&&!Array.isArray(o)?o:{})};
  for(const k of ['coins','xp','totalAnswered','lastBackupAt','backupSnoozeUntil'])s[k]=nonNeg(s[k]);
  for(const k of ['wrong','owned','hidden']){s[k]=Array.isArray(s[k])?[...new Set(s[k].filter(x=>typeof x==='string'))]:[]}
  s.history=Array.isArray(s.history)?s.history.filter(h=>h&&typeof h==='object'&&!Array.isArray(h)).slice(0,HISTORY_MAX).map(h=>{
    if(h.review===undefined)return h;const r=sanitizeReview(h.review);const c={...h};if(r)c.review=r;else delete c.review;return c}):[];
  if(typeof s.wall!=='string')s.wall=DEFAULTS.wall;
  if(typeof s.floor!=='string')s.floor=DEFAULTS.floor;
  if(!Object.prototype.hasOwnProperty.call(CATEGORIES,s.category))s.category=DEFAULTS.category;
  const lay={};
  if(s.layout&&typeof s.layout==='object'&&!Array.isArray(s.layout)){
    for(const [id,v] of Object.entries(s.layout)){
      if(!v||typeof v!=='object')continue;
      const dx=Number(v.dx),dy=Number(v.dy);
      if(Number.isFinite(dx)&&Number.isFinite(dy))lay[id]={dx:Math.round(clampN(dx,-100,100)*10)/10,dy:Math.round(clampN(dy,-100,100)*10)/10};
    }
  }
  s.layout=lay;
  return s;
}
/* Стан сховища: storageOk — чи вдається читати/писати; saveFailed — останній запис не вдався */
let storageOk=true,saveFailed=false,loadNotice='';
function probeStorage(){
  try{const k=KEY+'__probe';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageOk=false;return null}
  if(!raw)return null;
  /* 4.3: перед першим запуском зберігаємо копію прогресу 4.2 (лише один раз) */
  try{if(localStorage.getItem(PRE43_KEY)===null)localStorage.setItem(PRE43_KEY,JSON.stringify({savedAt:new Date().toISOString(),raw}))}catch(_){}
  try{return JSON.parse(raw)}
  catch(e){
    try{localStorage.setItem(KEY+'_corrupt_backup',raw)}catch(_){}
    loadNotice='Збережені дані були пошкоджені й не прочитались. Їхню копію збережено в браузері, гра почалась із нуля. Якщо маєш резервний код — віднови прогрес у розділі «Історія».';
    return null;
  }
}
storageOk=probeStorage();
let state=sanitize(load());
function save(){
  let ok=true;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){ok=false}
  const was=saveFailed;saveFailed=!ok;if(ok)storageOk=true;
  if(saveFailed!==was)showStorageBanner(!was&&saveFailed?'fail':'recovered');
  return ok;
}
/* 4.3: помітне повідомлення про проблеми збереження (не зникає, поки проблема є) */
function showStorageBanner(change){
  let b=document.getElementById('saveBanner');
  const problem=saveFailed||!storageOk;
  if(!problem&&!loadNotice){if(b)b.remove();if(change==='recovered')toast('✅ Збереження знову працює');return}
  if(!b){b=document.createElement('div');b.id='saveBanner';b.className='save-banner';b.setAttribute('role','alert');document.body.insertBefore(b,document.getElementById('app'))}
  const msg=problem?
    (saveFailed?'⚠️ Прогрес НЕ збережено: браузер відхилив запис. Не закривай сторінку — зроби резервну копію.':'⚠️ Браузер не дозволяє зберігати прогрес (можливо, приватний режим або вимкнене сховище). Прогрес зникне після закриття сторінки.')
    :'ℹ️ '+loadNotice;
  b.innerHTML=`<span>${esc(msg)}</span><span class="sb-act"><button class="btn small" data-sb="backup">💾 Копія</button>${problem?'':'<button class="btn small soft" data-sb="close">✕</button>'}</span>`;
  b.querySelector('[data-sb="backup"]').onclick=()=>go('history');
  const c=b.querySelector('[data-sb="close"]');if(c)c.onclick=()=>{loadNotice='';b.remove()};
  if(change==='fail')toast('⚠️ Не вдалося зберегти прогрес');
}
function needsBackupReminder(){
  const meaningful=state.totalAnswered>=30||state.owned.length>0||state.history.length>=3;
  const now=Date.now();
  return meaningful&&now-state.lastBackupAt>BACKUP_EVERY&&now>state.backupSnoozeUntil;
}

/* ====== ДОПОМІЖНЕ ====== */
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const $=s=>document.querySelector(s);
const tName=t=>String(t&&t.name||'').replace(/\s+/g,' ').trim();
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const level=()=>Math.floor(state.xp/100)+1;
const levelPct=()=>state.xp%100;
const validWrong=()=>state.wrong.filter(id=>{const q=byId.get(id);return q&&hasKey(q)});
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}

function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('in');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('in'),2200)}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#b9a3e3','#f3c97a','#f2b8c6','#9ec5e8','#a8d5b5','#c48f60'];for(let i=0;i<40;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];p.style.animationDelay=Math.random()*.4+'s';p.style.animationDuration=1+Math.random()*.9+'s';c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}
function modal({icon='',title='',text='',html='',ok='Гаразд',cancel=''}){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal-bg';
    m.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${icon?`<div class="m-icon">${icon}</div>`:''}<h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${html}<div class="m-actions">${cancel?`<button class="btn soft" data-r="0">${esc(cancel)}</button>`:''}<button class="btn" data-r="1">${esc(ok)}</button></div></div>`;
    let done=false;const opened=Date.now();
    const close=v=>{if(done)return;done=true;m.classList.remove('in');m.classList.add('out');setTimeout(()=>m.remove(),200);res(v)};
    /* 4.2: випадковий другий дотик (подвійний тап на iPhone) не закриває вікно одразу */
    m.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b){if(Date.now()-opened>250)close(b.dataset.r==='1')}else if(e.target===m&&Date.now()-opened>400)close(false)});
    document.body.appendChild(m);requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('in')));
  });
}

/* 4.3: консервативний список ID запитань, які ДОСТОВІРНО посилаються на відсутнє зображення

  const src=(typeof window!=='undefined'&&window.STUDY_HOME_IMAGES&&typeof window.STUDY_HOME_IMAGES==='object')?window.STUDY_HOME_IMAGES:{};
  const safe=p=>typeof p==='string'&&p.length<200&&!p.includes('..')&&!/^[a-z]+:/i.test(p)&&/^[\w\-./]*$/.test(p);
  const base=safe(src.base)?src.base:'img/questions/';
  const map=new Map();
  const items=src.items&&typeof src.items==='object'?src.items:{};
  for(const [id,v] of Object.entries(items)){
    if(!byId.has(id)||!v||typeof v!=='object'||!safe(v.file)||!/\.(webp|png|jpe?g|gif|svg)$/i.test(v.file))continue;

function sizeSvg(s){return s.replace(/<svg viewBox="0 0 ([\d.]+) ([\d.]+)"(?![^>]*\swidth=)/,'<svg viewBox="0 0 $1 $2" width="$1" height="$2"')}
function svgFor(name){let s=SVG[name]||'';if(name==='clock'){const d=new Date();s=s.replace('__H',((d.getHours()%12)*30+d.getMinutes()/2).toFixed(1)).replace('__M',(d.getMinutes()*6).toFixed(1))}return sizeSvg(s)}
function art(g){return g.svg?svgFor(g.svg):`<span class="emo">${g.emoji}</span>`}
function isNight(){const h=new Date().getHours();return h<7||h>=20}

/* 4.2: позиція предмета з урахуванням опори (свічки без полиці стоять на столі) і зсуву гравця */
function basePos(g){return g.on&&g.alt&&!shown(g.on)?g.alt:g.pos}
function clampOffset(g,dx,dy){
  const p=basePos(g);
  dx=clampN(dx,-p.w/2-p.x,100-p.w/2-p.x);
  dy=p.t!==undefined?clampN(dy,-p.t,92-p.t):clampN(dy,p.b-92,p.b+2);
  return {dx:Math.round(dx*10)/10,dy:Math.round(dy*10)/10};
}
function itemStyle(g){
  const p=basePos(g);const o0=g.id[0]==='_'?null:state.layout[g.id];
  /* 4.3: межі перевіряються і під час відображення (напр., свічки змінили опору) */
  const o=o0?clampOffset(g,o0.dx,o0.dy):null;
  const dx=o?o.dx:0,dy=o?o.dy:0;
  const vert=p.t!==undefined?`top:${(p.t+dy).toFixed(1)}%`:`bottom:${(p.b-dy).toFixed(1)}%`;
  return `left:${(p.x+dx).toFixed(1)}%;${vert};width:${p.w}%;z-index:${p.z}`;
}
let arrange=false,selItem=null;
function sceneHTML(editable){
  const wall=owns(state.wall)?state.wall:'wall-lav',floor=owns(state.floor)?state.floor:'floor-honey';
  const items=[...BASE,...goods.filter(g=>!isTheme(g)&&shown(g.id))].sort((a,b)=>basePos(a).z-basePos(b).z);
  const anyOwned=goods.some(g=>!isTheme(g)&&owns(g.id));
  const edit=!!(editable&&arrange);
  return `<div class="scene ${isNight()?'night':''} ${edit?'arranging':''}" id="scene" data-edit="${edit?1:0}"><div class="wall ${wall}"></div><div class="floor ${floor}"></div>${items.map(g=>{const p=basePos(g);const fs=g.emoji?`<span class="emo" style="font-size:calc(${p.w} * min(0.82vw, 6.9px));font-size:${(p.w*0.92).toFixed(2)}cqw">${g.emoji}</span>`:svgFor(g.svg);return `<div class="it ${g.pet?'pet':''} ${g.id[0]!=='_'?'tap':''} ${edit&&selItem===g.id?'sel':''}" data-it="${g.id}" style="${itemStyle(g)}">${fs}</div>`}).join('')}<div class="shade"></div>${anyOwned?'':'<div class="empty-hint">🛍️ Купуй речі в магазині — вони з’являться тут</div>'}</div>`;
}
function bindScene(){
  const sc=$('#scene');if(!sc)return;
  if(sc.dataset.edit!=='1'){
    sc.onclick=e=>{const el=e.target.closest('.it.tap');if(!el)return;el.classList.remove('wig');void el.offsetWidth;el.classList.add('wig');const g=goodById.get(el.dataset.it);if(g)toast((g.emoji||'✨')+' '+g.name)};
    return;
  }
  /* Режим розстановки: перетягування пальцем (Pointer Events, iOS 13+) */
  sc.onclick=null;let drag=null;
  sc.onpointerdown=e=>{
    const el=e.target.closest('.it.tap');if(!el)return;
    const g=goodById.get(el.dataset.it);if(!g)return;
    e.preventDefault();selectItem(g.id);
    const o0=state.layout[g.id]||{dx:0,dy:0};const o=clampOffset(g,o0.dx,o0.dy);const r=sc.getBoundingClientRect();
    drag={el,g,id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:o.dx,dy:o.dy,w:r.width,h:r.height,moved:false};
    /* 4.3: жест захоплює сцена — елемент предмета має pointer-events:none */
    try{sc.setPointerCapture(e.pointerId)}catch(_){}
  };
  sc.onpointermove=e=>{
    if(!drag||e.pointerId!==drag.id)return;e.preventDefault();
    const ddx=(e.clientX-drag.sx)/drag.w*100,ddy=(e.clientY-drag.sy)/drag.h*100;
    if(Math.abs(ddx)+Math.abs(ddy)>0.5)drag.moved=true;
    state.layout[drag.g.id]=clampOffset(drag.g,drag.dx+ddx,drag.dy+ddy);
    drag.el.style.cssText=itemStyle(drag.g);
  };
  const end=e=>{if(!drag||e.pointerId!==drag.id)return;if(drag.moved)save();drag=null};
  sc.onpointerup=end;sc.onpointercancel=end;
}
function selectItem(id){
  selItem=id;
  document.querySelectorAll('#scene .it').forEach(el=>el.classList.toggle('sel',el.dataset.it===id));
  document.querySelectorAll('[data-pick]').forEach(b=>b.classList.toggle('on',b.dataset.pick===id));
  const g=goodById.get(id);const lab=$('#selName');if(lab)lab.textContent=g?(g.emoji||'✨')+' '+g.name:'Торкнись предмета в кімнаті';
  document.querySelectorAll('[data-mv],[data-reset],[data-hide]').forEach(b=>b.disabled=!g);
}
function nudge(dx,dy){
  const g=goodById.get(selItem);if(!g||!shown(g.id))return;
  const o0=state.layout[g.id]||{dx:0,dy:0};const o=clampOffset(g,o0.dx,o0.dy);
  state.layout[g.id]=clampOffset(g,o.dx+dx,o.dy+dy);save();
  const el=document.querySelector(`#scene .it[data-it="${g.id}"]`);if(el)el.style.cssText=itemStyle(g);
}
