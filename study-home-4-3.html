er":7,"question":"Як повинен водій позначити місце дорожньо-транспортної пригоди?","options":["Ввімкнути габаритні ліхтарі, а також встановити знак аварійної зупинки.","Ввімкнути тільки аварійну сигналізацію","Ввімкнути аварійну сигналізацію, а також установити знак аварійної зупинки чи миготливий червоний ліхтар."],"provisional_correct_index":2},{"id":"9-008","topic":"9","number":8,"question":"На якому малюнку водій правильно подав сигнал про початок руху?","options":["На першому.","На другому.","На третьому."],"provisional_correct_index":0},{"id":"9-009","topic":"9","number":9,"question":"Ви водій, рухаючись на сірому автомобілі вирішили повернути праворуч на другому перехресті. Ви:","options":["Включите покажчик повороту як показано на малюнку.","Проїдете перше перехрестя і включите покажчик повороту, щоб не вводити в оману водія білого автомобіля.","Включите покажчик повороту, як показано на малюнку,  і для запобігання дорожньо-транспортної пригодити  з білим  автомобілем, попередити його звуковим сигналом."],"provisional_correct_index":1},{"id":"9-010","topic":"9","number":10,"question":"Які попереджувальні сигнали вмикаються на транспортному засобі, що буксирується?","options":["Ближнє світло фар і аварійна сигналізація.","Тільки ближнє світло фар.","Тільки аварійна сигналізація."],"provisional_correct_index":2},{"id":"9-011","topic":"9","number":11,"question":"На якому малюнку водій правильно подав сигнал перед поворотом праворуч у разі несправності світлових покажчиків повороту?","options":["На першому.","На другому.","На третьому."],"provisional_correct_index":0},{"id":"9-012","topic":"9","number":12,"question":"Які попереджувальні сигнали повинні бути увімкнені на механічному транспортному засобі, що рухається з технічними несправностями, якщо такий рух не заборонено Правилами дорожнього руху?","options":["Ближнє світло фар.","Аварійна сигналізація разом із ближнім світлом фар.","Аварійна сигналізація."],"provisional_correct_index":2},{"id":"9-013","topic" итягнете праву руку вбік і зігнете під прямим кутом вгору.","Витягнете ліву руку в бік або праву руку вбік і зігнете у лікті під прямим кутом вгору.","Витягнете ліву руку і зігнете у лікті під прямим кутом вгору."],"provisional_correct_index":1},{"id":"9-027","topic":"9","number":27,"question":"Ви рухаєтесь на автомобілі, у якого несправні світлові покажчики поворотів, але Вам необхідно повернути ліворуч. Ваші дії:","options":["Витягнете праву руку вбік.","Витягнете ліву руку у вікно в бік.","Витягнете ліву руку у вікно і зігнете у лікті під прямим кутом вгору."],"provisional_correct_index":1},{"id":"9-028","topic":"9","number":28,"question":"Ви рухаєтесь на автомобілі, у якого несправні світлові покажчики поворотів, але Вам необхідно повернути праворуч. Ваші дії:","options":["Витягнете праву руку в праву сторону і зігнете під прямим кутом вгору.","Витягнете ліву руку в ліву сторону.","Витягнете ліву руку в ліву сторону у вікно і зігнете під прямим кутом вгору."],"provisional_correct_index":2},{"id":"9-029","topic":"9","number":29,"question":"Ви розпочинаєте рух на автомобілі, який попереджувальний сигнал повинні подати:","options":["Включити аварійну сигналізацію.","Ввімкнути габаритні ліхтарі.","Подати сигнал світловим покажчиком повороту."],"provisional_correct_index":2},{"id":"9-030","topic":"9","number":30,"question":"Ви водій автомобіля вирішили зупинитися з правої сторони дороги:","options":["Тільки у населеному пункті зобов’язані вмикати покажчик повороту.","Зобов’язані  подивитися  в  праве  дзеркало   і  якщо  є  інші  учасники дорожнього руху тільки тоді ввімкнути покажчик повороту.","В будь-якому випадку включити правий покажчик повороту."],"provisional_correct_index":2},{"id":"9-031","topic":"9","number":31,"question":"За яких умов миготливий червоний ліхтар може використовуватися замість знака аварійної зупинки, згідно з Правилами дорожнього руху?","options":["Світло, випромінюване ліхтарем, має бути добре видно тільки вдень за сонячної погоди.","Світло, випромінюване ліхтарем, повинно бути добре видно тільки в умовах недостатньої видимості.","Світло, випромінюване ліхтарем, повинно бути добре видно як удень за сонячної погоди, так і в умовах недостатньої видимості."],"provisional_correct_index":2},{"id":"9-032","topic":"9","number":32,"question":"Які зовнішні світлові прилади необхідно ввімкнути у разі зупинення транспортного засобу поліцейським?","options":["Не потрібно вмикати жодних зовнішніх світлових приладів.","Аварійну світлову сигналізацію.","Денні ходові вогні або протитуманні фари.","Стоянкові ліхтарі."],"provisional_correct_index":1},{"id":"9-033","topic":"9","number":33,"question":"У яких із перерахованих випадків потрібно ввімкнути аварійну світлову сигналізацію?","options":["У випадку будь-якої зупинки на дорозі.","У випадку зупинки на вимогу поліцейського.","У випадку зупинки внаслідок засліплення водія світлом фар.","Відповіді 2 і 3.","Відповіді 1, 2 і 3."],"provisional_correct_index":3},{"id":"9-034","topic":"9","number":34,"question":"У яких випадках дозволене подавання звукового сигналу?","options":["Для привертання уваги водія під час обгону транспортного засобу на дорогах поза населеними пунктами.","У випадках, коли без цього неможливо запобігти дорожньо-транспортній пригоді.","Для привертання уваги водія під час обгону транспортного засобу на дорогах у населених пунктах.","Відповіді 1, 2 і 3.","Відповіді 1 і 2."],"provisional_correct_index":4},{"id":"9-035","topic":"9","number":35,"question":"Де заборонене подавання звукового сигналу?","options":["У населених пунктах, окрім випадків, коли без цього неможливо запобігти дорожньо-транспортній пригоді.","Поза населеними пунктами, в місцях, де встановлений знак «Подавання звукового сигналу заборонено», крім випадків, коли без цього неможливо запобігти дорожньо-транспортній пригоді.","Відповіді 1 і 2."],"provisional_correct_index":2},{"id":"9-036","topic":"9","number":36,"question":"Чи дозволене водіям подавання  звукового сигналу?","options":["Дозволено завжди.","Забороно у населених пунктах, окрім випадків, коли без цього неможливо запобігти дорожньо-транспортній пригоді.","Заборонено у населених пунктах і поза населеними пунктами, крім випадків, коли без цього неможливо запобігти дорожньо-транспортній пригоді."],"provisional_correct_index":1},{"id":"9-037","topic":"9","number":37,"question":"Чи дає водієві перевагу в русі ввімкнення покажчика повороту?","options":["Завжди надає перевагу","Надає перевагу тільки під час перестроювання.","Не дає водієві переваги і не звільняє його від прийняття запобіжних заходів."],"provisional_correct_index":2},{"id":"9-038","topic":"9","number":38,"question":"Водій автомобіля, що рухається, перед перестроюванням увімкнув покажчик повороту. Чи повинен він дати дорогу транспортним засобам, на смугу яких він зібрався перестроюватися?","options":["Не повинен поступатися, оскільки був увімкнений покажчик повороту.","Повинен дати дорогу, оскільки подавання попереджувального сигналу покажчиками повороту не дає водієві переваги і не звільняє його від вжиття запобіжних заходів.","Не повинен поступатися дорогою у разі, якщо він уже почав перестроювання."],"provisional_correct_index":1},{"id":"9-039","topic":"9","number":39,"question":"Коли водієві необхідно припинити подавання сигналу рукою?","options":["Безпосередньо перед початком виконання маневру.","Відразу після завершення маневру.","Під час виконання маневру."],"provisional_correct_index":0},{"id":"9-040","topic":"9","number":40,"question":"Коли  водієві  необхідно припинити  подавання  сигналу  світловим покажчиком повороту, виконуючи маневр?","options":["Безпосередньо перед початком виконання маневру.","Відразу після завершення маневру.","Під час виконання маневру."],"provisional_correct_index":1},{"id":"9-041","topic":"9","number":41,"question":"На якій відстані до початку маневру подається сигнал покажчиками повороту або рукою поза населеним пунктом?","options":["Не менше ніж за 150–300 м.","Не менше ніж за 50–100 м.","Не менше ніж за 150–200 м."],"provisional_correct_index":2},{"id":"9-042","topic":"9","number":42,"question":"Які сигнали повинен подавати водій у разі відсутності або несправності сигналів гальмування?","options":["Сигнал подається круговим обертанням правої або лівої руки, витягнутої вбік.","Сигнал подається лівою або правою рукою, піднятою вгору.","Сигнал подається круговим обертанням правої або лівої руки, піднятою вгору."],"provisional_correct_index":1},{"id":"9-043","topic":"9","number":43,"question":"Який попереджувальний сигнал вмикається на транспортному засобі перед початком руху і зупинкою?","options":["Світловий покажчик повороту.","Аварійна сигналізація.","Стоянкові вогні."],"provisional_correct_index":0},{"id":"9-044","topic":"9","number":44,"question":"Чи повинні Ви як водій подавати сигнали світловим покажчиком повороту перед перестроюванням?","options":["Повинен тільки за наявності інших учасників дорожнього руху.","Повинен завжди.","Зобов'язаний, якщо встигає їх ввімкнути."],"provisional_correct_index":1},{"id":"9-045","topic":"9","number":45,"question":"Чи завжди для привертання уваги водія транспортного засобу, якого обганяють, дозволене подавання звукового сигналу на дорогах за межами населеного пункту?","options":["Дозволено завжди.","Заборонено, якщо встановлений знак «Подачу звукового сигналу заборонено»."],"provisional_correct_index":1},{"id":"9-046","topic":"9","number":46,"question":"Чи дозволено використовувати звуковий сигнал для привернення уваги водія транспортного засобу, якого обганяють, у населеному пункті?","options":["Заборонено, необхідно застосовувати лише перемикання світла фар.","Дозволено за відсутності знака «Подачу звукового сигналу заборонено».","Дозволено в будь-якому випадку."],"provisional_correct_index":0},{"id":"9-047","topic":"9","number":47,"question":"Який  попереджувальний  сигнал  дозволено  використовувати  для привернення уваги водія транспортного засобу, якого обганяють?","options":["Перемикання світла фар.","Звуковий сигнал (тільки поза населеними пунктами).","Звуковий сигнал.","Відповіді 1 і 2.","Відповіді 1 і 3."],"provisional_correct_index":3},{"id":"9-048","topic":"9","number":48,"question":"Що вмикається у разі вимушеної зупинки на дорозі?","options":["Стоянкові вогні.","Аварійна світлова сигналізація.","Габаритні ліхтарі."],"provisional_correct_index":1},{"id":"9-049","topic":"9","number":49,"question":"Які попереджувальні сигнали вмикаються на транспортних засобах під час буксирування у світлий час доби?","options":["На обох транспортних засобах вмикаються аварійна сигналізація і ближнє світло фар.","На обох транспортних засобах вмикається лише аварійна сигналізація.","На транспортному засобі, що буксирує, вмикається ближнє світло, а на тому, що буксирується, – аварійна сигналізація."],"provisional_correct_index":2},{"id":"9-050","topic":"9","number":50,"question":"Де саме необхідно вмикати денні ходові вогні, а в разі їх відсутності в конструкції транспортного засобу – ближнє світло фар на всіх механічних транспортних засобах під час руху в світлу пору доби?","options":["На автомагістралях і дорогах для автомобілів.","На всіх дорогах у населених пунктах і поза населеними пунктами.","На всіх дорогах поза населеними пунктами."],"provisional_correct_index":2},{"id":"9-051","topic":"9","number":51,"question":"За яких умов на механічному транспортному засобі у світлу пору доби мають бути ввімкнені  денні  ходові  вогні, а в  разі  їх  відсутності в конструкції транспортного засобу – ближнє світло фар?","options":["Під час руху на автомагістралях.","Під час руху на дорогах поза населеними пунктами з 1 жовтня до 1 травня.","Під час руху на дорогах поза населеними пунктами.","Завжди під час руху транспортного засобу."],"provisional_correct_index":2},{"id":"9-052","topic":"9","number":52,"question":"Під час руху у світлу пору доби на дорогах поза населеними пунктами мають бути ввімкнені  денні  ходові  вогні, а в  разі  їх  відсутності в конструкції транспортного засобу – ближнє світло фар:","options":["Тільки  на  великовагових,  великогабаритних  транспортних  засобах, сільськогосподарській  техніці,  ширина  якої  перевищує  2,6  м,  та  на транспортних  засобах, що здійснюють дорожнє  перевезення  небезпечних вантажів.","Тільки на маршрутних транспортних засобах, що рухаються по  смузі, позначеній дорожнім знаком 5.8, назустріч загальному потоку транспортних засобів.","На всіх механічних транспортних засобах."],"provisional_correct_index":2},{"id":"9-053","topic":"9","number":53,"question":"Що слід умикати під час руху на дорогах поза населеними пунктами у світлу пору доби на механічному транспортному засобі за відсутності в його конструкції денних ходових вогнів?","options":["Аварійну світлову сигналізацію.","Ближнє світло фар.","Габаритні ліхтарі."],"provisional_correct_index":1},{"id":"9-054","topic":"9","number":54,"question":"Що саме слід умикати на механічних транспортних засобах поза населеними пунктами в світлий час доби?","options":["Денні ходові вогні.","Дальнє світло фар.","Аварійну світлову сигналізацію.","Денні ходові вогні, а в разі їх відсутності у конструкції транспортного засобу – ближнє світло фар."],"provisional_correct_index":3},{"id":"9-055","topic":"9","number":55,"question":"Чи завжди під час руху в тунелі потрібно вмикати ближнє світло фар?","options":["Можна не вмикати, якщо тунель має штучне освітлення.","Світло вмикається завжди."],"provisional_correct_index":1},{"id":"9-056","topic":"9","number":56,"question":"Які попереджувальні сигнали вмикаються у світлий час доби на транспортному засобі, що буксирує?","options":["Аварійна сигналізація разом із ближнім світлом фар.","Ближнє світло фар.","Аварійна сигналізація."],"provisional_correct_index":1},{"id":"9-057","topic":"9","number":57,"question":"У якому випадку на транспортних засобах колони не вмикається ближнє світло фар у світлу пору доби?","options":["При  супроводі  транспортними  засобами         з       увімкненими проблисковими маячками червоного та синього кольорів.","При ввімкненні на транспортних засобах денних ходових вогнів.","Завжди на транспортних засобах колони вмикається ближнє світло фар."],"provisional_correct_index":2},{"id":"9-058","topic":"9","number":58,"question":"Ближнє світло фар у світлу пору доби як попереджувальний сигнал вмикається:","options":["На механічному транспортному засобі, що буксирується.","На механічному транспортному засобі, що буксирується і що буксирує.","На механічному транспортному засобі, що буксирує.","На транспортних засобах колони.","Відповіді 3 і 4."],"provisional_correct_index":4},{"id":"9-059","topic":"9","number":59,"question":"У яких випадках Ви як водій повинні подавати сигнали покажчиками повороту?","options":["У населених пунктах перед початком руху і зупинкою.","Перед  початком  руху,  зупинкою,  перестроюванням,  поворотом  або розворотом, якщо є інші учасники дорожнього руху, а також при інтенсивному русі.","Завжди перед початком руху, зупинкою, перестроюванням, поворотом або розворотом."],"provisional_correct_index":2},{"id":"9-060","topic":"9","number":60,"question":"Для того, щоб припаркувати Ваш транспортний засіб праворуч, Ви повинні увімкнути:","options":["Світловий покажчик повороту.","Аварійну сигналізацію.","Стоянкові вогні."],"provisional_correct_index":0},{"id":"10-001","topic":"10","number":1,"question":"Ви водій синього автомобіля, виконаєте розворот:","options":["По траєкторії А.","По траєкторії Б.","По траєкторії В.","По траєкторіях А і В.","По траєкторіях А, Б і В."],"provisional_correct_index":3},{"id":"10-002","topic":"10","number":2,"question":"В'їжджаючи на дорогу по смузі розгону, водій повинен:","options":["Вливатися в транспортний потік, даючи дорогу транспортним засобам, що рухаються по цій дорозі.","Вливатися в транспортний потік, інші водії, побачивши його, повинні обов'язково дати йому дорогу."],"provisional_correct_index":0},{"id":"10-003","topic":"10","number":3,"question":"Чи дозволено рух заднім ходом на автомагістралях і дорогах для автомобілів?","options":["Дозволено,  якщо  неможливо  під'їхати  до  об'єкта  іншим  способом, забезпечивши безпеку руху.","Заборонено."],"provisional_correct_index":1},{"id":"10-004","topic":"10","number":4,"question":"Чи дозволено рух заднім ходом у тунелях, якщо неможливо під'їхати до об'єкта іншим способом?","options":["Заборонено.","Дозволено."],"provisional_correct_index":0},{"id":"10-005","topic":"10","number":5,"question":"Чи дозволено в даному місці небезпечного повороту рух заднім ходом?","options":["Дозволено за умови забезпечення безпеки дорожнього руху.","Заборонено."],"provisional_correct_index":1},{"id":"10-006","topic":"10","number":6,"question":"Чи дозволено автомобілю рух заднім ходом у даному місці в умовах недостатньої видимості?","options":["Заборонено.","Дозволено за умови забезпечення безпеки руху."],"provisional_correct_index":0},{"id":"10-007","topic":"10","number":7,"question":"Як роз'їдуться транспортні засоби на лісовій дорозі?","options":["Білий автомобіль проїде першим, синій – другим.","Синій автомобіль проїде першим, білий – другим."],"provisional_correct_index":0},{"id":"10-008","topic":"10","number":8,"question":"Як роз'їдуться транспортні засоби в житловій зоні?","options":["Жовтий автомобіль проїде першим, сірий – другим.","Сірий автомобіль проїде першим, жовтий – другим."],"provisional_correct_index":1},{"id":"10-009","topic":"10","number":9,"question":"Ви, водій автомобіля, виїжджаючи  з  житлової  зони,  повинні  дати дорогу:","options":["Тільки автомобілю.","Тільки пішоходу.","Автомобілю і пішоходу."],"provisional_correct_index":2},{"id":"10-010","topic":"10","number":10,"question":"Ви, як водій автомобіля, повертаючи праворуч в показаній ситуації повинні:","options":["Дати дорогу велосипедисту в будь – якому випадку.","Не повинні давати дорогу велосипедисту, так як велосипедист рухається велосипедною смугою.","Посигналити велосипедисту і повернути першим."],"provisional_correct_index":0},{"id":"10-011","topic":"10","number":11,"question":"Ви водій сірого автомобіля, вирішили перестроїтись праворуч. Ваші дії:","options":["Почнете перестроюватися, бо знаходитись ліворуч від водія білого автомобіля на дорозі з одностороннім рухом і тому маєте перевагу.","Почнете  перестроюватися,  бо  маєте  перевагу  відносно  водія  білого автомобіля.","Дасте дорогу водію білого автомобіля і переконавшись, що це буде безпечно і не створить перешкод або небезпеки іншим учасникам руху, виконаєте маневр."],"provisional_correct_index":2},{"id":"10-012","topic":"10","number":12,"question":"Ви водій білого автомобіля, вирішили перестроїтись ліворуч. Ваші дії:","options":["Почнете  перестроюватися,  бо  знаходитись  праворуч  від  водія  сірого автомобіля на дорозі з одностороннім рухом і тому маєте перевагу.","Почнете  перестроюватися,  бо  маєте  перевагу  відносно  водія  сірого автомобіля.","Дасте дорогу водію сірого автомобіля і переконавшись, що це буде безпечно і не створить перешкод або небезпеки іншим учасникам руху, виконаєте маневр."],"provisional_correct_index":2},{"id":"10-013","topic":"10","number":13,"question":"Ви водій білого автомобіля, вирішили перестроїтись ліворуч, а водій сірого автомобіля одночасно з Вами вирішив перестроїтись праворуч. Ви:","options":["Маєте перевагу за одночасного перестроювання, бо знаходитись праворуч від водія сірого автомобіля.","Не маєте переваги перед водієм сірого автомобіля.","Повинні дати дорогу згідно правил дорожнього руху в такій ситуації, бо рухаєтеся на дорозі з одностороннім рухом."],"provisional_correct_index":0},{"id":"10-014","topic":"10","number":14,"question":"Ви водій сірого автомобіля, вирішили перестроїтись праворуч, а водій білого автомобіля одночасно з Вами вирішив перестроїтись ліворуч. Ви:","options":["Маєте перевагу за одночасного перестроювання, бо знаходитись ліворуч від водія білого автомобіля.","Повинні  дати  дорогу  водію  білого  автомобіля  бо  за  одночасного перестроювання білий автомобіль має перевагу.","Не повинні давати дорогу згідно правил дорожнього руху в такій ситуації, бо рухаєтеся на дорозі з одностороннім рухом."],"provisional_correct_index":1},{"id":"10-015","topic":"10","number":15,"question":"Ви водій синього автомобіля:","options":["Виконаєте розворот перед залізничним переїздом.","Виконаєте розворот після залізничного переїзду.","Виконаєте розворот на залізничному переїзді.","Виконаєте умови пунктів 1 або 2."],"provisional_correct_index":3},{"id":"10-016","topic":"10","number":16,"question":"Яким шляхом водій правильно виконує поворот на дорогу зі смугою для розгону?","options":["Шляхом А.","Шляхом Б.","Обидва варіанти правильні."],"provisional_correct_index":1},{"id":"10-017","topic":"10","number":17,"question":"Чи  дозволено виконати розворот у   технологічному розриві цьому транспортному засобу?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"10-018","topic":"10","number":18,"question":"Хто з водіїв порушив Правила дорожнього руху, виконавши розворот?","options":["Водій синього автомобіля.","Водій зеленого автомобіля.","Обидва водії."],"provisional_correct_index":0},{"id":"10-019","topic":"10","number":19,"question":"Чи дозволено буде водієві білого  автомобіля    виконати    поворот праворуч?","options":["Заборонено.","Дозволено."],"provisional_correct_index":1},{"id":"10-020","topic":"10","number":20,"question":"Чи дозволено водієві виконати розворот у даному місці?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"10-021","topic":"10","number":21,"question":"Чи правильно водій, який знаходиться ліворуч, виконує поворот праворуч?","options":["Правильно.","Неправильно."],"provisional_correct_index":0},{"id":"10-022","topic":"10","number":22,"question":"Чи правильно водій білого автомобіля виконав з'їзд із перехрестя з круговим рухом одночасно з водієм синього автомобіля?","options":["Правильно.","Неправильно."],"provisional_correct_index":0},{"id":"10-023","topic":"10","number":23,"question":"Хто з водіїв правильно зайняв смугу для повороту у разі в’їзду на перехрестя, де організовано круговий рух?","options":["Водій червоного автомобіля.","Водій білого автомобіля.","Водії обох автомобілів."],"provisional_correct_index":2},{"id":"10-024","topic":"10","number":24,"question":"Чи правильно автомобіль, що знаходиться ліворуч, виконує поворот праворуч у другу смугу для руху?","options":["Неправильно: у разі повороту праворуч слід рухатися ближче до правого краю проїзної частини.","Правильно."],"provisional_correct_index":1},{"id":"10-025","topic":"10","number":25,"question":"Чи дозволено водієві виконати розворот на перехресті так, як показано на малюнку?","options":["Заборонено, тому що відстань до пішохідного переходу менш ніж 10 м.","Дозволено."],"provisional_correct_index":1},{"id":"10-026","topic":"10","number":26,"question":"У якому місці водій правильно  виконав розворот?","options":["У місці А.","У місцях А, Б і В.","У місцях А і В.","У місці В."],"provisional_correct_index":0},{"id":"10-027","topic":"10","number":27,"question":"Ви керуєте автомобілем і під час руху вирішили перестроїтись ліворуч. Виконуючи такий маневр Ви повинні:","options":["Ввімкнути лівий покажчик повороту.","Подивитися в ліве дзеркало заднього виду і переконатися, що це буде безпечно і не створить перешкод або небезпеки іншим учасникам руху, контролюючи «сліпу зону» автомобіля.","Дати дорогу транспортним засобам, що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися.","Виконати усі дії зазначені у відповідях 1, 2 і 3.","Виконати тільки дії зазначені у відповідях 1 і 3."],"provisional_correct_index":3},{"id":"10-028","topic":"10","number":28,"question":"Ви керуєте автомобілем і під час руху вирішили перестроїтись ліворуч. Виконуючи такий маневр Ви повинні дати дорогу:","options":["Тільки механічним транспортним засобам, що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися.","Тільки автомобілям, автобусам і велосипедистам, що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися.","Транспортним засобам, що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися."],"provisional_correct_index":2},{"id":"10-029","topic":"10","number":29,"question":"Як повинен вчинити водій, що повертає ліворуч на перехресті, якщо автомобіль, який рухається попереду нього, почав виконувати розворот?","options":["Подати звуковий сигнал для запобігання дорожньо-транспортній пригоді.","Дати йому дорогу."],"provisional_correct_index":1},{"id":"10-030","topic":"10","number":30,"question":"Ви керуєте автомобілем і під час руху вирішили перестроїтись праворуч. Виконуючи такий маневр Ви повинні:","options":["Ввімкнути правий покажчик повороту.","Подивитися в праве дзеркало заднього виду  і переконатися, що це буде безпечно  і не створить перешкод або небезпеки іншим учасникам руху, контролюючи «сліпу зону» автомобіля.","Дати дорогу транспортним засобам,  що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися.","Виконати усі дії зазначені у відповідях 1, 2 і 3.","Виконати тільки дії зазначені у відповідях 1 і 3."],"provisional_correct_index":3},{"id":"10-031","topic":"10","number":31,"question":"Ви, як водій, повертаючи праворуч повинні:","options":["Рухатися ближче до правого краю проїзної частини.","Триматися середини смуги.","Рухатися так, щоб між Вами і бордюром помістився велосипед."],"provisional_correct_index":0},{"id":"10-032","topic":"10","number":32,"question":"Ви, як водій, повертаючи ліворуч поза перехрестям повинні:","options":["Включити покажчик лівого повороту.","Зайняти відповідне крайнє положення на проїзній частині.","Дати дорогу зустрічним транспортним засобам.","Виконати дії зазначені у відповідях 1,2,3."],"provisional_correct_index":3},{"id":"10-033","topic":"10","number":33,"question":"Ви, як водій автомобіля, маєте право розвернутися:","options":["У тунелях.","На мостах, шляхопроводах, естакадах.","Під мостами, шляхопроводами та естакадами.","На дорозі по одній смузі в кожному напрямку і при відсутності заборонних знаків та суцільної лінії розмітки.","Відповіді 1, 2 і 3."],"provisional_correct_index":3},{"id":"10-034","topic":"10","number":34,"question":"З якої смуги дозволено виконати поворот при в'їзді на перехрестя, де організовано круговий рух?","options":["З крайньої правої.","Тільки з крайньої правої і з сусідньої смуги.","З будь-якої смуги для руху в цьому ж напрямку."],"provisional_correct_index":2},{"id":"10-035","topic":"10","number":35,"question":"Ви водій автомобіля, рухаючись по мосту, зрозуміли, що обрали не вірний напрямок. Ваші дії:","options":["Виконаєте розворот в зворотному напрямку.","Включити лівий покажчик повороту, пропустите зустрічні транспортні засоби і після цього виконаєте розворот.","Проїдете міст і після цього виконаєте розворот в дозволеному місці."],"provisional_correct_index":2},{"id":"10-036","topic":"10","number":36,"question":"Ви, як водій,  вирішили   повернути праворуч  на  перехресті. Ви зобов’язані:","options":["Виконуючи поворот праворуч рухатися ближче до правого краю проїзної частини.","Зайняти середину смуги під час повороту праворуч.","Залежно від швидкості руху, або 1, або 2 варіант."],"provisional_correct_index":0},{"id":"10-037","topic":"10","number":37,"question":"Ви,   як   водій,   вирішили  повернути  ліворуч  на  перехресті. Вам необхідно:","options":["Включити лівий покажчик повороту і виконати поворот.","Завчасно включити покажчик повороту і зайняти крайнє ліве положення.","Виконати поворот так, щоб при виїзді з перехрещення проїзних частин транспортний засіб не опинився на смузі зустрічного руху.","Виконати обов’язково дії 2 та 3."],"provisional_correct_index":3},{"id":"10-038","topic":"10","number":38,"question":"Ви, як водій, повертаючи ліворуч, побачили що автомобіль, який рухається попереду Вас почав виконувати розворот, Ваші дії:","options":["Повернете ліворуч першим.","Ви зобов’язані дати дорогу автомобілю, який попереду Вас почав виконувати розворот.","Виконаєте звуковий сигнал для привертання його уваги і повернете ліворуч першим."],"provisional_correct_index":1},{"id":"10-039","topic":"10","number":39,"question":"Ви, як водій, вирішили розвернутись на дорозі поза перехрестям. Що Ви обов’язково повинні зробити:","options":["Зайняти відповідне крайнє положення на проїзній частині.","Дати дорогу зустрічним транспортним засобам.","Упевнитись, що це не створить небезпеки чи перешкод іншим учасникам руху.","Упевнитись, що це не заборонено дорожніми знаками або розміткою.","Виконати дії зазначені у відповідях 1,2,3,4."],"provisional_correct_index":4},{"id":"10-040","topic":"10","number":40,"question":"Ви, як водій, вирішили розвернутись на дорозі поза перехрестям. Що Ви обов’язково повинні зробити:","options":["Включити покажчик лівого повороту.","Зайняти відповідне крайнє положення на проїзній частині.","Дати дорогу зустрічним транспортним засобам.","Виконати дії зазначені у відповідях 1,2,3."],"provisional_correct_index":3},{"id":"10-041","topic":"10","number":41,"question":"Ви керуєте автомобілем і під час руху вирішили перестроїтись праворуч. Виконуючи такий маневр Ви повинні дати дорогу:","options":["Тільки механічним транспортним засобам, що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися.","Тільки автомобілям, автобусам і велосипедистам, що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися.","Всім транспортним засобам, що рухаються в попутному напрямку по тій смузі, на яку Ви маєте намір перестроїтися."],"provisional_correct_index":null},{"id":"10-042","topic":"10","number":42,"question":"Ви водій, заправили автомобіль паливом і виїжджаючи на дорогу з місця заправки, повинні:","options":["Перед проїзною частиною чи тротуаром дати дорогу тільки автомобілям і велосипедистам.","Перед тротуаром дати дорогу пішоходам, що рухаються по ній, а перед проїзною частиною тільки велосипедистам і мотоциклістам.","Перед  проїзною  частиною  чи  тротуаром дати дорогу пішоходам і транспортним засобам, що рухаються по ній."],"provisional_correct_index":null},{"id":"10-043","topic":"10","number":43,"question":"Ви водій, виїжджаючи на дорогу з місця стоянки, повинні:","options":["Перед  проїзною  частиною  чи  тротуаром  дати  дорогу  пішоходам і транспортним засобам, що рухаються по ній.","Перед проїзною частиною чи тротуаром дати дорогу тільки автомобілям і велосипедистам.","Перед тротуаром дати дорогу пішоходам, що рухаються по ній, а перед проїзною частиною тільки велосипедистам і мотоциклістам."],"provisional_correct_index":null},{"id":"10-044","topic":"10","number":44,"question":"Яких вимог повинен дотримуватися водій під час руху автомобіля заднім ходом?","options":["Повинен увімкнути аварійну сигналізацію.","Використовувати звуковий сигнал для привернення уваги.","Не повинен створювати небезпеки чи перешкод іншим учасникам руху.","Відповіді 1, 2 і 3."],"provisional_correct_index":null},{"id":"10-045","topic":"10","number":45,"question":"Що в разі потреби повинен зробити водій для забезпечення безпеки дорожнього руху під час руху заднім ходом на транспортному засобі?","options":["Увімкнути аварійну сигналізацію.","Звернутися за допомогою до інших осіб.","Відповіді 1 і 2."],"provisional_correct_index":null},{"id":"10-046","topic":"10","number":46,"question":"У якому випадку дозволено рух заднім ходом на дорогах з одностороннім рухом?","options":["Рух заднім ходом на дорогах з одностороннім рухом заборонено.","Дозволяється рух заднім ходом на дорогах з одностороннім рухом за умови забезпечення безпеки руху та неможливості під'їхати до об'єкта іншим способом."],"provisional_correct_index":null},{"id":"10-047","topic":"10","number":47,"question":"На якій відстані від пішохідних переходів заборонений розворот?","options":["Ближче 10 м перед пішохідними переходами.","Ближче 10 м від пішохідного переходу з обох боків.","Ближче 10 м за пішохідними переходами."],"provisional_correct_index":null},{"id":"10-048","topic":"10","number":48,"question":"Де заборонено рух заднім ходом?","options":["На пішохідних переходах.","На залізничних переїздах.","За 10 м від пішохідного переходу.","Відповіді 1, 2 і 3.","Відповіді 1 і 2."],"provisional_correct_index":null},{"id":"10-049","topic":"10","number":49,"question":"У яких місцях заборонено рух заднім ходом?","options":["На перехрестях.","На ділянках доріг з обмеженою оглядовістю чи недостатньою видимістю.","Під шляхопроводами та естакадами.","Відповіді 1, 2 і 3.","Відповіді 1 і 2."],"provisional_correct_index":null},{"id":"10-050","topic":"10","number":50,"question":"Якщо в місці з'їзду з дороги є смуга гальмування, чи завжди водій перед поворотом на іншу дорогу повинен знижувати швидкість на ній?","options":["Може знижувати швидкість не на смузі гальмування, якщо швидкість невелика.","Знижувати швидкість і повертати можна з будь-якої смуги.","Повинен своєчасно перестроїтися на цю смугу і знижувати швидкість тільки на ній."],"provisional_correct_index":null},{"id":"10-051","topic":"10","number":51,"question":"У якому з перелічених місць заборонено розворот?","options":["У тунелях.","На мостах, шляхопроводах, естакадах.","Під мостами, шляхопроводами та естакадами.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":null},{"id":"10-052","topic":"10","number":52,"question":"Яких заходів повинен вжити водій, якщо габарити його транспортного засобу не дозволяють виконати поворот з крайнього положення на проїзній частині?","options":["Повертати тільки з крайніх смуг для руху.","Не створювати небезпеки чи перешкод іншим учасникам руху.","У разі потреби для забезпечення безпеки дорожнього руху слід звернутися за допомогою до інших осіб.","Відповіді 2 і 3."],"provisional_correct_index":null},{"id":"10-053","topic":"10","number":53,"question":"У якому випадку водій може виконати поворот на перехресті не з крайнього положення?","options":["Якщо транспортний засіб через свої габарити не може виконати поворот чи розворот з відповідного крайнього положення.","Якщо це не суперечить вимогам заборонних чи наказових дорожніх знаків, дорожньої розмітки та не створить небезпеки чи перешкод для інших учасників дорожнього руху.","Правильні відповіді 1 і 2."],"provisional_correct_index":null},{"id":"10-054","topic":"10","number":54,"question":"Яким правилом повинні керуватися водії транспортних засобів, якщо траєкторії їхнього руху перетинаються, а черговість проїзду не обумовлена Правилами?","options":["Перевагу має той водій, який їде прямо.","Водій, до якого транспортний засіб наближається з правого боку, повинен дати дорогу.","Перевагу має той водій, який їде прямо або повертає праворуч."],"provisional_correct_index":null},{"id":"10-055","topic":"10","number":55,"question":"Ви, як водій, перед початком руху повинні:","options":["Переконатися у тому, що це буде безпечно.","Переконатися у тому що це не створить перешкод або небезпеки іншим учасникам руху.","Виконати дії зазначені у 1 та 2 відповідях."],"provisional_correct_index":null},{"id":"10-056","topic":"10","number":56,"question":"Ви, як водій, перед поворотом праворуч повинні:","options":["Переконатися у тому, що це буде безпечно.","Переконатися у тому що це не створить перешкод або небезпеки іншим учасникам руху.","Зайняти відповідне крайнє праве положення.","Виконати усі вищеперераховані дії."],"provisional_correct_index":null},{"id":"10-057","topic":"10","number":57,"question":"Ви водій автомобіля, виїжджаючи з прилеглої до дороги території повинні перед проїзною частиною чи тротуаром дати дорогу:","options":["Тільки пішоходам.","Тільки транспортним засобам.","Пішоходам і транспортним засобам."],"provisional_correct_index":null},{"id":"10-058","topic":"10","number":58,"question":"Ви велосипедист, виїжджаючи з прилеглої до дороги території повинні перед проїзною частиною чи тротуаром дати дорогу:","options":["Тільки пішоходам.","Тільки транспортним засобам.","Пішоходам і транспортним засобам."],"provisional_correct_index":null},{"id":"10-059","topic":"10","number":59,"question":"Ви, як водій автомобіля, повертаючи з дороги на прилеглу територію, повинні:","options":["Дати дорогу тільки пішоходам.","Дати дорогу тільки велосипедистам.","Дати дорогу велосипедистам і пішоходам, напрямок руху яких ви перетинаєте."],"provisional_correct_index":null},{"id":"10-060","topic":"10","number":60,"question":"Ви, як велосипедист, перед поворотом праворуч повинні:","options":["Переконатися у тому, що це буде безпечно.","Переконатися у тому що це не створить перешкод або небезпеки іншим учасникам руху.","Зайняти відповідне крайнє праве положення.","Виконати усі вищеперераховані дії."],"provisional_correct_index":null},{"id":"10-061","topic":"10","number":61,"question":"Яку смугу повинен зайняти водій перед поворотом ліворуч на перехресті згідно з Правилами дорожнього руху?","options":["Крайню ліву смугу.","Будь-яку смугу, з якої дозволено поворот ліворуч дорожніми знаками або дорожньою розміткою.","Відповіді 1 або 2 (залежно від дорожньої обстановки)."],"provisional_correct_index":null},{"id":"10-062","topic":"10","number":62,"question":"Чи дозволено Вам виконати розворот на перехресті в зоні 10 метрів від переходу?","options":["Так.","Ні."],"provisional_correct_index":null},{"id":"10-063","topic":"10","number":63,"question":"Чи дозволено Вам виконати розворот одразу після проїзду зустрічного автомобіля в наведеній ситуації?","options":["Дозволено.","Заборонено."],"provisional_correct_index":null},{"id":"10-064","topic":"10","number":64,"question":"Чи дозволено Вам виконати розворот, якщо видимість дороги менше 100 м в обох напрямках?","options":["Дозволено.","Заборонено."],"provisional_correct_index":null},{"id":"10-065","topic":"10","number":65,"question":"Водій сірого автомобіля здійснює в’їзд на перехрестя з круговим рухом. Чи потрібно в такому випадку вмикати лівий покажчик повороту?","options":["Так.","Ні."],"provisional_correct_index":null},{"id":"10-066","topic":"10","number":66,"question":"Чи дозволено водієві червоного автомобіля рухатись прямо у даному випадку?","options":["Дозволено.","Заборонено."],"provisional_correct_index":null},{"id":"10-067","topic":"10","number":67,"question":"Чи дозволено Вам повернути ліворуч у даному випадку?","options":["Дозволено.","Заборонено."],"provisional_correct_index":null},{"id":"10-068","topic":"10","number":68,"question":"У яких випадках дозволено виконати розворот на пішохідному переході?","options":["Якщо поруч немає транспортних засобів.","Якщо на переході немає пішоходів.","Заборонено, крім випадку дозволеного розвороту на перехресті."],"provisional_correct_index":null},{"id":"10-069","topic":"10","number":69,"question":"Якщо пішохідний перехід розділений острівцем безпеки, на такому переході дозволено виконати розворот?","options":["Дозволено.","Заборонено."],"provisional_correct_index":null},{"id":"10-070","topic":"10","number":70,"question":"У якому випадку дозволено виконати розворот під час руху тунелем?","options":["Якщо поруч немає транспортних   засобів.","Якщо тунель добре освітлений, а його ширина дозволяє розвернутись швидко та безпечно.","Розворот у тунелі заборонений."],"provisional_correct_index":null},{"id":"10-071","topic":"10","number":71,"question":"Під час руху транспортного засобу заднім ходом водій для забезпечення безпеки руху, у разі потреби повинен звернутися за допомогою до інших осіб:","options":["Так.","Ні."],"provisional_correct_index":null},{"id":"10-072","topic":"10","number":72,"question":"Чи можете Ви, виїжджаючи з місця паркування заднім ходом, для забезпечення безпеки руху звернутися за допомогою до інших осіб:","options":["Так.","Ні."],"provisional_correct_index":null},{"id":"10-073","topic":"10","number":73,"question":"Під час руху на автомагістралі водій червоного автомобіля пропустив поворот праворуч. Чи дозволено йому рухатись заднім ходом, якщо позаду немає транспортних засобів?","options":["Так, попередньо увімкнувши аварійну світлову сигналізацію.","Ні."],"provisional_correct_index":null},{"id":"10-074","topic":"10","number":74,"question":"Рухатись заднім ходом на автомагістралі у разі відсутності позаду транспортних засобів:","options":["Дозволено.","Заборонено."],"provisional_correct_index":null},{"id":"10-075","topic":"10","number":75,"question":"Ви рухаєтесь на спуск з гірської дороги. З метою економії палива можна під час руху по цій дорозі вимкнути передачу ?","options":["Так.","Ні."],"provisional_correct_index":null},{"id":"10-076","topic":"10","number":76,"question":"Чи дозволений розворот у технологічних розривах розділювальної смуги на автомагістралі?","options":["Дозволений.","Дозволений, якщо дорога добре проглядається в обидві сторони.","Заборонений."],"provisional_correct_index":null},{"id":"11-001","topic":"11","number":1,"question":"Вам дозволений розворот по траєкторії Б, тому що:","options":["Траєкторія А допустима тільки для вантажних автомобілів.","Траєкторія Б коротша, ніж траєкторія А.","Розворот повинен виконуватися з трамвайних колій попутного напрямку."],"provisional_correct_index":2},{"id":"11-002","topic":"11","number":2,"question":"Чи дозволено автомобілю виконати виїзд на трамвайну колію попутного напрямку?","options":["Дозволено.","Заборонено."],"provisional_correct_index":0},{"id":"11-003","topic":"11","number":3,"question":"По якій траєкторії водієві дозволено виконати поворот ліворуч?","options":["По траєкторії А.","По траєкторії Б.","По траєкторії В."],"provisional_correct_index":1},{"id":"11-004","topic":"11","number":4,"question":"Чи дозволено водію у даній ситуації виконати поворот ліворуч із трамвайної колії попутного напрямку?","options":["Дозволено, оскільки поворот ліворуч він повинен виконувати з трамвайної колії попутного напрямку.","Заборонено."],"provisional_correct_index":1},{"id":"11-005","topic":"11","number":5,"question":"Чи має право водій у даній ситуації виконати поворот ліворуч  із трамвайної колії попутного напрямку?","options":["Має, оскільки поворот ліворуч він повинен виконувати з трамвайної колії попутного напрямку.","Не має права."],"provisional_correct_index":1},{"id":"11-006","topic":"11","number":6,"question":"Чи дозволено водієві рух по трамвайній колії попутного напрямку в даній ситуації?","options":["Дозволено тільки по попутній трамвайній колії.","Заборонено."],"provisional_correct_index":1},{"id":"11-007","topic":"11","number":7,"question":"Чи правильно водій автомобіля рухається по дорозі, яка поділена на смуги лініями дорожньої розмітки?","options":["Правильно, якщо відсутні інші учасники, для руху яких може бути створено перешкоду.","Неправильно: наїжджати на переривчасті лінії розмітки дозволяється лише під час перестроювання."],"provisional_correct_index":1},{"id":"11-008","topic":"11","number":8,"question":"Як повинен вчинити водій у даній ситуації в разі руху прямо?","options":["Перестроїтися ліворуч або праворуч.","Перестроїтися на праву смугу.","Залишатися там само, якщо не створено перешкоди для інших водіїв.","Перестроїтися на ліву смугу."],"provisional_correct_index":1},{"id":"11-009","topic":"11","number":9,"question":"Чи  дозволено  водієві  білого  автомобіля  при  інтенсивному  русі виконати перестроювання?","options":["Заборонено змінювати смугу при інтенсивному русі.","Дозволено для об'їзду перешкоди, повороту або розвороту."],"provisional_correct_index":1},{"id":"11-010","topic":"11","number":10,"question":"По якій траєкторії водій білого автомобіля може виїжджати на смугу з реверсивним рухом при повороті?","options":["По будь-якій.","По А.","По Б."],"provisional_correct_index":2},{"id":"11-011","topic":"11","number":11,"question":"По якій траєкторії велосипедистові дозволено подальший рух?","options":["По будь-якій траєкторії.","По траєкторії А, для повороту ліворуч або для розвороту.","Тільки по траєкторії Б."],"provisional_correct_index":2},{"id":"11-012","topic":"11","number":12,"question":"На якій із доріг велосипедистам, водіям мопедів, особам, які керують гужовим транспортом, а також вершникам дозволено поворот ліворуч або розворот?","options":["На всіх дорогах.","На дорогах 1 і 2.","Тільки на дорозі 1.","Тільки на дорозі 3."],"provisional_correct_index":2},{"id":"11-013","topic":"11","number":13,"question":"Чи може даний транспортний засіб рухатися по крайній лівій смузі?","options":["Може завжди.","Не може, тому що завжди повинен рухатися якнайближче до правого краю проїзної частини.","Може  рухатися  у разі перестроювання   перед  поворотом  ліворуч  або розворотом."],"provisional_correct_index":2},{"id":"11-014","topic":"11","number":14,"question":"Який з водіїв правильно зайняв смугу перед зупинкою?","options":["Водій, що знаходиться праворуч.","Водій, що знаходиться ліворуч.","Обидва водії."],"provisional_correct_index":2},{"id":"11-015","topic":"11","number":15,"question":"На якому з малюнків показана дорога, на якій дозволено виїжджати на призначений для зустрічного руху бік дороги?","options":["На малюнку 1.","На малюнку 2.","На малюнку 3.","На малюнках 1, 2 і 3."],"provisional_correct_index":0},{"id":"11-016","topic":"11","number":16,"question":"Чи дозволено водієві жовтого автомобіля виїхати на смугу зустрічного руху?","options":["Дозволено для виконання обгону, в разі якщо транспортний засіб рухається зі швидкістю менш ніж 30 км/год.","Заборонено."],"provisional_correct_index":1},{"id":"11-017","topic":"11","number":17,"question":"За яких умов водієві легкового   автомобіля дозволено рух по крайній лівій смузі на дорозі з розділювальною смугою?","options":["Для повороту ліворуч або розвороту.","Для зупинки біля розділювальної смуги тільки в населеному пункті.","Відповіді 1 і 2."],"provisional_correct_index":0},{"id":"11-018","topic":"11","number":18,"question":"Чи дозволено транспортному засобу, швидкість руху якого з технічних причин не перевищує 40 км/год., рухатися по крайній лівій смузі?","options":["Заборонено, транспортний засіб завжди має рухатися якнайближче до правого краю проїзної частини.","Дозволено для виконання об'їзду або перестроювання перед поворотом ліворуч чи розворотом.","Дозволено, якщо інші смуги зайняті."],"provisional_correct_index":1},{"id":"11-019","topic":"11","number":19,"question":"Чи може водій транспортного засобу в'їжджати на смугу, призначену для зустрічного руху, для зупинки або стоянки біля лівого краю проїзної частини?","options":["Не може, тому що зупинка  і стоянка дозволені тільки біля правого краю проїзної частини.","Може виїжджати на всіх дорогах із двостороннім рухом, які мають по одній смузі для руху в кожному напрямку, за відсутності суцільної лінії дорожньої розмітки чи відповідних дорожніх знаків.","Може виїжджати тільки в населених пунктах, на дорогах із двостороннім рухом, які мають по одній смузі для руху в кожному напрямку, за відсутності суцільної  лінії  дорожньої  розмітки  чи  відповідних  дорожніх  знаків,  та трамвайних колій."],"provisional_correct_index":2},{"id":"11-020","topic":"11","number":20,"question":"У яких випадках водієві при інтенсивному русі дозволено змінювати смугу?","options":["Для об'їзду перешкоди.","Для повороту або розвороту.","Для зупинки.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"11-021","topic":"11","number":21,"question":"Як повинні рухатися водії нерейкових транспортних засобів на дорогах із двома смугами й більше для руху в кожному напрямку?","options":["Повинні рухатися в будь-якій смузі незалежно від інтенсивності руху.","Повинні вибирати смугу для руху залежно від інтенсивності руху.","Повинні рухатися якнайближче до правого краю проїзної частини.","Повинні рухатися якнайближче до правого краю проїзної частини, крім випадків, коли виконуються випередження, об'їзд або перестроювання перед поворотом ліворуч чи розворотом."],"provisional_correct_index":3},{"id":"11-022","topic":"11","number":22,"question":"У яких випадках  водій нерейкового транспортного  засобу може рухатися, не тримаючись ближче до правого краю проїзної частини на дорогах, що мають по дві й більше смуг для руху в кожному напрямку?","options":["У разі виконання об'їзду.","У разі виконання випередження.","У разі перестроювання перед поворотом ліворуч чи розворотом.","Відповіді 2 і 3.","Відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"11-023","topic":"11","number":23,"question":"У яких випадках транспортним засобам дозволено рух по тротуарах і пішохідних доріжках?","options":["Завжди для виконання робіт або обслуговування торговельних та інших підприємств, розташованих безпосередньо біля цих тротуарів або доріжок, і за умови надання переваги пішоходам.","Для  виконання  робіт  або  обслуговування  торговельних  та  інших підприємств, розташованих безпосередньо біля цих тротуарів або доріжок, за відсутності інших під'їздів і за умови надання переваги пішоходам.","Рух транспортних засобів по тротуарах і пішохідних доріжках заборонено в будь-якому разі."],"provisional_correct_index":1},{"id":"11-024","topic":"11","number":24,"question":"За яких умов транспортним засобам дозволено рух по тротуарах  і пішохідних  доріжках  для  виконання   робіт  або  обслуговування торговельних та інших підприємств, розташованих безпосередньо біля цих тротуарів або доріжок?","options":["Завжди.","У разі надання пішоходам переваги в русі.","За відсутності інших під'їздів і за умови надання переваги пішоходам."],"provisional_correct_index":2},{"id":"11-025","topic":"11","number":25,"question":"Як повинні рухатися по проїзній частині велосипедисти, водії мопедів, особи, які керують гужовим транспортом, а також вершники?","options":["По будь-якій смузі.","Тільки в один ряд по правій крайній смузі, якомога правіше, за винятком випадків, коли виконується об'їзд.","Тільки в один ряд по правій крайній смузі, якомога правіше, за винятком випадків повороту ліворуч і розвороту.","Тільки в один ряд по правій крайній смузі, якомога правіше, за винятком випадків повороту ліворуч і розвороту на дорогах з однією смугою для руху в кожному напрямку і без трамвайної колії посередині.","Відповіді 2 і 4."],"provisional_correct_index":4},{"id":"11-026","topic":"11","number":26,"question":"Як має рухатися нерейковий транспортний засіб на дорозі, яка має по дві й більше смуг для руху в кожному напрямку, вільній від інших транспортних засобів, якщо немає необхідності виконувати маневри?","options":["Якнайближче до правого краю проїзної частини.","У будь-якій смузі – на розсуд водія."],"provisional_correct_index":0},{"id":"11-027","topic":"11","number":27,"question":"Що повинен враховувати водій нерейкового транспортного засобу для визначення кількості смуг за відсутності дорожньої розмітки та дорожніх знаків «Напрямки руху по смугах» і «Напрямки руху по смузі»?","options":["Повинен враховувати ширину проїзної частини відповідного напрямку руху, габарити транспортного засобу, дотримуючись при цьому безпечних інтервалів.","Тільки ширину проїзної частини.","Тільки габарити транспортних засобів."],"provisional_correct_index":0},{"id":"11-028","topic":"11","number":28,"question":"Якщо дорога поділена на смуги руху лініями дорожньої розмітки, чи завжди водій повинен рухатися точно по смузі для руху?","options":["Повинен завжди.","Повинен, крім випадків перестроювання."],"provisional_correct_index":1},{"id":"11-029","topic":"11","number":29,"question":"У яких випадках заборонено виїжджати на призначений для зустрічного руху бік дороги?","options":["Якщо дорога має щонайменше дві смуги для руху в одному напрямку.","Якщо  дорога  з  двостороннім  рухом  розділена  переривчастою  лінією дорожньої розмітки.","Відповіді 1 і 2."],"provisional_correct_index":0},{"id":"11-030","topic":"11","number":30,"question":"Чи  дозволено  водієві  виконати  випередження,  виїхавши  на розділювальну смугу, яка відокремлена суцільними лініями дорожньої розмітки?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"11-031","topic":"11","number":31,"question":"Як повинен рухатися транспортний засіб, швидкість руху якого не повинна перевищувати 40 км/год. або який з технічних причин не може розвивати таку швидкість?","options":["Повинен рухатися якнайближче до правого краю проїзної частини, крім випадків, коли виконується об'їзд або обгін.","Повинен рухатися якнайближче до правого краю проїзної частини, крім випадків, коли виконується перестроювання перед поворотом ліворуч чи розворотом.","Може рухатися в будь-якій смузі.","Відповіді 1 і 2."],"provisional_correct_index":3},{"id":"11-032","topic":"11","number":32,"question":"За яких умов водієві легкового автомобіля дозволено виїжджати на крайню ліву смугу на дорозі з розділювальною смугою?","options":["Якщо праві смуги зайняті.","Для   повороту   ліворуч   або   розвороту.","Для зупинки або стоянки з лівого боку в населених пунктах.","Відповіді 1, 2 і 3.","Відповіді 1 і 2."],"provisional_correct_index":4},{"id":"11-033","topic":"11","number":33,"question":"Коли нерейковим транспортним засобам дозволено рух по трамвайній колії попутного напрямку, розташованій на одному  рівні  з проїзною частиною?","options":["Завжди під час випередження або перед поворотом ліворуч, а також перед розворотом.","Завжди для виконання об'їзду.","За  умови, що  рух  не  заборонено дорожніми  знаками чи дорожньою розміткою, а також під час випередження,  об'їзду, коли ширина проїзної частини недостатня для виконання об'їзду без виїзду на трамвайну колію.","Відповіді 1 і 2."],"provisional_correct_index":2},{"id":"11-034","topic":"11","number":34,"question":"У якому випадку заборонено в'їжджати на попутні трамвайні колії, розташовані на одному рівні з проїзною частиною?","options":["Коли рух по ній заборонено дорожніми знаками чи дорожньою розміткою.","Коли ширина проїзної частини достатня для виконання об'їзду без виїзду на трамвайну колію.","Якщо в разі виїзду на трамвайну колію створюється перешкода для руху трамвая.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"11-035","topic":"11","number":35,"question":"У якому випадку дозволено виїжджати на трамвайну колію попутного напрямку на перехрестях?","options":["У тих самих випадках, що й поза перехрестями, якщо кількість смуг для руху і дозволені напрямки руху по смугах не визначені дорожніми знаками.","Виїжджати  на  трамвайну  колію  попутного  напрямку  на  перехрестях заборонено.","Тільки для об'їзду, повороту ліворуч і розвороту. При цьому не повинні створюватися перешкоди для руху трамвая."],"provisional_correct_index":0},{"id":"11-036","topic":"11","number":36,"question":"Коли дозволено виїжджати на крайню ліву смугу на дорогах, що мають дві смуги і більше для руху в одному напрямку?","options":["Для повороту ліворуч або розвороту.","Якщо праві смуги зайняті, а також для зупинки або стоянки на лівому боці дороги  з одностороннім рухом  поза населеними  пунктами, якщо це не суперечить правилам зупинки (стоянки).","Якщо праві смуги зайняті, а також для зупинки або стоянки на лівому боці дороги з одностороннім рухом у населених пунктах, якщо це не суперечить правилам зупинки (стоянки).","Відповіді 1 і 2.","Відповіді 1 і 3."],"provisional_correct_index":4},{"id":"11-037","topic":"11","number":37,"question":"Чи    має    право    водій   транспортного засобу виїжджати на трамвайну колію зустрічного напрямку?","options":["Має право в будь-якому разі для виконання об'їзду.","Не має права: виїзд на зустрічну трамвайну колію заборонено."],"provisional_correct_index":1},{"id":"11-038","topic":"11","number":38,"question":"На дорогах з якою мінімальною кількістю смуг для руху в одному напрямку заборонено виїжджати на бік, призначений для зустрічного руху?","options":["Три і більше.","Дві і більше.","Чотири і більше."],"provisional_correct_index":1},{"id":"11-039","topic":"11","number":39,"question":"Чим  у  першу  чергу  повинен  керуватися  водій  нерейкового транспортного засобу для визначення кількості смуг на проїзній частині?","options":["Лініями горизонтальної і вертикальної дорожньої розмітки.","Тільки лініями горизонтальної дорожньої розмітки.","Тільки дорожніми знаками «Напрямок руху по смугах» і «Напрямок руху по смузі».","Відповіді 1, 2 і 3.","Дорожньою розміткою або дорожніми знаками «Напрямок руху по смугах» і «Напрямок руху по смузі»."],"provisional_correct_index":4},{"id":"12-001","topic":"12","number":1,"question":"У яких випадках за допомогою дорожніх знаків вводяться постійні обмеження швидкості руху?","options":["На небезпечних ділянках доріг і вулиць та в місцях розміщення наземних нерегульованих пішохідних переходів.","На ділянках доріг (вулиць), що прилягають до території дошкільних та загальноосвітніх навчальних закладів, дитячих оздоровчих таборів.","Відповіді 1 і 2."],"provisional_correct_index":2},{"id":"12-002","topic":"12","number":2,"question":"З якою максимальною швидкістю дозволено рух водієві зі стажем менш ніж два роки?","options":["60 км/год.","70 км/год.","80 км/год.","90 км/год.","50 км/год."],"provisional_correct_index":1},{"id":"12-003","topic":"12","number":3,"question":"Яка максимальна швидкість встановлена для руху легкових автомобілів на автомагістралі (крім транспортних засобів, якими керують водії  зі стажем до 2-х років)?","options":["80 км/год.","90 км/год.","110 км/год.","130 км/год."],"provisional_correct_index":3},{"id":"12-004","topic":"12","number":4,"question":"З якою максимальною швидкістю можуть рухатися легкові автомобілі по дорогах для автомобілів (крім транспортних засобів, якими керують водії зі стажем до 2-х років)?","options":["80 км/год.","90 км/год.","110 км/год.","130 км/год."],"provisional_correct_index":2},{"id":"12-005","topic":"12","number":5,"question":"З  якою  максимальною  швидкістю  допускається  рух  легкових автомобілів на дорогах з окремими проїзними частинами, що відокремлені одна від одної розділювальною смугою (крім транспортних засобів, якими керують водії зі стажем до 2-х років)?","options":["80 км/год.","90 км/год.","110 км/год.","130 км/год."],"provisional_correct_index":2},{"id":"12-006","topic":"12","number":6,"question":"З якою максимальною швидкістю допускається рух на цій дорозі легкового автомобіля, якщо він рухається за межами населеного пункту (крім транспортних засобів, якими керують водії зі стажем до 2-х років)?","options":["70 км/год.","80 км/год.","90 км/год.","100 км/год.","110 км/год."],"provisional_correct_index":2},{"id":"12-007","topic":"12","number":7,"question":"Яка максимальна швидкість встановлена для автомобіля в цьому місці (крім транспортних засобів, якими керують водії зі стажем до 2-х років)?","options":["50 км/год. до кінця всього населеного пункту.","80 км/год. до кінця всього населеного пункту.","90 км/год. під час руху прямо, у разі повороту праворуч, на забудовану територію – 50 км/год."],"provisional_correct_index":2},{"id":"12-008","topic":"12","number":8,"question":"Яка максимальна швидкість встановлена для легкових автомобілів на цій дорозі за межами населених пунктів (крім транспортних засобів, якими керують водії зі стажем до 2-х років)?","options":["70 км/год.","80 км/год.","90 км/год.","100 км/год.","110 км/год."],"provisional_correct_index":2},{"id":"12-009","topic":"12","number":9,"question":"З якою максимальною швидкістю  дозволено рух білому автомобілю на дорозі за межами населених пунктів?","options":["40 км/год.","50 км/год.","60 км/год.","70 км/год."],"provisional_correct_index":1},{"id":"12-010","topic":"12","number":10,"question":"З  якою  максимальною  швидкістю   дозволено   буксирування транспортним засобам на автомагістралях?","options":["40 км/год.","50 км/год.","60 км/год.","70 км/год."],"provisional_correct_index":1},{"id":"12-011","topic":"12","number":11,"question":"З якою максимальною швидкістю дозволено рух червоного автомобіля?","options":["60 км/год.","70 км/год.","90 км/год.","110 км/год.","50 км/год."],"provisional_correct_index":1},{"id":"12-012","topic":"12","number":12,"question":"У яких випадках за допомогою   дорожніх     знаків     вводяться тимчасові обмеження швидкості руху?","options":["У місцях виконання дорожніх робіт і місцях проведення масових або спеціальних заходів.","У випадках, пов’язаних зі стихійними (погодними) явищами.","У місцях патрулювання поліцейськими.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":3},{"id":"12-013","topic":"12","number":13,"question":"Кому з водіїв дозволено рух з більш високою швидкістю?","options":["Водієві мотоцикла.","Водієві автомобіля.","Швидкість обох не повинна перевищувати 20 км/год."],"provisional_correct_index":2},{"id":"12-014","topic":"12","number":14,"question":"З якою максимальною швидкістю дозволено рух у житлових і пішохідних зонах?","options":["20 км/год.","40 км/год.","60 км/год.","50 км/год."],"provisional_correct_index":0},{"id":"12-015","topic":"12","number":15,"question":"Швидкість руху в темну пору    доби  та  в  умовах  недостатньої видимості повинна бути такою, щоб водій:","options":["Мав можливість оцінити дорожню обстановку на відстані 50-100 м попереду.","Мав можливість зупинити транспортний засіб у межах видимості дороги.","Відповіді 1 і 2."],"provisional_correct_index":1},{"id":"12-016","topic":"12","number":16,"question":"Рухаючись по дорозі, водій виявив перешкоду для руху. Як він повинен вчинити в такій ситуації?","options":["Знизити швидкість на 10 км/год., об'їхати небезпеку, що виникла, а в разі потреби зупинитися.","Знизити швидкість (аж до зупинки транспортного засобу) або, забезпечивши безпеку для інших учасників руху, об'їхати перешкоду.","Об'їхати перешкоду, не знижуючи швидкості."],"provisional_correct_index":1},{"id":"12-017","topic":"12","number":17,"question":"Яку максимальну швидкість руху встановлено в населених пунктах, позначених даним дорожнім знаком?","options":["50 км/год.","60 км/год.","70 км/год.","80 км/год."],"provisional_correct_index":0},{"id":"12-018","topic":"12","number":18,"question":"З якою максимальною швидкістю дозволено рух після проїзду цього знака?","options":["50 км/год.","60 км/год.","70 км/год.","80 км/год."],"provisional_correct_index":0},{"id":"12-019","topic":"12","number":19,"question":"З якою максимальною  швидкістю  дозволено  рух  на  дорогах з розділювальною смугою в населених пунктах?","options":["60 км/год.","70 км/год.","80 км/год.","90 км/год.","50 км/год."],"provisional_correct_index":4},{"id":"12-020","topic":"12","number":20,"question":"З якою  максимальною  швидкістю  дозволено  рух  автомобіля в зображеній ситуації?","options":["20 км/год.","40 км/год.","60 км/год.","50 км/год."],"provisional_correct_index":0},{"id":"12-021","topic":"12","number":21,"question":"Чи завжди водій під час вибору безпечної швидкості руху повинен враховувати особливості вантажу, що перевозиться?","options":["Не повинен, якщо вантаж добре закріплений.","Повинен завжди."],"provisional_correct_index":1},{"id":"12-022","topic":"12","number":22,"question":"У яких випадках, відповідно до Правил дорожнього руху, водій не може бути  притягнений  до  відповідальності  за  порушення  встановлених обмежень швидкості?","options":["Якщо знаки обмеження швидкості руху встановлені з порушенням правил їх введення.","Якщо знаки обмеження швидкості   руху встановлені з порушенням вимог національних стандартів.","Якщо знаки обмеження швидкості руху залишені після усунення обставин, за яких їх було встановлено.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"12-023","topic":"12","number":23,"question":"Чи завжди, вибираючи безпечну швидкість під час руху взимку, водій повинен враховувати стан дорожнього покриття?","options":["Повинен враховувати завжди.","Не повинен, якщо на транспортному засобі встановлено зимові шини."],"provisional_correct_index":0},{"id":"12-024","topic":"12","number":24,"question":"Чи дозволено водієві різко гальмувати?","options":["Заборонено завжди.","Заборонено, крім випадків запобігання дорожньо-транспортній пригоді.","Дозволено."],"provisional_correct_index":1},{"id":"12-025","topic":"12","number":25,"question":"Чи можна водієві без потреби рухатися з дуже малою швидкістю?","options":["Дозволено.","Заборонено в умовах, коли це перешкоджає іншим транспортним засобам."],"provisional_correct_index":1},{"id":"12-026","topic":"12","number":26,"question":"Що враховується під час вибору безпечної швидкості руху?","options":["Дорожня обстановка.","Особливості вантажу, що перевозиться.","Стан транспортного засобу.","Відповіді 1, 2 і 3."],"provisional_correct_index":3},{"id":"12-027","topic":"12","number":27,"question":"Чи дозволено водієві перевищувати максимальну дозволену швидкість під час буксирування?","options":["Заборонено.","Дозволено, якщо довжина гнучкого зчеплення достатня."],"provisional_correct_index":0},{"id":"12-028","topic":"12","number":28,"question":"Чи можуть водії транспортних засобів рухатися в житлових і пішохідних зонах зі швидкістю, що перевищує встановлену для таких місць?","options":["Дозволено тим, хто там працює або проживає в цих зонах.","Дозволено тим, хто обслуговує підприємства.","Відповіді 1 і 2.","Заборонено перевищувати встановлену швидкість."],"provisional_correct_index":3},{"id":"12-029","topic":"12","number":29,"question":"У якому випадку максимальна дозволена швидкість руху на дорозі в населеному пункті може бути збільшена?","options":["У разі створення умов, що дають можливість рухатися з більш високою швидкістю, за узгодженим рішенням уповноваженого підрозділу Національної поліції та власників доріг або органів, яким передано право на утримання таких доріг.","У разі встановлення відповідних дорожніх знаків.","Відповіді 1 і 2."],"provisional_correct_index":2},{"id":"12-030","topic":"12","number":30,"question":"За яких умов дозволена максимальна швидкість руху на дорозі може бути збільшена?","options":["За умови встановлення відповідних дорожніх знаків.","За узгодженим рішенням власників доріг або органів, яким передано право на утримання таких доріг, у разі створення умов, що дають можливість рухатися з більш високою швидкістю.","Відповіді 1 і 2."],"provisional_correct_index":0},{"id":"12-031","topic":"12","number":31,"question":"Яка швидкість обрана правильно під час руху в темну пору доби або в умовах недостатньої видимості?","options":["При якій водій мав змогу зупинити транспортний засіб у межах видимості дороги.","При якій гальмівний шлях дорівнює або не перевищує видимості в напрямку руху.","При якій гальмівний шлях перевищує видимість за напрямком руху."],"provisional_correct_index":0},{"id":"12-032","topic":"12","number":32,"question":"Якою має бути швидкість під час руху в темну пору доби або в умовах недостатньої видимості?","options":["На 10 км/год. нижчою, ніж швидкість, яка встановлена для ділянки дороги, по якій рухається транспортний засіб.","Такою, щоб водій мав змогу зупинити транспортний засіб у межах видимості дороги.","Відповіді 1 і 2."],"provisional_correct_index":1},{"id":"12-033","topic":"12","number":33,"question":"З  якою  максимальною  швидкістю   дозволено   буксирування транспортних засобів?","options":["40 км/год.","50 км/год.","60 км/год.","70 км/год."],"provisional_correct_index":1},{"id":"12-034","topic":"12","number":34,"question":"Як повинен вчинити водій у разі виникнення небезпеки для руху або перешкоди, яку він виявив під час руху?","options":["Рухатися далі, не змінюючи швидкості, і бути готовим негайно зупинити транспортний засіб.","Вжити заходів для зменшення швидкості аж до зупинки транспортного засобу або безпечного для інших учасників руху об'їзду перешкоди.","Відповіді 1 і 2."],"provisional_correct_index":1},{"id":"12-035","topic":"12","number":35,"question":"З якою максимальною швидкістю дозволено рух транспортних засобів, якими керують водії зі стажем до двох років, на всіх дорогах за межами населених пунктів?","options":["60 км/год.","70 км/год.","80 км/год.","90 км/год.","50 км/год."],"provisional_correct_index":1},{"id":"12-036","topic":"12","number":36,"question":"З  якою  максимальною  швидкістю  дозволено  рух  на  дворових територіях?","options":["20 км/год.","40 км/год.","60 км/год.","50 км/год."],"provisional_correct_index":0},{"id":"12-037","topic":"12","number":37,"question":"Що для Вас вважається безпечною швидкістю?","options":["Швидкість яка визначена дорожніми знаками для руху в населених пунктах.","Швидкість при якій Ви маєте змогу безпечно керувати транспортним засобом та контролювати його рух у конкретних дорожніх умовах.","Швидкість яка визначена технічною характеристикою даного транспортного засобу."],"provisional_correct_index":1},{"id":"12-038","topic":"12","number":38,"question":"Чи дозволено водіям із досвідом водіння понад 5 років перевищувати максимально допустиме обмеження швидкості поза межами населених пунктів?","options":["Так.","Ні."],"provisional_correct_index":1},{"id":"12-039","topic":"12","number":39,"question":"Максимальна швидкість під час руху у житловій зоні становить 30 км/год?","options":["Так.","Ні."],"provisional_correct_index":1},{"id":"12-040","topic":"12","number":40,"question":"Безпечна швидкість руху – це виключно встановлене обмеження швидкості:","options":["Так.","Ні."],"provisional_correct_index":1},{"id":"12-041","topic":"12","number":41,"question":"Водій транспортного засобу, що рухається  зі швидкістю 68 км/год, наближаючись до наведеного дорожнього знака повинен:","options":["Зобов'язаний збільшити швидкість, щоб швидкість транспортного засобу становила більше 70 км/год.","Зобов’язаний продовжувати рух з цією ж швидкістю або меншою, але не більшою 70 км/год."],"provisional_correct_index":1},{"id":"13-001","topic":"13","number":1,"question":"Що вважається безпечною дистанцією?","options":["Відстань між транспортними засобами, що рухаються по суміжних смугах в попутному напрямку.","Відстань до транспортного засобу, що рухається тією ж самою смугою, яка складає 30 м.","Відстань до транспортного засобу, що рухається попереду тією ж смугою, яка у разі його раптового гальмування або зупинки дасть можливість водієві транспортного засобу, що рухається позаду, запобігти зіткненню без здійснення будь-якого маневру."],"provisional_correct_index":2},{"id":"13-002","topic":"13","number":2,"question":"Водій якого автомобіля має перевагу на цій ділянці дороги?","options":["Червоного автомобіля.","Синього автомобіля."],"provisional_correct_index":1},{"id":"13-003","topic":"13","number":3,"question":"Водій якого транспортного засобу повинен дати дорогу під час зустрічного роз'їзду на цій ділянці?","options":["Водій синього автомобіля, тому що на його боці є перешкода.","Водій білого, тому що він рухається на спуск."],"provisional_correct_index":1},{"id":"13-004","topic":"13","number":4,"question":"Чи може водій синього автомобіля продовжити рух, не чекаючи проїзду червоного автомобіля, якщо перешкода на його боці?","options":["Може.","Не може, синій автомобіль повинен дати дорогу."],"provisional_correct_index":1},{"id":"13-005","topic":"13","number":5,"question":"Хто з водіїв повинен дати дорогу?","options":["Водій, який рухається з меншою швидкістю.","Водій, на смузі якого є перешкода.","Водій, на смузі якого немає перешкод."],"provisional_correct_index":1},{"id":"13-006","topic":"13","number":6,"question":"Яка дистанція повинна бути між  тракторами,  що  рухаються за межами населених пунктів, якщо їх швидкість не перевищує 40 км/год.?","options":["Дистанція повинна бути 2 – 3 м.","Дистанція повинна бути обрана залежно від дорожньої обстановки.","Дистанція повинна бути такою, щоб транспортні засоби, які виконують обгін, мали змогу безперешкодно повернутися на раніше займану смугу руху."],"provisional_correct_index":2},{"id":"13-007","topic":"13","number":7,"question":"Що вважається безпечним інтервалом?","options":["Відстань між боковими частинами транспортних засобів, що рухаються назустріч крайніми лівими смугами.","Відстань між боковими частинами транспортних засобів, що рухаються в попутному напрямку.","Відстань між боковими частинами транспортних засобів, що рухаються, або між ними та іншими об'єктами, за якої гарантована безпека дорожнього руху."],"provisional_correct_index":2},{"id":"13-008","topic":"13","number":8,"question":"Яким правилом повинні керуватися водії в разі обмеженого зустрічного роз'їзду на ділянках доріг, позначених знаками «Крутий підйом» і «Крутий спуск»?","options":["Водій, на смузі руху якого є перешкода, повинен дати дорогу.","Водій   транспортного   засобу,   габарити якого заважають зустрічному роз'їзду, повинен дати дорогу.","Відповіді 1 і 2.","Водій транспортного засобу, що рухається на спуск, повинен дати дорогу."],"provisional_correct_index":3},{"id":"13-009","topic":"13","number":9,"question":"Під  час  виконання  яких  маневрів  водій  повинен  дотримуватися безпечного інтервалу?","options":["Під час обгону.","Під час випередження.","Під час об'їзду перешкоди.","Під час зустрічного роз'їзду.","Відповіді 1, 2, 3 і 4."],"provisional_correct_index":4},{"id":"13-010","topic":"13","number":10,"question":"Якої дистанції повинні дотримуватися водії транспортних засобів, швидкість яких не перевищує 40 км/год. поза населеними пунктами?","options":["З такою, за якої неможливий наїзд ззаду.","З будь-якою, на розсуд водія.","Такої дистанції, щоб транспортні засоби, які виконують обгін, мали змогу безперешкодно повернутися на раніше займану смугу руху."],"provisional_correct_index":2},{"id":"13-011","topic":"13","number":11,"question":"Що повинен враховувати водій під час вибору безпечної дистанції та інтервалу?","options":["Швидкість руху.","Дорожню обстановку.","Особливості вантажу, що перевозиться.","Стан транспортного засобу.","Відповіді 1, 2, 3 і 4."],"provisional_correct_index":4},{"id":"13-012","topic":"13","number":12,"question":"Ви на ділянці дороги, позначеній знаком «Крутий підйом», на Вашій смузі нерухома перешкода, що утруднює зустрічний  роз'їзд. Як Вам виконати роз'їзд із зустрічним автомобілем, що рухається на спуск?","options":["Дати дорогу зустрічному автомобілю, який рухається на спуск.","Дати дорогу зустрічному автомобілю, так як перешкода на Вашій смузі","Проїхати першим, оскільки Ви маєте перевагу перед автомобілем, що їде на спуск."],"provisional_correct_index":2},{"id":"13-013","topic":"13","number":13,"question":"Яким правилом повинні керуватися водії під час зустрічного роз'їзду в місцях, де він утруднений?","options":["Водій, на смузі руху якого є перешкода, повинен дати дорогу.","Водій, який під'їхав першим, має перевагу.","Правильні відповіді 1 і 2."],"provisional_correct_index":0},{"id":"14-001","topic":"14","number":1,"question":"На якому з малюнків показаний обгін?","options":["На першому.","На другому.","На обох."],"provisional_correct_index":0},{"id":"14-002","topic":"14","number":2,"question":"У якому випадку водій білого автомобіля правильно виконав обгін перед залізничним переїздом?","options":["Якщо завершив обгін до залізничного переїзду.","Якщо завершив обгін за 50 м до переїзду.","Якщо завершив обгін за 100 м до переїзду."],"provisional_correct_index":2},{"id":"14-003","topic":"14","number":3,"question":"Як в цій ситуації вчинити водієві червоного автомобіля, для того щоб обігнати великогабаритний вантажний автомобіль?","options":["Виконати обгін в цьому місці, якщо вантажівка рухається зі швидкістю менше ніж 30 км/год.","Виконати обгін в цьому місці, дотримуючись особливої обережності.","Виконати обгін за залізничним переїздом."],"provisional_correct_index":2},{"id":"14-004","topic":"14","number":4,"question":"Чи може водій виконати обгін після проїзду цих знаків?","options":["Не може.","Може за умови, що обгін буде завершено за 100 м до переїзду.","Може в будь-якому випадку."],"provisional_correct_index":1},{"id":"14-005","topic":"14","number":5,"question":"Чи дозволено в цій ситуації водієві синього автомобіля виконати обгін білого автомобіля?","options":["Заборонено, якщо швидкість білого автомобіля вище 30 км/год.","Заборонено в будь-якому випадку.","Дозволено.","Дозволено через 100 м."],"provisional_correct_index":2},{"id":"14-006","topic":"14","number":6,"question":"Чи дозволено обгін у даній ситуації?","options":["Дозволено.","Дозволено за умови, що швидкість автомобіля, який рухається попереду, менше 30 км/год.","Заборонено."],"provisional_correct_index":2},{"id":"14-007","topic":"14","number":7,"question":"Чи дозволено обгін у даній дорожній ситуації?","options":["Дозволено.","Дозволено за умови, що швидкість автомобіля, який рухається попереду, менше 30 км/год.","Заборонено."],"provisional_correct_index":2},{"id":"14-008","topic":"14","number":8,"question":"Чи дозволяється водієві синього автомобіля почати обгін у цій ситуації?","options":["Дозволяється.","Забороняється.","Дозволяється, якщо водій білого автомобіля включив аварійну сигналізацію."],"provisional_correct_index":1},{"id":"14-009","topic":"14","number":9,"question":"Чи дозволено водієві обгін у цьому місці?","options":["Дозволено, якщо не буде створено перешкоди зустрічним транспортним засобам.","Дозволено за умови, що водій автомобіля, який їде попереду, не почав обгін або перестроювання.","Дозволено у випадках, зазначених у відповідях 1 і 2.","Заборонено."],"provisional_correct_index":3},{"id":"14-010","topic":"14","number":10,"question":"Чи дозволено водієві чорного автомобіля виконати обгін у цій ситуації?","options":["Дозволено, переконавшись у відсутності зустрічних автомобілів.","Дозволено, якщо швидкість автомобіля, що обганяється, менше ніж 30 км/год.","Заборонено.","Дозволено за умови виконання вимог з відповідей 1 і 2."],"provisional_correct_index":2},{"id":"14-011","topic":"14","number":11,"question":"Чи дозволено водієві сірого автомобіля виконати обгін білого?","options":["Дозволено.","Заборонено.","Дозволено тільки в населеному пункті."],"provisional_correct_index":1},{"id":"14-012","topic":"14","number":12,"question":"Чи дозволено обгін водієві зеленого автомобіля в цій ситуації?","options":["Заборонено.","Дозволено."],"provisional_correct_index":0},{"id":"14-013","topic":"14","number":13,"question":"Чи дозволено водієві білого автомобіля виконати обгін у цій ситуації?","options":["Заборонено.","Дозволено."],"provisional_correct_index":0},{"id":"14-014","topic":"14","number":14,"question":"Чи дозволено виконати обгін у даній дорожній ситуації?","options":["Заборонено.","Дозволено, якщо швидкість автомобіля, що обганяється, менше 30 км/год.","Дозволено, якщо смуга зустрічного руху вільна.","Дозволено при дотриманні умов, зазначених у відповідях 2 і 3."],"provisional_correct_index":0},{"id":"14-015","topic":"14","number":15,"question":"Чи дозволено водієві жовтого    автомобіля виконати  обгін  у  цій ситуації?","options":["Дозволено в будь-якому випадку.","Заборонено.","Дозволено, якщо швидкість автомобіля, що обганяється, менше 30 км/год."],"provisional_correct_index":1},{"id":"14-016","topic":"14","number":16,"question":"Чи дозволено виконати обгін у цій ситуації?","options":["Дозволено в будь-якому випадку.","Заборонено.","Дозволено, якщо швидкість автомобіля, що обганяється, менше 30 км/год."],"provisional_correct_index":1},{"id":"14-017","topic":"14","number":17,"question":"Чи дозволено водієві виконати    обгін  транспортних   засобів, що рухаються з увімкненими проблисковими маячками оранжевого кольору?","options":["Заборонено.","Дозволено."],"provisional_correct_index":1},{"id":"14-018","topic":"14","number":18,"question":"Чи правильно  водій  зеленого  автомобіля виконав  обгін синього автомобіля?","options":["Неправильно: обгін перед залізничним переїздом заборонений.","Правильно, оскільки обгін був завершений за 100 м до залізничного переїзду."],"provisional_correct_index":1},{"id":"14-019","topic":"14","number":19,"question":"Чи дозволено водієві жовтого автомобіля виконати обгін синього так, як показано на малюнку?","options":["Заборонено.","Дозволено в будь-якому випадку.","Дозволено за умови, що синій автомобіль рухається повільно."],"provisional_correct_index":0},{"id":"14-020","topic":"14","number":20,"question":"Чи дозволено водієві синього автомобіля обігнати мопед?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"14-021","topic":"14","number":21,"question":"У чому повинен  переконатися  водій  перед початк
