ом  обгону  за відсутності зустрічних транспортних засобів  і транспортних засобів, що рухаються позаду?","options":["У тому, що на проїзній частині рівна дорога.","У тому, що після обгону зможе, не створюючи перешкоди транспортному засобу, якого він обганяє, повернутися на займану смугу.","Відповіді 1 і 2."],"provisional_correct_index":1},{"id":"14-022","topic":"14","number":22,"question":"Чи має право водій чорного автомобіля розпочати обгін синього автомобіля?","options":["Не має права - повинен дати дорогу зустрічному автомобілю.","Має право."],"provisional_correct_index":0},{"id":"14-023","topic":"14","number":23,"question":"Чи може водій зеленого автомобіля почати обгін сірого автомобіля?","options":["Може, увімкнувши звуковий сигнал.","Не може – повинен дочекатися, поки   сірий автомобіль завершить обгін."],"provisional_correct_index":1},{"id":"14-024","topic":"14","number":24,"question":"Чи дозволяється водієві автомобіля виконати обгін мотоцикліста на цьому перехресті?","options":["Дозволяється при дотриманні заходів безпеки.","Забороняється.","Дозволяється за умови, що швидкість мотоцикліста менше ніж 30 км/год."],"provisional_correct_index":1},{"id":"14-025","topic":"14","number":25,"question":"Як повинен діяти водій чорного автомобіля, що збирається виконувати обгін, в даній ситуації?","options":["Дати можливість обігнати себе і після цього почати обгін.","Не перешкоджати обгону, підвищуючи швидкість.","Виконати обидві дії."],"provisional_correct_index":2},{"id":"14-026","topic":"14","number":26,"question":"Що в даній ситуації повинен зробити водій зеленого автомобіля перед тим, як почати обгін?","options":["Переконатися, що водій сірого автомобіля не подав сигнал про намір повороту (перестроювання) ліворуч, і почати обгін.","Подати звуковий сигнал для привернення уваги водія транспортного засобу, що рухається попереду, й обов'язково (негайно) почати обгін.","Виконати всі вище перелічені дії."],"provisional_correct_index":0},{"id":"14-027","topic":"14","number":27,"question":"Як повинен діяти в даній ситуації водій сірого автомобіля, який збирається виконати обгін?","options":["Збільшити швидкість і, виїхавши перед зеленим автомобілем, виконати обгін.","Дочекатися, поки його обжене зелений автомобіль, і тільки потім виконати обгін."],"provisional_correct_index":1},{"id":"14-028","topic":"14","number":28,"question":"Чи дозволено водієві білого автомобіля виконати обгін трактора в даній ситуації?","options":["Заборонено.","Дозволено, якщо трактор рухається зі швидкістю менше ніж 30 км/год.","Дозволено, при цьому він повинен переконатися в безпеці маневру."],"provisional_correct_index":0},{"id":"14-029","topic":"14","number":29,"question":"Як  повинен  вчинити  водій   синього автомобіля, що рухається прямо, у даній ситуації?","options":["Зупинитися перед перехрестям і дочекатися, поки фіолетовий автомобіль поверне ліворуч.","Об'їхати фіолетовий автомобіль праворуч, забезпечивши безпеку руху."],"provisional_correct_index":1},{"id":"14-030","topic":"14","number":30,"question":"Чи дозволено у цьому місці водієві білого автомобіля виконати обгін?","options":["Дозволено за умови, що обгін завершиться до перехрестя.","Дозволено, якщо швидкість транспортного засобу, що обганяється, менше ніж 30 км/год.","Заборонено."],"provisional_correct_index":0},{"id":"14-031","topic":"14","number":31,"question":"Чи дозволено водію червоного автомобіля виконати обгін в даному місці дороги?","options":["Дозволено обгін на перехресті, за   умови, що швидкість транспортного засобу, що обганяється, менше ніж 30 км/год.","Заборонено."],"provisional_correct_index":1},{"id":"14-032","topic":"14","number":32,"question":"Чи дозволено обгін транспортного засобу, який виконує об'їзд або обгін?","options":["Заборонено.","Дозволено  за  умови, що одиночний  транспортний  засіб  рухається  зі швидкістю менше ніж 30 км/год.","Дозволено."],"provisional_correct_index":0},{"id":"14-033","topic":"14","number":33,"question":"На дорогах з якою мінімальною кі ions":["На мостах.","На шляхопроводах й естакадах.","Під мостами, шляхопроводами та естакадами.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"15-081","topic":"15","number":81,"question":"Чи дозволено водіям легкових автомобілів виконувати зупинку або стоянку на лівому боці дороги, яка має по одній смузі для руху в кожному напрямку, без трамвайних колій посередині  і не розділена суцільною розміткою, а також на лівому боці дороги  з одностороннім рухом у населеному пункті?","options":["Дозволено.","Заборонено."],"provisional_correct_index":0},{"id":"15-082","topic":"15","number":82,"question":"На яких дорогах населених пунктів водієві легкового автомобіля дозволено поставити свій транспортний засіб біля лівого краю проїзної частини?","options":["На дорогах, що мають по одній смузі для руху в кожному напрямку, без трамвайних колій посередині і не розділених суцільною розміткою.","На дорозі з одностороннім рухом.","На всіх дорогах, що мають по одній смузі для руху в кожному напрямку.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":3},{"id":"15-083","topic":"15","number":83,"question":"У яких місцях заборонено зупинку транспортних засобів?","options":["У місцях, де буде неможливим зустрічний роз'їзд.","У місцях, де буде неможливим об'їзд транспортного засобу, що зупинився.","У місцях, де транспортний засіб закриває від інших водіїв сигнали світлофора або дорожні знаки.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"15-084","topic":"15","number":84,"question":"На якій відстані від виїздів з прилеглих територій водіям дозволяється виконати зупинку?","options":["Не ближче 10 м.","Не ближче 15 м.","Не ближче 20 м."],"provisional_correct_index":0},{"id":"15-085","topic":"15","number":85,"question":"Чи дозволена стоянка в місцях, де Правилами     дорожнього руху забороняється зупинка транспортних засобів?","options":["Заборонено.","Дозволено на час до 20 хвилин.","Дозволено."],"provisi ал світлофора?","options":["Повинен  продовжувати  рух  у  наміченому  напрямку,  незважаючи на ввімкнений заборонний сигнал світлофора.","Повинен зупинитися перед дорожньою розміткою «Стоп-лінія» і продовжити рух, коли ввімкнеться зелений сигнал світлофора."],"provisional_correct_index":1},{"id":"16.1-006","topic":"16.1","number":6,"question":"Як повинен діяти водій зеленого автомобіля, що повертає ліворуч, у даній ситуації?","options":["Виїхати в наміченому напрямку незалежно від сигналу світлофора на шляху свого руху.","Зупинитися перед дорожньою розміткою «Стоп-лінія» і продовжити рух, коли ввімкнеться зелений сигнал світлофора."],"provisional_correct_index":1},{"id":"16.1-007","topic":"16.1","number":7,"question":"Хто в даній ситуації повинен дати дорогу?","options":["Водій автомобіля.","Водій трамвая."],"provisional_correct_index":1},{"id":"16.1-008","topic":"16.1","number":8,"question":"Який транспортний засіб першим проїде дане перехрестя?","options":["Червоний автомобіль.","Синій автомобіль."],"provisional_correct_index":0},{"id":"16.1-009","topic":"16.1","number":9,"question":"Як велосипедист проїде перехрестя в даному випадку?","options":["Дасть дорогу трамваю.","Проїде першим, маючи перевагу."],"provisional_correct_index":1},{"id":"16.1-010","topic":"16.1","number":10,"question":"Як повинен вчинити водій червоного автомобіля, що     збирається повертати праворуч, у даній ситуації?","options":["Продовжити рух тільки після ввімкнення зеленого сигналу світлофора.","Повернути праворуч, давши дорогу пішоходам і транспортним засобам, які рухаються з інших напрямків.","Повернути  праворуч, давши  дорогу лише  транспортним  засобам, що рухаються з інших напрямків."],"provisional_correct_index":1},{"id":"16.1-011","topic":"16.1","number":11,"question":"Чи дозволено Вам повернути праворуч у даній ситуації при ввімкненому червоному сигналі світлофора?","options":["Заборонено.","Дозволено, давши дорогу пішоходам.","Дозволено, давши дорогу транспортним засобам і пішоходам, що рухаються з інших напрямків."],"provisional_correct_index":2},{"id":"16.1-012","topic":"16.1","number":12,"question":"На якому малюнку водій чорного автомобіля, який зупинився на заборонний сигнал світлофора, щоб потім їхати в прямому напрямку, обов'язково повинен продовжити рух праворуч (у напрямку стрілки), коли транспортний  засіб, що наближається  ззаду, подав  сигнал повороту праворуч?","options":["На обох.","На першому.","На другому."],"provisional_correct_index":1},{"id":"16.1-013","topic":"16.1","number":13,"question":"Що повинен зробити водій чорного автомобіля, який має намір їхати прямо, якщо в дзеркалі заднього виду він побачив транспортний засіб з увімкненим правим поворотом?","options":["Продовжити  рух  у  наміченому   напрямку, тільки коли буде увімкнено зелений сигнал світлофора.","Продовжувати рух у напрямку, вказаному стрілкою, увімкненою в додатковій секції.","Перестроїтися в лівий ряд."],"provisional_correct_index":1},{"id":"16.1-014","topic":"16.1","number":14,"question":"Чи повинен водій синього автомобіля дати дорогу велосипедистові в даній ситуації?","options":["Повинен.","Не повинен."],"provisional_correct_index":0},{"id":"16.1-015","topic":"16.1","number":15,"question":"Яка черговість проїзду автомобілів на даному перехресті?","options":["Білий, фіолетовий.","Фіолетовий, білий."],"provisional_correct_index":1},{"id":"16.1-016","topic":"16.1","number":16,"question":"Повертаючи ліворуч на перехресті, водій білого автомобіля повинен:","options":["Дати дорогу тільки сірому автомобілю.","Дати дорогу тільки зеленому автомобілю.","Дати дорогу сірому і зеленому автомобілям."],"provisional_correct_index":2},{"id":"16.1-017","topic":"16.1","number":17,"question":"Як водій білого автомобіля, що   наближається    до    перехрестя, повинен проїхати дане перехрестя?","options":["Зупинитися перед розміткою «Стоп-лінія» і далі продовжити рух.","Зупинитися  перед  розміткою  «Стоп-лінія»    і,  давши  дорогу  іншим транспортним засобам, продовжит visional_correct_index":0},{"id":"17-007","topic":"17","number":7,"question":"Ви як водій автомобіля, під’їжджаючи до автобуса в населеному пункті, що розпочинає рух від позначеної    зупинки, розташованої в заїзному «кармані», повинні:","options":["Зменшити швидкість, а в разі потреби зупинитися, щоб дати можливість маршрутному транспортному засобу розпочати рух.","Обов’язково перестроїтись на ліву смугу.","Проїхати повз автобус не зменшуючи швидкості, бо водій автобусу перед початком руху повинен надати дорогу."],"provisional_correct_index":0},{"id":"17-008","topic":"17","number":8,"question":"Як повинен діяти водій білого автомобіля в зображеній на малюнку ситуації, під’їжджаючи до автобуса, що розпочинає рух від позначеної зупинки, розташованої в заїзному «кармані», поза населеним пунктом?","options":["Він повинен зменшити швидкість, а в разі потреби зупинитися, щоб дати можливість маршрутному транспортному засобу розпочати рух.","Водій білого автомобіля має перевагу у русі.»."],"provisional_correct_index":1},{"id":"17-009","topic":"17","number":9,"question":"Чи має право водій таксі рухатися на дорозі із смугою для маршрутних транспортних засобів?","options":["Має право рухатися.","Не має права рухатися."],"provisional_correct_index":0},{"id":"17-010","topic":"17","number":10,"question":"Чи має право водій таксі здійснювати посадку та висадку пасажирів у межах смуги для маршрутних транспортних засобів?","options":["Має право здійснювати посадку та висадку пасажирів.","Не має права здійснювати посадку та висадку пасажирів."],"provisional_correct_index":0},{"id":"17-011","topic":"17","number":11,"question":"Чи забороняється на дорозі із смугою для маршрутних транспортних засобів, позначеної дорожнім знаком 5.8 або 5.11, рух  і зупинка інших транспортних засобів?","options":["Забороняються рух і зупинка інших транспортних засобів.","Дозволяється рух і зупинка інших транспортних засобів.","Дозволяється рух  і зупинка  тільки для  таксі, мопедам, мотоциклам  (за винятком  мотоциклів  з  боковим  причепом,  мотоколясок,  триколісних транспортних засобів) та велосипедистам."],"provisional_correct_index":2},{"id":"18-001","topic":"18","number":1,"question":"Яке значення мають два миготливі сигнали світлофора в даній ситуації?","options":["Забороняють рух.","Інформують про наявність пішоходів на пішохідному переході.","Інформують  про  наявність  небезпечного  нерегульованого  пішохідного переходу.","Інформують  про  наявність  небезпечного  регульованого  пішохідного переходу."],"provisional_correct_index":2},{"id":"18-002","topic":"18","number":2,"question":"Як повинні вчинити водії, наближаючись до транспортного засобу з розпізнавальним знаком  «Діти», що  стоїть  з увімкненою аварійною сигналізацією та проблисковим маячком оранжевого кольору?","options":["Тільки зменшити швидкість.","Обов'язково зупинитися перед цим транспортним засобом.","Зменшити швидкість, а в разі потреби зупинитися, щоб уникнути наїзду на дітей."],"provisional_correct_index":2},{"id":"18-003","topic":"18","number":3,"question":"Як повинен вчинити в даній ситуації водій сірого автомобіля?","options":["Подати звуковий сигнал і, знизивши  швидкість,  продовжити  рух,  давши дорогу пішоходам.","Об'їхати трамвай зліва, давши дорогу зустрічним транспортним засобам.","Зупинитися, щоб дати дорогу пішоходам. Продовжувати рух дозволяється лише тоді, коли пішоходи залишать проїзну частину, а двері трамвая зачиняться."],"provisional_correct_index":2},{"id":"18-004","topic":"18","number":4,"question":"Яких заходів повинні вживати водії, проїжджаючи повз пішоходів, які очікують увімкнення дозвільного сигналу світлофора на острівцях безпеки або на лінії, що розділяє транспортні потоки?","options":["Подавати звуковий сигнал.","Дотримуватися безпечного інтервалу."],"provisional_correct_index":1},{"id":"18-005","topic":"18","number":5,"question":"Як повинен вчинити водій автомобіля, якщо автомобіль, що їде перед ним, почав зменшувати швидкість  перед нерегульованим пішохідним переходом?","options":["Подати звуковий сигнал і далі продовжити рух, дотримуючись обережності.","Знизити швидкість і рухатися далі, дотримуючись заходів безпеки.","Знизити швидкість (у разі необхідності – зупинитися)  і продовжити рух, тільки переконавшись, що на пішохідному переході немає пішоходів, для яких може бути створена перешкода чи небезпека."],"provisional_correct_index":2},{"id":"18-006","topic":"18","number":6,"question":"Як повинні вчинити водії в ситуації, коли пішохід, що виходить на проїзну частину, подає сигнал тростиною білого кольору, спрямованою вперед?","options":["Подати звуковий сигнал, тому що в   даному    місці    перехід    дороги заборонено.","Пропустити пішохода.","Зменшити швидкість і, дотримуючись безпечного інтервалу, проїхати біля пішохода."],"provisional_correct_index":1},{"id":"18-007","topic":"18","number":7,"question":"Ви зупинилися, щоб дати дорогу пішоходам, які виконують посадку в трамвай і висадку з нього. Коли вам дозволено продовжити рух?","options":["Коли пішоходи залишать проїзну частину.","Коли двері трамвая зачиняться.","Коли пішоходи залишать проїзну частину і двері трамвая зачиняться."],"provisional_correct_index":2},{"id":"18-008","topic":"18","number":8,"question":"Як Ви повинні вчинити в ситуації, коли попереду Вас зупинився трамвай для посадки і висадки пасажирів?","options":["Знизити швидкість і проїхати біля трамвая.","Об'їхати трамвай з лівого боку.","Зупинитися, щоб дати дорогу пішоходам. Продовжувати рух дозволяється лише тоді, коли пішоходи залишать проїзну частину, а двері трамвая зачиняться."],"provisional_correct_index":2},{"id":"18-009","topic":"18","number":9,"question":"Як ви повинні вчинити в ситуації, коли за пішохідним переходом утворився затор?","options":["Зупинитися перед пішохідним переходом.","Зупинитися  на  пішохідному  переході, залишивши  місце  для  проходу пішоходів.","Зупинитися на пішохідному переході, тільки якщо на ньому немає пішоходів."],"provisional_correct_index":0},{"id":"18-010","topic":"18","number":10,"question":"Що  повинен  зробити  водій  транспортного  засобу, якщо інший транспортний засіб, що рухається по суміжній смузі попереду нього, перед нерегульованим пішохідним переходом почав знижувати швидкість або зовсім зупинився?","options":["Повинен  тільки  знизити  швидкість, щоб  переконатися  у  відсутності пішоходів.","Повинен обов'язково зупинитися, щоб переконатися у відсутності пішоходів.","Перед  пішохідним  переходом  повинен  зменшити  швидкість  (у  разі необхідності – зупинитися)  і продовжити рух, тільки переконавшись, що на пішохідному  переході  немає  пішоходів,  для  яких може  бути  створена перешкода чи небезпека.","Подати звуковий сигнал, щоб попередити пішоходів."],"provisional_correct_index":2},{"id":"18-011","topic":"18","number":11,"question":"Як ви повинні вчинити в ситуації, коли мікроавтобус зупинився перед пішохідним переходом на нерегульованому перехресті?","options":["Рухатися далі, оскільки для вас встановлено знак «Головна дорога».","Зменшити швидкість (у разі необхідності – зупинитися) і продовжити рух, тільки переконавшись, що на пішохідному переході немає пішоходів, для яких може бути створена перешкода чи небезпека."],"provisional_correct_index":1},{"id":"18-012","topic":"18","number":12,"question":"Як ви повинні вчинити в ситуації, коли автомобіль, що їде перед вами, спочатку почав знижувати швидкість, а потім  і зовсім зупинився перед нерегульованим пішохідним переходом?","options":["Подати звуковий сигнал і знизити швидкість руху.","Знизити швидкість і обережно проїхати пішохідний перехід.","Зменшити швидкість (у разі потреби – зупинитися) і продовжити рух, тільки переконавшись, що на пішохідному переході немає пішоходів, для яких може бути створена перешкода чи небезпека."],"provisional_correct_index":2},{"id":"18-013","topic":"18","number":13,"question":"Що повинен зробити водій транспортного засобу в разі ввімкнення сигналу світлофора, що дозволяє  рух, якщо перед ним перебувають пішоходи, що закінчують перехід проїзної частини?","options":["Безпечно об'їхати пішоходів.","Подати звуковий сигнал, щоб пішоходи пришвидшили перехід проїзної частини.","Дати дорогу пішоходам."],"provisional_correct_index":2},{"id":"18-014","topic":"18","number":14,"question":"Як повинен вчинити водій транспортного засобу, наближаючись до нерегульованого пішохідного переходу, якщо на ньому є пішоходи?","options":["Знизити швидкість і безпечно об'їхати пішоходів, що переходять.","Обов'язково зупинитися, щоб дати дорогу пішоходам, що переходять.","Зменшити швидкість, а в разі потреби зупинитися, щоб дати дорогу пішоходам."],"provisional_correct_index":2},{"id":"18-015","topic":"18","number":15,"question":"Як ви повинні вчинити, якщо світлофор працює в режимі миготіння жовтого сигналу?","options":["Не повинні давати дорогу пішоходам.","Повинні знизити швидкість, а в разі потреби зупинитися, щоб дати дорогу пішоходам.","Повинні тільки зменшити швидкість, щоб дати дорогу пішоходам."],"provisional_correct_index":1},{"id":"18-016","topic":"18","number":16,"question":"Як ви повинні вчинити, наближаючись до нерегульованого пішохідного переходу?","options":["Повинні об'їхати пішоходів ззаду.","Повинні тільки зупинитися, щоб дати дорогу пішоходам.","Повинні тільки знизити швидкість, щоб дати дорогу пішоходам.","Повинні знизити швидкість, а в разі потреби зупинитися, щоб дати дорогу пішоходам."],"provisional_correct_index":3},{"id":"18-017","topic":"18","number":17,"question":"Як ви повинні вчинити в ситуації, наближаючись до автобуса, який виконує посадку або висадку організованих груп дітей?","options":["Знизити швидкість руху і бути обережним.","Знизити швидкість, а в разі потреби зупинитися, щоб уникнути наїзду на дітей.","Подати звуковий сигнал, щоб привернути до себе увагу.","Відповіді 2 і 3."],"provisional_correct_index":1},{"id":"18-018","topic":"18","number":18,"question":"У цьому випадку водій білого автомобіля може продовжувати рух лише тоді, коли пішоходи залишать проїзну частину і в трамваї зачиняться двері.","options":["Так.","Ні."],"provisional_correct_index":0},{"id":"18-019","topic":"18","number":19,"question":"Чи має право в даному випадку водій білого автомобіля об’їхати пішоходів?","options":["Так.","Ні."],"provisional_correct_index":1},{"id":"19-001","topic":"19","number":1,"question":"Темною порою доби вважається:","options":["Частина доби від закінчення вечірніх (30 хв. після заходу сонця) до початку ранкових сутінків (30 хв. до сходу сонця).","Частина доби від заходу до сходу сонця."],"provisional_correct_index":1},{"id":"19-002","topic":"19","number":2,"question":"Як ви повинні діяти в разі погіршення видимості в напрямку руху, викликаного світлом фар зустрічних транспортних засобів?","options":["Збільшити швидкість, щоб швидше роз'їхатися із зустрічними транспортними засобами.","Зменшити швидкість до безпечної."],"provisional_correct_index":1},{"id":"19-003","topic":"19","number":3,"question":"Що вмикається на транспортному засобі під час зупинки на дорозі в темну пору доби?","options":["Аварійна сигналізація.","Протитуманні фари.","Габаритні або стоянкові ліхтарі."],"provisional_correct_index":2},{"id":"19-004","topic":"19","number":4,"question":"Що вмикається на транспортному засобі під час вимушеної зупинки на дорозі в темну пору доби?","options":["Аварійна сигналізація.","Протитуманні фари.","Габаритні або стоянкові ліхтарі.","Габаритні або стоянкові ліхтарі спільно з аварійною сигналізацією."],"provisional_correct_index":3},{"id":"19-005","topic":"19","number":5,"question":"Що вмикається на транспортному засобі під час зупинки на дорозі в умовах недостатньої видимості?","options":["Стоянкові вогні.","Протитуманні фари.","Габаритні або стоянкові ліхтарі, додатково дозволяється увімкнути ближнє світло або протитуманні фари й задні протитуманні ліхтарі.","Габаритні або стоянкові ліхтарі одночасно з аварійною сигналізацією."],"provisional_correct_index":2},{"id":"19-006","topic":"19","number":6,"question":"Як необхідно вчинити в разі вимушеної зупинки на дорозі в темну пору доби  або в умовах  недостатньої  видимості, якщо  габаритні  ліхтарі несправні?","options":["Поставити транспортний засіб правіше.","Увімкнути протитуманні фари.","Транспортний засіб слід прибрати за межі дороги. Якщо це неможливо, його необхідно позначити відповідно до вимог Правил дорожнього руху."],"provisional_correct_index":2},{"id":"19-007","topic":"19","number":7,"question":"Як дозволено використовувати протитуманні фари в умовах недостатньої видимості?","options":["Тільки разом з ближнім або дальнім світлом фар.","Тільки окремо від ближнього світла фар.","Як окремо, так і разом з ближнім або дальнім світлом фар."],"provisional_correct_index":2},{"id":"19-008","topic":"19","number":8,"question":"Як дозволено використовувати протитуманні фари в темну пору доби?","options":["Тільки разом з ближнім або дальнім світлом фар.","Тільки окремо від ближнього світла фар.","Як окремо, так і разом з ближнім або дальнім світлом фар."],"provisional_correct_index":0},{"id":"19-009","topic":"19","number":9,"question":"Чи дозволено водієві в темний час доби рухатися з протитуманними фарами, увімкненими без ближнього або дальнього світла?","options":["Заборонено.","Дозволено."],"provisional_correct_index":0},{"id":"19-010","topic":"19","number":10,"question":"У   яких   умовах   водіям  оперативних транспортних засобів дозволено використовувати фару-прожектор або фару-шукач?","options":["Під час виконання службових завдань, вживши заходів для того, щоб не засліплювати інших учасників дорожнього руху.","Завжди в темний час доби або в умовах недостатньої видимості."],"provisional_correct_index":0},{"id":"19-011","topic":"19","number":11,"question":"Чи дозволено підключати до задніх протитуманних ліхтарів сигнали гальмування?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"19-012","topic":"19","number":12,"question":"У яких умовах дозволено використовувати задній протитуманний ліхтар?","options" ти  водій транспортного  засобу в  разі вимушеної зупинки на залізничному  переїзді, якщо йому не вдається звільнити залізничний переїзд?","options":["Коли є можливість, послати двох чоловік уздовж колій в обидва боки від переїзду не менш як на 1000 м (якщо одного, то в бік імовірної появи поїзда, а на  одноколійних  переїздах  -  у  бік  гіршої  видимості  залізничної  колії), пояснивши  їм  правила  подавання  сигналу  зупинки  машиністу  поїзда (локомотива, дрезини), що наближається.","Залишатися біля транспортного засобу і, подаючи сигнали загальної тривоги, вживати всіх заходів для звільнення переїзду.","У разі появи поїзда бігти йому назустріч, подаючи сигнал зупинки.","Виконати все перераховане."],"provisional_correct_index":3},{"id":"20-012","topic":"20","number":12,"question":"Що  є сигналом зупинки  поїзда, який подається людиною в  разі вимушеної зупинки транспортного засобу на залізничному переїзді або іншої небезпеки?","options":["Круговий рух руки  із шматком яскравої тканини або будь-яким добре помітним предметом у світлий час доби, у темну пору доби  і в умовах недостатньої видимості - з факелом або ліхтарем.","Жести руками із шматком яскравої тканини або будь-яким добре помітним предметом у світлий час доби, у темну пору доби  і в умовах недостатньої видимості - з факелом або ліхтарем.","Обидві відповіді правильні."],"provisional_correct_index":0},{"id":"20-013","topic":"20","number":13,"question":"Як ви повинні вчинити в ситуації, коли при під'їзді до залізничного переїзду ви побачили поїзд, що наближається, але при цьому звукова та світлова сигналізація залізничного переїзду не увімкнена?","options":["Продовжити рух через переїзд.","Зупинитися в передбаченому місці, так як проїзд через переїзд заборонений."],"provisional_correct_index":1},{"id":"20-014","topic":"20","number":14,"question":"Як ви повинні вчинити в  ситуації, якщо ви зупинилися перед залізничним переїздом на заборонний сигнал світлофора, коли поїзд вже проїхав, а світлова та звукова сигналізація ще не вимкнулися?","options":["Продовжити рух через переїзд у будь-якому випадку.","Продовжити рух через переїзд, тільки переконавшись у відсутності поїзда, що наближається.","Дочекатися  виключення  заборонного  сигналу  світлофора  та  звукової сигналізації, а також переконатися у відсутності поїзда, що наближається, після чого продовжити рух."],"provisional_correct_index":2},{"id":"20-015","topic":"20","number":15,"question":"Як ви повинні вчинити в ситуації, коли на залізничному переїзді увімкнулася світлова та звукова сигналізація, а поїзд ще не з'явився в межах видимості?","options":["Проїхати залізничний переїзд.","Зупинитися в передбаченому місці, так як проїзд через переїзд заборонений."],"provisional_correct_index":1},{"id":"20-016","topic":"20","number":16,"question":"Як ви повинні вчинити в цій ситуації, коли шлагбауми, які знаходяться перед вами, почали опускатися?","options":["Проїхати далі.","Зупинитися в передбаченому місці, так як проїзд через переїзд заборонений.","Зупинитися, тільки якщо увімкнений заборонний сигнал світлофора або увімкнена звукова сигналізація."],"provisional_correct_index":1},{"id":"20-017","topic":"20","number":17,"question":"Залізничним переїздом вважається:","options":["Перетин дороги з трамвайними коліями на одному рівні.","Перехрещення дороги із залізничними коліями на одному рівні.","Перехрещення дороги із залізничними коліями на різних рівнях.","Відповіді, зазначені в пунктах 1 та 2."],"provisional_correct_index":1},{"id":"20-018","topic":"20","number":18,"question":"Де водій автомобіля повинен зупинити свій транспортний засіб для пропуску  поїзда, що наближається,  за відсутності на  переїзді  засобів організації дорожнього руху?","options":["За 5 м до найближчої рейки.","За 10 м до найближчої рейки.","За 15 м до найближчої рейки.","За 20 м до найближчої рейки."],"provisional_correct_index":1},{"id":"20-019","topic":"20","number":19,"question":"У чому  повинен  переконатися  водій при  під'їзді  до  будь-якого залізничного переїзду?","options":["У тому, що перед переїздом є дорожня розмітка «Стоп-лінія».","У тому, що перед переїздом є дорожній знак «Проїзд без зупинки заборонено».","У тому, що не наближається поїзд (локомотив, дрезина)."],"provisional_correct_index":2},{"id":"20-020","topic":"20","number":20,"question":"Чим повинні керуватися водії    транспортних засобів під час проїзду будь-яких залізничних переїздів?","options":["Сигналами і вказівками чергового по переїзду.","Положенням шлагбаума.","Світловою і звуковою сигналізацією.","Дорожніми знаками і дорожньою розміткою.","Усім переліченим вище."],"provisional_correct_index":4},{"id":"20-021","topic":"20","number":21,"question":"Де водіям транспортних засобів дозволено перетинати залізничні колії?","options":["Тільки на залізничних переїздах.","Тільки на залізничних переїздах, а якщо їх немає, то в місцях, де дорога добре проглядається в обидва боки."],"provisional_correct_index":0},{"id":"20-022","topic":"20","number":22,"question":"Водії транспортних засобів можуть перетинати залізничні колії лише:","options":["На залізничних переїздах з шлагбаумом.","На залізничних переїздах без шлагбаума.","У будь-якому місці, де залізничні колії добре проглядаються.","На будь-якому залізничному переїзді.","Відповіді 3 і 4."],"provisional_correct_index":3},{"id":"20-023","topic":"20","number":23,"question":"Що є звуковим сигналом загальної тривоги на залізничних переїздах?","options":["Серія сигналів, що складається з одного довгого і трьох коротких сигналів.","Серія сигналів, що складається з трьох довгих і одного короткого сигналу.","Серія сигналів, що складається з двох довгих і трьох коротких сигналів."],"provisional_correct_index":0},{"id":"20-024","topic":"20","number":24,"question":"У якому випадку Ви можете проїхати під шлагбаумом, який опускається на залізничному переїзді?","options":["Якщо потяг, який наближається, ще достатньо далеко.","Якщо Ви встигнете проїхати, не пошкодивши цей шлагбаум.","У жодному. Рух за цих умов заборонено."],"provisional_correct_index":2},{"id":"20-025","topic":"20","number":25,"question":"Якщо ви наближаєтеся до залізничного переїзду, Ви повинні зупинитися:","options":["Перед розміткою «стоп-лінія».","Перед дорожнім знаком «проїзд без зупинки заборонено».","Перед світлофором так, щоб бачити сигнали.","В будь-якій із перерахованих вище ситуацій."],"provisional_correct_index":3},{"id":"20-026","topic":"20","number":26,"question":"За якої умови дозволено виконати обгін на залізничному переїзді:","options":["Якщо залізничний переїзд регульований.","Якщо шлагбаум піднятий.","Обгін на залізничному переїзді заборонено."],"provisional_correct_index":2},{"id":"20-027","topic":"20","number":27,"question":"За якої умови дозволено виконати обгін на залізничному переїзді:","options":["Якщо швидкість автомобіля, що рухається попереду не перевищує 30 км/год.","Якщо необхідно виконати обгін лише одного транспортного засобу.","У випадках 1 і 2.","Обгін на залізничному переїзді заборонено."],"provisional_correct_index":3},{"id":"20-028","topic":"20","number":28,"question":"Чи дозволено Вам проїхати залізничний переїзд, якщо шлагбаум не опустився, а лише увімкнулась світлова та звукова сигналізація?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"20-029","topic":"20","number":29,"question":"Чи дозволено Вам рух через залізничний переїзд заднім ходом, якщо ви пропустили поворот праворуч?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"20-030","topic":"20","number":30,"question":"Чи дозволено водієві в даному випадку розпочати рух заднім ходом?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"20-031","topic":"20","number":31,"question":"Чи дозволено водієві в даному випадку виконати розворот, якщо попереду і позаду нього немає транспортних засобів?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"21-001","topic":"21","number":1,"question":"У  якій  кількості  дозволяється   перевозити      пасажирів в обладнаному для цього транспортному засобі?","options":["У кількості, що забезпечує безпеку перевезення пасажирів.","У кількості, що відповідає фактичній кількості місць транспортного засобу.","У кількості, передбаченій технічною характеристикою транспортного засобу."],"provisional_correct_index":2},{"id":"21-002","topic":"21","number":2,"question":"У  якій  кількості  дозволено  перевозити  пасажирів  у  будь-якому транспортному засобі?","options":["Не більше ніж вісім.","У кількості, передбаченій технічною характеристикою транспортного засобу.","У кількості, при якій не перевищуються навантаження на осі, визначені технічною характеристикою транспортного засобу."],"provisional_correct_index":1},{"id":"21-003","topic":"21","number":3,"question":"Що забороняється водієві маршрутного транспортного засобу під час перевезення пасажирів?","options":["Розмовляти з пасажирами.","Їсти і пити.","Користуватися засобами зв’язку, тримаючи їх у руці.","Палити.","Все вищеперераховане."],"provisional_correct_index":4},{"id":"21-004","topic":"21","number":4,"question":"Чи дозволено водієві відчиняти двері транспортного засобу до його зупинки?","options":["Заборонено.","Дозволено, якщо на підніжках немає пасажирів.","Дозволено в будь-якому випадку."],"provisional_correct_index":0},{"id":"21-005","topic":"21","number":5,"question":"У якому  випадку  дозволено  перевозити  пасажирів  поза  кабіною транспортного засобу?","options":["В обладнаному для перевезення пасажирів кузові вантажного автомобіля з бортовою платформою.","В обладнаному для   перевезення  пасажирів кузові-фургоні  вантажного автомобіля.","У кузові трактора.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":3},{"id":"21-006","topic":"21","number":6,"question":"Чи дозволено перевозити дітей в дитячих утримуючих системах в не пристебнутому положенні?","options":["Дозволено.","На розсуд батьків.","Заборонено."],"provisional_correct_index":2},{"id":"21-007","topic":"21","number":7,"question":"За яких умов дозволено перевозити дитину в легковому автомобілі без використання дитячих утримуючих систем, що дають змогу пристебнути дитину за допомогою ременів безпеки?","options":["Якщо зріст дитини менше 145 см.","Якщо зріст дитини 150 см і більше.","Якщо дитина досягла 12-річного віку.»."],"provisional_correct_index":1},{"id":"21-008","topic":"21","number":8,"question":"Яке твердження, що стосується дитячих утримуючих систем, невірне?","options":["Діти повинні перебувати у дитячих утримуючих системах у пристебнутому положенні.","Дитячі утримуючі системи встановлюють на місцях для  сидіння, крім першого ряду.","У разі перевезення дитини віком до трьох років у легковому автомобілі на місці  для  сидіння  першого  ряду  допускається  встановлення  дитячих утримуючих систем, які встановлюються проти напрямку руху без відключення фронтальної подушки безпеки цього місця для сидіння."],"provisional_correct_index":2},{"id":"21-009","topic":"21","number":9,"question":"Яке найбезпечніше місце для розташування дитячої утримуючої системи в автомобілі?","options":["Середнє заднє сидіння.","Переднє сидіння.","Сидіння позаду водія."],"provisional_correct_index":0},{"id":"21-010","topic":"21","number":10,"question":"Чи є обов’язковим відключення фронтальної подушки безпеки цього місця для сидіння при встановленні дитячої утримуючої системи на передньому сидінні?","options":["Так.","Ні."],"provisional_correct_index":0},{"id":"21-011","topic":"21","number":11,"question":"У разі перевезення дитини віком до трьох років у легковому автомобілі на  місці  для  сидіння  першого  ряду,  дитячі  утримуючі  системи встановлюються:","options":["За напрямком руху легкового автомобіля.","Проти напрямку руху легкового автомобіля."],"provisional_correct_index":1},{"id":"21-012","topic":"21","number":12,"question":"У якому положенні повинні перебувати діти у дитячих утримуючих системах?","options":["У пристебнутому положенні.","У положенні, що забезпечує дитині комфортне перебування."],"provisional_correct_index":0},{"id":"22-001","topic":"22","number":1,"question":"Понад яку мінімальну відстань від зовнішнього краю переднього або заднього габаритного ліхтаря повинен виступати вантаж за шириною, щоб його потрібно було обов'язково позначити сигнальними щитками або прапорцями згідно з Правилами дорожнього руху?","options":["На 0,2 м.","На 0,3 м.","На 0,4 м.","На 0,5 м.","На 0,6 м."],"provisional_correct_index":2},{"id":"22-002","topic":"22","number":2,"question":"Понад яку мінімальну відстань від зовнішнього краю переднього або заднього габариту транспортного засобу повинен виступати вантаж за довжиною, щоб було обов'язковим його позначення сигнальними щитками або прапорцями згідно з Правилами дорожнього руху?","options":["На 0,4 м.","На 0,5 м.","На 1 м.","На 2 м."],"provisional_correct_index":2},{"id":"22-003","topic":"22","number":3,"question":"Яких заходів безпеки зобов'язаний вжити водій транспортного засобу, що перевозить вантаж, перед початком руху, а також під час руху?","options":["Забезпечити надійність розташування вантажу.","Забезпечити надійність кріплення вантажу.","Усе перелічене вище."],"provisional_correct_index":2},{"id":"22-004","topic":"22","number":4,"question":"Щоб  запобігти  падінню    і  волочіння  вантажу,  травмуванню супроводжуючих осіб або створенню перешкод для дорожнього руху, водій, що перевозить вантаж, зобов'язаний:","options":["Перед початком руху перевірити надійність розташування  і кріплення вантажу.","Під час руху контролювати надійність розташування і кріплення вантажу.","Виконувати обидві дії."],"provisional_correct_index":2},{"id":"22-005","topic":"22","number":5,"question":"У разі дотримання яких умов дозволяється перевезення вантажів?","options":["За умови, що вантаж не наражає на небезпеку учасників дорожнього руху, не створює шуму, не піднімає пилу та не забруднює проїзну частину і навколишнє середовище.","За умови, що вантаж не порушує  стійкості транспортного засобу  і не утруднює керування транспортним засобом.","За умови, що вантаж не обмежує водієві оглядовості.","За  умови, що  вантаж  не  закриває  зовнішніх  світлових  приладів, світлоповертачів, номерних і розпізнавальних знаків, а також не перешкоджає сприйманню сигналів, що подаються рукою.","У разі дотримання всіх перелічених вище умов."],"provisional_correct_index":4},{"id":"22-006","topic":"22","number":6,"question":"Перед початком руху, а також під час руху водій транспортного засобу зобов'язаний перевірити надійність розташування  і кріплення вантажу, щоб вантаж:","options":["Не наражав на небезпеку учасників дорожнього руху, не створював шуму, не піднімав пилу та не забруднював проїзну частину і навколишнє середовище.","Не обмежував водієві оглядовості.","Не падав, не волочився, не травмував супроводжуючих осіб і не створював перешкод для руху.","Відповіді 1 і 2.","Відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"23-001","topic":"23","number":1,"question":"При дотриманні яких умов дозволяється буксирування транспортного засобу з несправною гальмовою системою на жорсткому зчепленні?","options":["При дотриманні максимальної швидкості руху в 40 км/год.","За умови, що фактична маса буксируваного транспортного засобу не перевищує половини фактичної маси транспортного засобу, що буксирує."],"provisional_correct_index":1},{"id":"23-002","topic":"23","number":2,"question":"Жорстке зчеплення повинно забезпечувати відстань між транспортними засобами не більше ніж:","options":["1 м.","2 м.","3 м.","4 м.","5 м."],"provisional_correct_index":3},{"id":"23-003","topic":"23","number":3,"question":"Чи можуть перебувати пасажири в буксируваному легковому автомобілі в разі буксирування на жорсткому або гнучкому зчепленні?","options":["Не можуть.","Можуть."],"provisional_correct_index":1},{"id":"23-004","topic":"23","number":4,"question":"Де повинні перебувати пасажири у разі буксирування транспортного засобу способом часткового навантаження?","options":["В обох транспортних засобах.","Тільки   в   кузові   вантажного   автомобіля, що буксирує.","Тільки в кабіні і кузові автомобіля, що буксирує.","Лише в кабіні автомобіля, що буксирує."],"provisional_correct_index":3},{"id":"23-005","topic":"23","number":5,"question":"Під час буксирування яким із способів пасажири можуть перебувати в буксируваному транспортному засобі?","options":["Під час буксирування на жорсткому зчепленні – у вантажному автомобілі.","Під час буксирування на жорсткому зчепленні в світлу пору доби.","Під час буксирування на жорсткому або гнучкому зчепленні – в легковому автомобілі.","Завжди, під час будь-якого буксирування – в будь-якому буксируваному автомобілі."],"provisional_correct_index":2},{"id":"23-006","topic":"23","number":6,"question":"Буксируванням вважається переміщення одним транспортним засобом іншого,  яке  не належить  до  експлуатації  автопоїздів  (транспортних составів):","options":["На жорсткому або гнучкому зчепленні.","Способом часткового навантаження на платформу чи на спеціальне опорне пристосування.","Способом повного завантаження на платформу або спеціальний опорний пристрій.","Відповіді, зазначені в пунктах 1, 2.","Відповіді, зазначені в пунктах 1, 2, 3."],"provisional_correct_index":3},{"id":"23-007","topic":"23","number":7,"question":"Чи дозволяється буксирування на гнучкому зчепленні під час ожеледиці?","options":["Дозволяється зі швидкістю не більше ніж 40 км/год.","Забороняється.","Дозволяється при довжині гнучкого зчеплення понад 5 м.","Дозволяється на дорогах з неінтенсивним рухом."],"provisional_correct_index":1},{"id":"23-008","topic":"23","number":8,"question":"Яким способом  дозволено виконувати  буксирування  транспортних засобів під час ожеледиці?","options":["Тільки на жорсткому зчепленні.","Тільки способом часткового навантаження.","Тільки на гнучкому зчепленні.","На жорсткому зчепленні або способом часткового навантаження."],"provisional_correct_index":3},{"id":"23-009","topic":"23","number":9,"question":"У якому випадку дозволяється буксирування двох і більше транспортних засобів?","options":["Буксирування понад одного транспортного засобу заборонене.","Під час руху за межами населеного пункту.","Під час руху по дорогах з неінтенсивним рухом.","За погодженням із уповноваженим підрозділом Національної поліції."],"provisional_correct_index":3},{"id":"23-010","topic":"23","number":10,"question":"Яким способом необхідно буксирувати транспортний засіб із рульовим керуванням, що не діє?","options":["Тільки на гнучкому зчепленні.","Тільки на жорсткому зчепленні.","На жорсткому зчепленні або способом часткового навантаження.","Лише способом часткового навантаження."],"provisional_correct_index":3},{"id":"23-011","topic":"23","number":11,"question":"Яким способом повинне здійснюватися буксирування немеханічних транспортних засобів?","options":["На гнучкому або жорсткому зчепленні.","Лише на гнучкому зчепленні.","Лише на жорсткому зчепленні."],"provisional_correct_index":2},{"id":"23-012","topic":"23","number":12,"question":"За яких умов повинне здійснюватися буксирування транспортних засобів?","options":["За  умови  наявності  технічно  справного  зчіпного  пристрою  лише у буксируваного транспортного засобу.","За  умови  наявності  технічно  справного  зчіпного  пристрою  тільки у транспортного засобу, що буксирує.","За  умови  наявності  справного  зчіпного  пристрою  у  буксируваного транспортного засобу, а також у транспортного засобу, що буксирує."],"provisional_correct_index":2},{"id":"23-013","topic":"23","number":13,"question":"Яка відстань має бути забезпечена між транспортними засобами у разі буксирування на гнучкому зчепленні?","options":["3–5 м.","4–5 м.","4–6 м.","5–7 м.","4–7 м."],"provisional_correct_index":2},{"id":"23-014","topic":"23","number":14,"question":"Як повинно бути позначене гнучке зчеплення?","options":["Через кожен метр – сигнальними щитками або прапорцями розміром 200 × 200 мм із нанесеними на них по діагоналі червоними і білими смугами.","З використанням покриття із світлоповертального матеріалу.","Одним із вищевказаних способів."],"provisional_correct_index":2},{"id":"23-015","topic":"23","number":15,"question":"У разі буксирування транспортного засобу на гнучкому зчепленні в буксируваному транспортному засобі повинні бути справні такі системи:","options":["Тільки рульове керування.","Тільки гальмова система.","Рульове керування і гальмова система."],"provisional_correct_index":2},{"id":"23-016","topic":"23","number":16,"question":"З якими із перерахованих несправностей заборонене буксирування транспортних засобів на гнучкому зчепленні?","options":["З несправною гальмовою системою.","З несправним рульовим керуванням.","Із несправною паливною системою.","З несправною підвіскою.","Із несправними гальмовою системою і рульовим керуванням."],"provisional_correct_index":4},{"id":"23-017","topic":"23","number":17,"question":"Із  якими   з  несправностей   заборонене   буксирування    усіх транспортних засобів на жорсткому зчепленні?","options":["Із несправним рульовим керуванням.","З негерметичною гальмовою системою.","З несправною аварійною сигналізацією.","Відповіді 1, 2 і 3."],"provisional_correct_index":0},{"id":"23-018","topic":"23","number":18,"question":"Чи дозволене буксирування транспортних засобів на жорсткому або гнучкому зчепленні з несправним рульовим керуванням?","options":["Заборонено.","Дозволено."],"provisional_correct_index":0},{"id":"23-019","topic":"23","number":19,"question":"За якої умови під час буксирування транспортного засобу на жорсткому зчепленні в буксируваному транспортному засобі може бути відсутній водій?","options":["Завжди.","Під час буксирування у населених пунктах.","За умови, що конструкція жорсткого зчеплення забезпечує буксируваному транспортному засобу повторення траєкторії руху транспортного засобу, що буксирує, незалежно від величини поворотів.","Відповіді 1, 2 і 3."],"provisional_correct_index":2},{"id":"23-020","topic":"23","number":20,"question":"Чи дозволяється буксирування транс  обладнані автомобілі з механічною коробкою передач, що систематично використовуються для навчання водіння?","options":["Додатковими педалями зчеплення і гальма, а також педаллю акселератора (якщо конструкція транспортного засобу допускає можливість обладнання такою педаллю).","Дзеркалом або дзеркалами заднього виду для спеціаліста з підготовки водіїв, а  також  розпізнавальними  знаками  «Навчальний  транспортний  засіб», встановленими відповідно до вимог Правил дорожнього руху.","Правильні відповіді 1 і 2."],"provisional_correct_index":2},{"id":"24-008","topic":"24","number":8,"question":"Автомобілі, що систематично використовуються для навчання водіння, мають бути обладнані:","options":["Розпізнавальними знаками «Навчальний транспортний засіб», встановленими відповідно до вимог Правил дорожнього руху.","Додатковими педалями зчеплення (якщо конструкція транспортного засобу передбачає педаль зчеплення), акселератора (якщо конструкція транспортного засобу допускає можливість обладнання такою педаллю) і гальмування.","Дзеркалом або дзеркалами заднього виду для спеціаліста з підготовки водіїв.","Правильні відповіді 1 і 2.","Правильні відповіді 1, 2 і 3."],"provisional_correct_index":4},{"id":"24-009","topic":"24","number":9,"question":"Чи дозволена навчальна їзда на дорогах без присутності спеціаліста з підготовки водіїв?","options":["Заборонена.","Дозволена за умови присутності водія зі стажем не менше трьох років.","Дозволена в присутності будь-якого досвідченого водія."],"provisional_correct_index":0},{"id":"24-010","topic":"24","number":10,"question":"Де має проводитися початкове навчання водінню транспортного засобу?","options":["Тільки на закритих майданчиках і автодромах.","Тільки в місцях, де відсутні інші учасники дорожнього руху.","На дорогах з неінтенсивним рухом.","На закритих майданчиках, автодромах або у місцях, де немає інших учасників дорожнього руху."],"provisional_correct_index":3},{"id":"24-011","topic":"24","number":11,"question":"Чи повинна особа, яка навчається водінню транспортного засобу, знати і виконувати вимоги Правил дорожнього руху?","options":["Не повинна.","Повинна обов'язково."],"provisional_correct_index":1},{"id":"24-012","topic":"24","number":12,"question":"З якого віку дозволено навчатися водінню автомобіля?","options":["З 14 років.","З 16 років.","З 17 років.","З 18 років.","З 19 років."],"provisional_correct_index":1},{"id":"24-013","topic":"24","number":13,"question":"Особа, яка навчається водінню транспортного засобу:","options":["Не  зобов’язана    знати  вимоги  Правил дорожнього руху.","Може розпочати навчання водінню до вивчення правил проїзду перехресть.","Зобов’язана знати і виконувати вимоги Правил дорожнього руху."],"provisional_correct_index":2},{"id":"24-014","topic":"24","number":14,"question":"Чи дозволено особам, які навчаються водінню, не пристібатись під час руху в населеному пункті?","options":["Дозволено.","Заборонено."],"provisional_correct_index":1},{"id":"25-001","topic":"25","number":1,"question":"Як позначають транспортні засоби, що рухаються в колоні, якщо їх не супроводжують оперативні транспортні засоби?","options":["На  кожному  транспортному  засобі  спереду   і  ззаду  встановлюють розпізнавальний знак «Колона».","На кожному транспортному засобі вмикається ближнє світло фар.","На кожному транспортному засобі вмикаються денні ходові вогні або ближнє світло фар.","Відповіді 1 і 2.","Відповіді 1 і 3."],"provisional_correct_index":3},{"id":"25-002","topic":"25","number":2,"question":"Як позначають транспортні  засоби, що рухаються в  колоні, яку супроводжують оперативні транспортні засоби з увімкненими червоним, синім і червоним, зеленим або синім і зеленим проблисковими маячками та (або) спеціальними звуковими сигналами?","options":["На кожному транспортному засобі в обов'язковому порядку встановлюється розпізнавальний знак «Колона».","На кожному транспортному засобі вмикається ближнє світло фар.","На кожному транспортному засобі вмикаються денні ходові вогні або ближнє світло фар.","Відповіді 1 і 2.","Відповіді 1 і 3."],"provisional_correct_index":1},{"id":"25-003","topic":"25","number":3,"question":"Як повинні розміщуватися на дорозі транспортні засоби колони?","options":["Колона повинна рухатися лише в один ряд якнайближче до правого краю проїзної частини.","Колона може рухатися в будь-якій   смузі.","Колона повинна рухатися лише в один ряд якнайближче до правого краю проїзної частини, за винятком випадків, коли  її супроводжують оперативні транспортні засоби."],"provisional_correct_index":2},{"id":"25-004","topic":"25","number":4,"question":"Швидкість руху колони та дистанція між транспортними засобами встановлюються:","options":["Тільки старшим колони відповідно до вимог Правил дорожнього руху на певній ділянці дороги.","Тільки за режимом руху головної машини відповідно до вимог Правил дорожнього руху на певній ділянці дороги.","Старшим колони або за режимом руху головної машини відповідно до вимог Правил дорожнього руху на певній ділянці дороги."],"provisional_correct_index":2},{"id":"25-005","topic":"25","number":5,"question":"Як повинна рухатися  колона, яку  не супроводжують  оперативні транспортні засоби, щоб не створювати перешкод транспортним засобам, що обганяють?","options":["Рухатися лише в один ряд якнайближче до правого краю проїзної частини.","Рухатися зі швидкістю не більше ніж 50 км/год.","Повинна бути розділена на групи до п'яти транспортних засобів у кожній, дистанція між групами повинна бути достатньою для виконання обгону.","Відповіді 1, 2 і 3.","Відповіді 1 і 3."],"provisional_correct_index":4},{"id":"25-006","topic":"25","number":6,"question":"Під час зупинки колони на дорозі на всіх транспортних засобах колони вмикаються:","options":["Протитуманні фари.","Ближнє світло фар.","Аварійна світлова сигналізація.","Проблискові маячки оранжевого кольору.","Відповіді 3 і 4."],"provisional_correct_index":2},{"id":"25-007","topic":"25","number":7,"question":"Чи можуть сторонні транспортні засоби займати місце mber":2,"question":"Чи дозволяється вам встановлювати на одну вісь транспортного засобу ошиповану шину разом із неошипованою?","options":["Дозволяється.","Дозволяється лише на задню вісь.","Заборонено."],"provisional_correct_index":2},{"id":"31-003","topic":"31","number":3,"question":"Чи дозволяється рух до місця ремонту або стоянки в темний час доби з несправними фарами і задніми габаритними вогнями?","options":["Забороняється лише на дорогах без штучного освітлення.","Забороняється.","Дозволяється."],"provisional_correct_index":1},{"id":"31-004","topic":"31","number":4,"question":"Як ви повинні вчинити, якщо під час руху відмовив спідометр?","options":["Продовжити намічену поїздку з особливою обережністю.","Припинити подальший рух.","Спробувати усунути  несправність на  місці,  а якщо це неможливо,  то слідувати до  місця  стоянки  або  ремонту, ввімкнувши  аварійну  світлову сигналізацію або встановивши ззаду на транспортному засобі знак аварійної зупинки."],"provisional_correct_index":2},{"id":"31-005","topic":"31","number":5,"question":"У якому випадку дозволяється експлуатація транспортного засобу?","options":["Порушено регулювання фар.","На світлових приладах використовуються розсіювачі, що не відповідають типу конкретного світлового приладу.","Відсутні протитуманні фари."],"provisional_correct_index":2},{"id":"31-006","topic":"31","number":6,"question":"Ви маєте право експлуатувати легковий автомобіль за відсутності:","options":["Аптечки.","Вогнегасника.","Знака аварійної зупинки.","Противідкатних упорів."],"provisional_correct_index":3},{"id":"31-007","topic":"31","number":7,"question":"Чи дозволяється встановлювати на одну вісь легкового автомобіля шини з різним малюнком протектора?","options":["Дозволяється на будь-яку вісь.","Дозволяється лише на задню вісь.","Не дозволяється."],"provisional_correct_index":2},{"id":"31-008","topic":"31","number":8,"question":"За наявності якої несправності дозволяється експлуатація транспортного засобу?","options":["Не працюють запори горловин паливних баків.","Не працює механізм регулювання сидіння водія.","Не працює пристрій для обігрівання і обдування скла.","Не працює склопідйомник."],"provisional_correct_index":3},{"id":"31-009","topic":"31","number":9,"question":"У яких випадках забороняється подальший рух навіть до місця ремонту або стоянки з несправними фарами і задніми габаритними вогнями?","options":["Тільки в умовах недостатньої видимості.","Тільки в темний час доби.","В обох випадках."],"provisional_correct_index":2},{"id":"31-010","topic":"31","number":10,"question":"У якому випадку дозволяється експлуатація автомобіля?","options":["Не працюють передбачені конструкцією транспортного засобу склоочисники.","Не працюють склообмивачі.","Не працює склопідйомник."],"provisional_correct_index":2},{"id":"31-011","topic":"31","number":11,"question":"За  наявності  якої  несправності  заборонено  подальший  рух на транспортному засобі під час дощу або снігопаду?","options":["Не працюють у встановленому режимі склоочисники.","Несправний склоочисник з боку розміщення керма.","Не працюють передбачені конструкцією транспортного засобу склообмивачі."],"provisional_correct_index":1},{"id":"31-012","topic":"31","number":12,"question":"У яких випадках вам дозволяється експлуатація транспортного засобу?","options":["Вміст шкідливих речовин у відпрацьованих газах або їх димність перевищує встановлені норми.","Негерметична паливна система.","Не працює покажчик температури охолоджуючої рідини.","Несправна система випускання відпрацьованих газів."],"provisional_correct_index":2},{"id":"31-013","topic":"31","number":13,"question":"У   разі   виникнення   якої   несправності заборонено подальший рух навіть до місця ремонту або стоянки?","options":["Несправна  робоча  гальмова  система  не  дає  змоги  водієві  зупинити транспортний засіб при русі навіть з мінімальною швидкістю.","Несправна система випуску відпрацьованих газів.","Не працює склоочисник."],"provisional_correct_index":0},{"id":"31-014","topic":"31","number":14,"question":"У разі виникнення якої несправності заборонено подальший рух?","options":["Не працює склопідйомник.","Несправне рульове керування не дає можливості здійснити маневр під час руху з мінімальною швидкістю.","Несправний глушник."],"provisional_correct_index":1},{"id":"31-015","topic":"31","number":15,"question":"У якому випадку вам забороняється експлуатація транспортного засобу?","options":["Двигун нестійко працює на холостих обертах.","Двигун не розвиває максимальну потужність.","Несправна система випускання відпрацьованих газів."],"provisional_correct_index":2},{"id":"31-016","topic":"31","number":16,"question":"У якому випадку вам дозволяється експлуатація легкового автомобіля?","options":["Не працює спідометр.","Не працює покажчик температури охолоджуючої рідини.","Не працюють передбачені конструкцією замки дверей кузова або кабіни."],"provisional_correct_index":1},{"id":"31-017","topic":"31","number":17,"question":"У якому випадку вам забороняється експлуатація автомобіля?","options":["Не працює покажчик рівня палива.","Порушено регулювання кута випередження запалювання.","Ускладнений запуск двигуна.","Не працює звуковий сигнал."],"provisional_correct_index":3},{"id":"31-018","topic":"31","number":18,"question":"За яких умов заборонено подальший рух транспортного засобу, якщо не працює склоочисник з боку розміщення керма?","options":["За будь яких обставин.","Під час дощу або снігопаду.","Непрацюючий склоочисник не є перешкодою для руху у будь-якому випадку."],"provisional_correct_index":1},{"id":"32-001","topic":"32","number":1,"question":"У якому випадку з органами Національної поліції варто узгодити умови і порядок руху колони транспортних засобів?","options":["Під час руху колони за межами населених пунктів.","Якщо колона складається більш ніж із 5 механічних транспортних засобів.","Якщо колона складається більш ніж із 4 механічних транспортних засобів.","Під час руху колони в населених пунктах."],"provisional_correct_index":1},{"id":"32-002","topic":"32","number":2,"question":"За яких умов з органами Національної поліції узгоджують порядок буксирування?","options":["У разі буксирування по гірських дорогах.","Під час буксирування по автомагістралях і дорогах для автомобілів.","У разі буксирування двох і більше транспортних засобів.","Під час буксирування транспортного засобу з причепом."],"provisional_correct_index":2},{"id":"32-003","topic":"32","number":3,"question":"Що з перерахованого необхідно узгоджувати з органами Національної поліції?","options":["Нанесення білих смуг під нахилом на зовнішні бічні поверхні транспортних засобів.","Розміщення в смугах відведення автомобільних доріг кіосків, павільйонів, рекламоносіїв, пересувних торговельних пунктів.","Переобладнання транспортних засобів."],"provisional_correct_index":1},{"id":"32-004","topic":"32","number":4,"question":"За яких умов на транспортних засобах дозволяється встановлення спеціальних звукових і світлових сигнальних пристроїв?","options":["За умови узгодження з територіальним органом з надання сервісних послуг МВС.","За умови узгодження з уповноваженими підрозділами Національної поліції."],"provisional_correct_index":0},{"id":"32-005","topic":"32","number":5,"question":"За якої умови дозволено вносити зміни в ідентифікаційні номери  і номерні таблички кузова чи шасі (рами), двигуна транспортного засобу, а також їхнє знищення (перенесення, закріплення, відновлення)?","options":["При узгодженні з територіальними органами з надання сервісних послуг МВС та з заводом-виробником транспортного засобу.","У разі попереднього узгодження з територіальними органами з надання сервісних послуг МВС.","За умови дозволу заводу-виробника."],"provisional_correct_index":1},{"id":"33-001","topic":"33","number":1,"question":"Зображений дорожній знак має таке значення:","options":["Дозволяє виконати поворот ліворуч у зазначеному місці.","Дозволяє повернути тільки ліворуч.","Дозволяє об'їзд перешкоди тільки з лівого боку."],"provisional tions":["Повністю виключає можливість виникнення тільки занесення.","Повністю виключає можливість виникнення тільки знесення.","Не виключає можливість виникнення знесення або занесення."],"provisional_correct_index":2},{"id":"35-009","topic":"35","number":9,"question":"Рухаючись прямо зі швидкістю 50 км/год., ви раптово потрапили на невелику слизьку ділянку дороги. Що слід зробити?","options":["Плавно загальмувати.","Не змінювати траєкторії та швидкості руху."],"provisional_correct_index":1},{"id":"35-010","topic":"35","number":10,"question":"Увімкнення  яких  зовнішніх  світлових  приладів  забезпечить вам найкращу видимість дороги під час руху вночі за сильної хуртовини?","options":["Протитуманних фар спільно з дальнім світлом фар.","Протитуманних фар спільно з ближнім світлом фар."],"provisional_correct_index":1},{"id":"35-011","topic":"35","number":11,"question":"У якому з перелічених випадків    водієві слід оцінювати обстановку позаду?","options":["Тільки у випадку різкого гальмування.","Тільки у випадку гальмування на дорозі з мокрим або слизьким покриттям.","У випадку будь-якого гальмування."],"provisional_correct_index":2},{"id":"35-012","topic":"35","number":12,"question":"Де повинна бути розташована ступня лівої ноги водія при керуванні автомобілем з механічною коробкою передач (з увімкненим зчепленням)?","options":["На підлозі перед педаллю зчеплення.","Над педаллю зчеплення, не торкаючись педалі.","Зліва від педалі на підлозі або спеціальному майданчику."],"provisional_correct_index":2},{"id":"35-013","topic":"35","number":13,"question":"Якщо Ви сідаєте за кермо автомобіля після іншого водія, яка повинна бути послідовність Ваших дій?","options":["Пристебнути пасок безпеки, відрегулювати положення рульової колонки, відрегулювати положення дзеркал заднього виду, відрегулювати положення сидіння.","Відрегулювати положення дзеркал заднього виду, відрегулювати положення сидіння, відрегулювати положення рульової колонки.","Відрегулювати положення  сидіння, відрегулювати положення  рульової колонки, відрегулювати положення дзеркал заднього виду, пристебнути пасок безпеки."],"provisional_correct_index":2},{"id":"35-014","topic":"35","number":14,"question":"Де Ви знайдете дані про допустиму масу причепа, обладнаного гальмами, для Вашого легкового автомобіля?","options":["У Правилах дорожнього руху.","У страховому полісі.","В технічному паспорті."],"provisional_correct_index":2},{"id":"35-015","topic":"35","number":15,"question":"При проїзді через тунель ви наближаєтеся до кінця затору. Як Вам вести себе?","options":["Розвернути транспортний засіб і залишити тунель.","В кінці затору вимкнути двигун і залишити транспортний засіб.","Включити аварійну світлову сигналізацію.","Всі відповіді вірні."],"provisional_correct_index":2},{"id":"35-016","topic":"35","number":16,"question":"Ви хочете обігнати велосипедистів. Що Ви повинні врахувати при оцінці бокового інтервалу?","options":["Бокова відстань в 1,0 м є завжди достатньою.","Поведінка велосипедистів.","Швидкість свого транспортного засобу.","Відповіді 2 і 3."],"provisional_correct_index":3},{"id":"35-017","topic":"35","number":17,"question":"Ви хочете перетнути головну дорогу. Видимість в обох напрямках сильно обмежена через припарковані транспортні засоби. Як Ви будете діяти?","options":["Швидко перетну перехрестя.","З особливою обережністю виїду на перехрестя."],"provisional_correct_index":1},{"id":"35-018","topic":"35","number":18,"question":"Безпечною дистанцією між легковими автомобілями, які рухаються зі швидкістю 50 км на годину на сухому асфальті, можна вважати:","options":["2 метри.","Довжина легкового автомобіля.","Не менше 25 метрів або 2 секунди ."],"provisional_correct_index":2},{"id":"35-019","topic":"35","number":19,"question":"Як сприймається водієм швидкість його автомобіля у випадку тривалого руху рівнинною дорогою з великою швидкістю?","options":["Здається менше, ніж насправді.","Здається більшою, ніж насправді.","Сприйняття швидкості не змінюється."],"provisional_correct_index":0},{"id":"35-020","topic":"35","number":20,"question":"Під час руху на якому автомобілі збільшення швидкості може сприяти усуненню занесення задньої осі?","options":["На передньопривідному.","На задньопривідному."],"provisional_correct_index":0},{"id":"35-021","topic":"35","number":21,"question":"Що має зробити водій, щоб швидко відновити ефективність гальм після проїзду через водну перешкоду?","options":["Продовжити рух, трохи натягнувши важіль ручного гальма.","Продовжити рух і просушити гальмівні колодки багаторазовими нетривалими натисканнями на педаль гальма.","Продовжити рух із малою швидкістю без пригальмовування."],"provisional_correct_index":1},{"id":"35-022","topic":"35","number":22,"question":"Під час гальмування двигуном на крутому спуску водій має вибирати передачу, виходячи з умов:","options":["Чим крутіше спуск, тим вище передача.","Чим крутіше спуск, тим нижче передача.","Вибір передачі не залежить від крутизни спуску."],"provisional_correct_index":1},{"id":"35-023","topic":"35","number":23,"question":"Як має діяти водій у разі втрати зчеплення коліс з дорогою через утворення «водяного клина»?","options":["Збільшити швидкість.","Знизити швидкість різким натисканням на педаль гальма.","Знизити швидкість, застосовуючи гальмування двигуном."],"provisional_correct_index":2},{"id":"35-024","topic":"35","number":24,"question":"Чим  небезпечне  тривале  гальмування  з вимкненим  зчепленням (передачею) на крутому спуску?","options":["Значно збільшується знос протектора шин.","Підвищується знос деталей гальмівних механізмів.","Перегріваються гальмівні механізми і зменшується ефективність гальмування."],"provisional_correct_index":2},{"id":"35-025","topic":"35","number":25,"question":"Під час руху в умовах туману відстань до предметів видається:","options":["Більшою, ніж насправді.","Меншою, ніж насправді.","Такою, що відповідає дійсності."],"provisional_correct_index":0},{"id":"35-026","topic":"35","number":26,"question":"Що мається на ":"Чи потрібно в даному випадку зменшити швидкість або зупинитися, якщо Ви рухаєтесь прямо по головній дорозі:","options":["Так.","Ні."],"provisional_correct_index":1},{"id":"35-102","topic":"35","number":102,"question":"Під   час   руху   водію   транспортного   засобу   дозволяється використовувати свій смартфон для використання навігації (GPS):","options":["Тримаючи у руці (за винятком водіїв оперативних транспортних засобів під час виконання ними невідкладного службового завдання).","Закріпивши  на  приладовій  панелі  (за  винятком  водіїв  оперативних транспортних  засобів  під  час виконання ними невідкладного службового завдання)."],"provisional_correct_index":1},{"id":"35-103","topic":"35","number":103,"question":"Водій  транспортного  засобу  для  здійснення  посадки  (висадки) пасажирів повинен:","options":["Користуватися краєм проїзної частини, але не з боку суміжної смуги для руху.","Переконатись у безпеці пасажирів перед виходом з транспортного засобу, скориставшись дзеркалами заднього виду.","Відповідь 1 і 2."],"provisional_correct_index":0},{"id":"35-104","topic":"35","number":104,"question":"Чи правильно в даному випадку водій транспортного засобу закріпив ремінь безпеки?","options":["Так, ремінь закріплений правильно.","Ні, ремінь закріплений не правильно."],"provisional_correct_index":null},{"id":"35-105","topic":"35","number":105,"question":"У наведеній ситуації Ви, наближаючись до перехрестя, повинні:","options":["Подати звуковий сигнал, щоб водій транспортного засобу, який знаходиться позаду пригальмував.","Безпечно об'їхати велосипедиста.","Пригальмувати та дати можливість велосипедисту безпечно закінчити перетин перехрестя."],"provisional_correct_index":0},{"id":"35-106","topic":"35","number":106,"question":"Чи може ремінь безпеки ефективно спрацювати захистити лежачого пасажира?","options":["Так, може.","Ні."],"provisional_correct_index":0},{"id":"35-107","topic":"35","number":107,"question":"Якщо під час тривалої подорожі виникла необхідність змінити водія, необхідно налаштувати, у тому числі:","options":["Сидіння та дзеркала.","Тільки сидіння.","Тільки дзеркала."],"provisional_correct_index":0},{"id":"35-108","topic":"35","number":108,"question":"Як має діяти водій транспортного засобу у разі сонячного засліплення?","options":["Ввімкнути аварійну сигналізацію і, не змінюючи смуги руху, зменшити швидкість і зупинитися.","Подаючи звуковий сигнал, зупинитися на узбіччі."],"provisional_correct_index":null},{"id":"35-109","topic":"35","number":109,"question":"У разі аварії цей водій буде захищений ременем безпеки?","options":["Так.","Ні."],"provisional_correct_index":0},{"id":"35-110","topic":"35","number":110,"question":"Чи буде тривала розмова пасажира з водієм заважати водієві керувати транспортним засобом?","options":["Так.","Ні, оскільки розмова ніяк не обмежує оглядовість водієві."],"provisional_correct_index":1},{"id":"35-111","topic":"35","number":111,"question":"Наближаючись до перехрестя, де світлофор працює в режимі миготіння жовтого сигналу водій легкового автомобіля повинен:","options":["Знизити швидкість та бути готовим до повної зупинки.","Перетнути перехрестя не зменшуючи швидкості.","Збільшити швидкість для швидкого перетину перехрестя."],"provisional_correct_index":2},{"id":"35-112","topic":"35","number":112,"question":"Гальмівний шлях змінюється в   залежності від:","options":["Швидкості руху.","Погодних умов.","Всі відповіді вірні."],"provisional_correct_index":1},{"id":"35-113","topic":"35","number":113,"question":"Витрата палива залежить від:","options":["Швидкості руху.","Ваги транспортного засобу.","Завантаження транспортного засобу.","Всі відповіді правильні."],"provisional_correct_index":2},{"id":"35-114","topic":"35","number":114,"question":"Дотримання безпечної дистанції може допомогти запобігти зіткненню без здійснення будь-яких маневрів?","options":["Так.","Ні."],"provisional_correct_index":1},{"id":"35-115","topic":"35","number":115,"question":"Ви зупинились на вимогу поліцейського. Ви увімкнете аварійну світлову сигналізацію?","options":["Так.","Ні."],"provisional_correct_index":0},{"id":"35-116","topic":"35","number":116,"question":"Водій, який має намір Вас  обігнати, раніше перешкоджав Вам виконати обгін. У цьому випадку Ви:","options":["Збільшите швидкість, щоб унеможливити обгін.","Не будете перешкоджати обгону."],"provisional_correct_index":0},{"id":"35-117","topic":"35","number":117,"question":"Особа, яка навчається водінню, повинна мати при собі медичну довідку встановленого зразка?","options":["Так.","Ні."],"provisional_correct_index":1},{"id":"35-118","topic":"35","number":118,"question":"Рухаючись у населеному пункті, Ви бачите як водій, що рухається попереду, створив аварійну ситуацію. Для того, щоб запобігти ДТП Ви можете подати звуковий сигнал:","options":["Ні.","Так."],"provisional_correct_index":0},{"id":"35-119","topic":"35","number":119,"question":"Сідаючи в автомобіль, Ви раптом відчули запаморочення та сильну втому. Дорога до місця призначення займе не більше 10 хв. Ви:","options":["Розпочинаєте рух.","Не розпочнете рух."],"provisional_correct_index":0},{"id":"35-120","topic":"35","number":120,"question":"Після приймання заспокійливого лікарського засобу, Ви відчули запаморочення та зниження уваги. У такому випадку дозволено керувати транспортним засобом за умови:","options":["Невеликої кількості транспортних засобів на дорозі.","Присутності в автомобілі пасажирів.","Керувати транспортним засобом заборонено."],"provisional_correct_index":2},{"id":"35-121","topic":"35","number":121,"question":"Особа, яка не досягла 18-річного віку може отримати право на керування транспортним засобом категорії В за умови:","options":["Наявності достатнього практичного досвіду керування транспортним засобом.","Отримання транспортного засобу у спадок.","В жодному випадку."],"provisional_correct_index":null},{"id":"35-122","topic":"35","number":122,"question":"З якого з цих транспортних засобів пасажир може вийти до моменту повної зупинки?","options":["Громадського транспорту.","Легкового автомобіля.","Мотоцикла.","Жодного з них."],"provisional_correct_index":0},{"id":"35-123","topic":"35","number":123,"question":"Проїжджаючи повз школу, що в першу чергу необхідно зробити?","options":["Увімкнути ближнє світло фар.","Періодично сигналити для привертання уваги.","Зменшити швидкість.","Збільшити швидкість."],"provisional_correct_index":0},{"id":"35-124","topic":"35","number":124,"question":"Вживання навіть невеликої дози алкоголю:","options":["Жодним чином не впливає на водія.","Покращує водійські навички.","Впливає на час реакції водія."],"provisional_correct_index":1},{"id":"35-125","topic":"35","number":125,"question":"Аварії, вчинені водіями у стані алкогольного сп’яніння, як правило мають:","options":["Легші наслідки.","Більш важкі наслідки."],"provisional_correct_index":1},{"id":"35-126","topic":"35","number":126,"question":"Щоб керувати транспортним засобом безпечно, потрібно зосередитися і вміти стежити за всім, що відбувається на дорозі. Для цього вам потрібно:","options":["За можливості попросити пасажирів стежити за дорожніми небезпеками.","Дивитися і оцінювати небезпеки лише попереду.","Постійно оцінювати дорожню обстановку контролювати безпечну дистанцію та інтервал."],"provisional_correct_index":1},{"id":"35-127","topic":"35","number":127,"question":"При під’їзді до крутого повороту Ви помітили сліди гравію на дорозі. Вам слід:","options":["Продовжити рух з тією ж швидкістю.","Збільшити швидкість.","Зменшити швидкість."],"provisional_correct_index":1},{"id":"35-128","topic":"35","number":128,"question":"Якщо Ви помітили вершника на дорозі, Вам слід:","options":["Подати звуковий сигнал.","Зменшити швидкість та збільшити безпечний інтервал до вершника.","Збільшити швидкість."],"provisional_correct_index":2},{"id":"35-129","topic":"35","number":129,"question":"Друг позичає вам транспортний засіб, який вміщує десять осіб разом з водієм. Чи достатньо Вам посвідчення на право керування транспортним засобом категорії B, щоб керувати таким транспортним засобом?","options":["Достатньо.","Недостатньо."],"provisional_correct_index":null},{"id":"35-130","topic":"35","number":130,"question":"Рухаючись  у  заторі Ви  сповільнюєте  рух,  наближаючись  до велосипедиста.  Водії  позаду  сигналять, вимагаючи  від Вас рухатись швидше та обігнати велосипедиста. Ваші дії:","options":["Збільшите швидкість та виконаєте обгін велосипедиста.","Зупините транспортний засіб, даючи можливість велосипедисту проїхати вперед на достатню відстань.","Зберігаєте спокій і виконаєте обгін велосипедиста тоді, коли це буде безпечно."],"provisional_correct_index":null},{"id":"35-131","topic":"35","number":131,"question":"Відкриваючи двері транспортного засобу зі сторони проїжджої частини, на що слід звернути увагу?","options":["Відкривати двері необхідно різко.","Переконатися, що всі водії, що рухаються позаду, зрозуміли Ваші наміри.","Відкривати двері лише, коли впевнились в тому, що це не загрожує іншим учасникам дорожнього руху."],"provisional_correct_index":2},{"id":"35-132","topic":"35","number":132,"question":"Проїжджаючи поруч з дітьми, які граються біля краю дороги, Вам слід:","options":["Посигналити їм.","Збільшити швидкість.","Зменшити швидкість і бути готовим повністю зупинити транспортний засіб."],"provisional_correct_index":2},{"id":"35-133","topic":"35","number":133,"question":"Коли Ви бачите дітей на дорозі або поруч з нею:","options":["Необхідно зменшити швидкість на 5-10 км/год.","Не слід звертати на них увагу.","Потрібно бути обережним, зменшити швидкість і бути готовим повністю зупинити транспортний засіб."],"provisional_correct_index":1},{"id":"35-134","topic":"35","number":134,"question":"Рухаючись ділянками, де велика кількість пішоходів, водію необхідно:","options":["Увімкнути дальнє світло фар.","Бути особливо уважним та обережним, зменшити швидкість і бути готовим до повної зупинки.","Проїхати ділянку максимально швидко, увімкнувши аварійну світлову сигналізацію."],"provisional_correct_index":2},{"id":"35-135","topic":"35","number":135,"question":"Коли Ви бачите людей похилого віку на дорозі або біля неї, Вам необхідно:","options":["Зменшити швидкість на 5-10 км/год.","Не слід звертати на них увагу.","Потрібно бути обережним, зменшити швидкість і бути готовим повністю зупинити транспортний засіб."],"provisional_correct_index":2},{"id":"35-136","topic":"35","number":136,"question":"Якщо Ви помітили пішохода з   ознаками алкогольного сп’яніння, який рухається по краю проїзної частини, необхідно:","options":["Бути максимально уважним та обережним, зменшити швидкість та бути готовим зупинити транспортний засіб.","Проїхати повз, не зменшуючи швидкість.","Посигналити двічі, попередивши його про наближення транспортного засобу."],"provisional_correct_index":1},{"id":"35-137","topic":"35","number":137,"question":"Наближаючись до пішохідного переходу, на якому немає пішоходів, Ви:","options":["Будете обережним і готовим зменшити швидкість, а у разі необхідності зупинити транспортний засіб.","Проїдете перехід, збільшивши швидкість перед його початком.","Все одно зупините транспортний засіб перед початком переходу і зачекаєте, поки з’являться пішоходи."],"provisional_correct_index":1},{"id":"35-138","topic":"35","number":138,"question":"Проїжджаючи повз припарковані транспортні засоби необхідно:","options":["Бути максимально обережним, бо можлива раптова поява людей чи тварин з- за автомобілів, а також відкриття дверей.","Якомога швидше  проїхати  повз   автомобілі,  щоб  не  перешкоджати іншим учасникам дорожнього руху.","Рухатись повз припарковані транспортні засоби увімкнувши аварійну світлову сигналізацію."],"provisional_correct_index":2},{"id":"35-139","topic":"35","number":139,"question":"Під  час  руху  ви  зіткнулись   із  агресивною  манерою  водіння транспортного засобу, що їде попереду. Ви повинні:","options":["Якомога швидше обігнати цей транспортний засіб.","Попередити водія, що рухається попереду тривалим звуковим сигналом.","Зберігати спокій, за необхідності зменшити швидкість і уважно слідкувати за дорожньою обстановкою."],"provisional_correct_index":2},{"id":"35-140","topic":"35","number":140,"question":"Під час руху вночі необхідно:","options":["Рухатись на найменшій відстані до транспортних засобів, що попереду, щоб інші водії розуміли, що Ви рухаєтесь позаду.","Рухатись на безпечній дистанції до транспортних засобів, що попереду, оскільки вночі складніше оцінювати дорожню обстановку."],"provisional_correct_index":null},{"id":"35-141","topic":"35","number":141,"question":"Яке з наведених тверджень найбільш вдало описує Вас як безпечного водія?","options":["Коли я керую транспортним засобом, я несу відповідальність за власну безпеку та безпеку інших учасників дорожнього руху.","Інші водії повинні рухатись так щоб уникнути зіткнення зі мною.","Потрапити чи не потрапити в ДТП – справа випадку."],"provisional_correct_index":2},{"id":"35-142","topic":"35","number":142,"question":"Якщо під час сильного дощу    видимість  раптово  погіршується, Вам слід:","options":["Зменшити швидкість та збільшити відстань до транспортного засобу, що рухається попереду.","Зупинити автомобіль.","Увімкнути дальнє світло фар."],"provisional_correct_index":1},{"id":"35-143","topic":"35","number":143,"question":"Що необхідно пам’ятати, якщо Ви плануєте тривалу поїздку:","options":["Краще їхати уночі, оскільки менше транспортних засобів.","Краще їхати без зупинок, щоб менше відчувати втому.","Краще їхати протягом дня і робити багато перерв для відпочинку."],"provisional_correct_index":2},{"id":"35-144","topic":"35","number":144,"question":"Ви хочете обігнати велосипедиста. Що Ви повинні врахувати при оцінці бокового інтервалу?","options":["Бокова відстань в 1,0 м є завжди достатньою.","Поведінку велосипедиста.","Швидкість свого транспортного засобу.","Відповіді 2 і 3."],"provisional_correct_index":0},{"id":"35-145","topic":"35","number":145,"question":"Як сприймається  водієм  швидкість  його  автомобіл
