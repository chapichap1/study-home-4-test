function chooseCategory(){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal-bg';
    m.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="m-icon">🪪</div><h3>Категорія посвідчення</h3>
      <p class="tiny">Іспит і список тем формуються із загальних тем 1–39 та тем вибраної категорії.</p>
      <div class="cat-list">${Object.entries(CATEGORIES).map(([k,c])=>`<button class="cat-opt ${state.category===k?'on':''}" data-cat-pick="${k}"><b>${esc(c.label)}</b><small>${examPool(k).length} запитань для іспиту</small></button>`).join('')}</div>

      <div class="m-actions"><button class="btn soft" data-r="0">Закрити</button></div></div>`;
    const opened=Date.now();let done=false;
    const close=v=>{if(done)return;done=true;m.classList.remove('in');setTimeout(()=>m.remove(),200);res(v)};
    m.addEventListener('click',e=>{

    });
    document.body.appendChild(m);requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('in')));
  });
}

/* ====== ТЕСТ / ІСПИТ (4.3) ====== */
const EXAM_QUESTIONS=20,EXAM_MINUTES=20,EXAM_MAX_ERRORS=2;
const MODE={exam:['🚗','Іспит'],topic:['📚','Тренування'],mistakes:['🔁','Помилки']};
const pageFor=mode=>mode==='exam'?'home':mode==='mistakes'?'mistakes':'topics';
function newId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}

/* Незавершений тест зберігається окремо, щоб пережити перезавантаження вкладки Safari */
function saveSession(){
  if(!session||session.finished){clearSession();return}
  const {rid,mode,topic,ids,i,errors,correct,selected,deadline,startedAt,sels,category}=session;
  try{localStorage.setItem(SESSION_KEY,JSON.stringify({v:3,rid,mode,topic,ids,i,errors,correct,selected,deadline,startedAt,sels,category}))}catch(e){}
}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function restoreSession(){
  let o=null;
  try{o=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){o=null}
  if(!o||typeof o!=='object'||o.v!==3){clearSession();return null}
  const int=v=>Number.isInteger(v)&&v>=0;
  const ok=MODE[o.mode]&&typeof o.rid==='string'&&Array.isArray(o.ids)&&o.ids.length>0&&o.ids.length<=EXAM_QUESTIONS&&
    o.ids.every(id=>{const q=byId.get(id);return q&&hasKey(q)})&&int(o.i)&&o.i<o.ids.length&&int(o.errors)&&int(o.correct)&&
    o.errors+o.correct<=o.ids.length&&Number.isFinite(o.startedAt)&&Date.now()-o.startedAt<24*3600*1000&&
    (o.mode!=='exam'||Number.isFinite(o.deadline))&&(o.selected===null||(int(o.selected)&&o.selected<byId.get(o.ids[o.i]).options.length))&&
    Array.isArray(o.sels)&&o.sels.length===o.ids.length&&o.sels.every((v,k)=>v===null||(int(v)&&v<byId.get(o.ids[k]).options.length))&&
    o.sels.filter(v=>v!==null).length===o.errors+o.correct;
  if(!ok||state.history.some(h=>h.id===o.rid)){clearSession();return null}
  return {rid:o.rid,mode:o.mode,topic:typeof o.topic==='string'?o.topic:undefined,ids:o.ids,i:o.i,errors:o.errors,correct:o.correct,selected:o.selected,
    finished:false,deadline:o.mode==='exam'?o.deadline:null,startedAt:o.startedAt,sels:o.sels.slice(),
    category:Object.prototype.hasOwnProperty.call(CATEGORIES,o.category)?o.category:undefined};
}

function start(mode,topic){
  const wrongSet=new Set(state.wrong);
  /* 4.3: іспит — лише запитання вибраної категорії без відсутніх ілюстрацій; тренування — усі запитання з ключем */
  const available=mode==='exam'?examPool():qs.filter(q=>hasKey(q)&&(mode!=='topic'||q.topic===topic)&&(mode!=='mistakes'||wrongSet.has(q.id)));
  if(!available.length){modal({icon:'🤔',title:'Немає запитань',text:'Поки немає запитань із ключами для цього режиму.'});return}
  const picked=shuffle(available).slice(0,Math.min(EXAM_QUESTIONS,available.length));
  stopTimer();clearTimeout(autoT);
  const now=Date.now();
  session={rid:newId(),mode,topic,ids:picked.map(q=>q.id),i:0,errors:0,correct:0,selected:null,finished:false,
    deadline:mode==='exam'?now+EXAM_MINUTES*60*1000:null,startedAt:now,sels:picked.map(()=>null),
    category:mode==='exam'?state.category:undefined};
  page=pageFor(mode);
  saveSession();
  if(session.deadline)timer=setInterval(tick,1000);
  render();window.scrollTo(0,0);
}
function tick(){
  if(!session||session.finished||!session.deadline)return;
  if(Date.now()>=session.deadline)finish('time');
  else{const t=$('#clock');if(t){t.textContent='⏱ '+timeLeft();t.classList.toggle('warn',session.deadline-Date.now()<120000)}}
}

function timeLeft(){const n=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));return fmtTime(n)}
function fmtTime(n){n=Math.max(0,Math.round(n));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function renderQuiz(){

  </section>`;
  app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));
  $('#quit').onclick=async()=>{const ok=await modal({icon:'🏁',title:'Завершити поточний тест?',text:'Результат буде збережено в історії.',ok:'Завершити',cancel:'Продовжити'});if(ok&&session&&!session.finished)finish('quit')};
  /* після відновлення сесії запитання вже може мати відповідь */

function answer(i){
  if(!session||session.finished||session.selected!==null)return;
  if(session.deadline&&Date.now()>=session.deadline){tick();return}
  const q=byId.get(session.ids[session.i]);
  if(!q||!Number.isInteger(i)||i<0||i>=q.options.length)return;
  session.selected=i;session.sels[session.i]=i;
  const right=i===q.provisional_correct_index;
  if(right)session.correct++;else session.errors++;
  /* спершу фіксуємо відповідь у сесії — повторне нарахування після перезавантаження неможливе */
  saveSession();
  if(right){state.coins+=3;state.xp+=5;state.wrong=state.wrong.filter(id=>id!==q.id)}
  else if(!state.wrong.includes(q.id))state.wrong.push(q.id);
  state.totalAnswered++;save();syncHeader();
  const e=$('#errN');if(e)e.textContent=session.errors;
  showFeedback(q,true);
}
function showFeedback(q,scroll){
  const i=session.selected,ci=q.provisional_correct_index,right=i===ci;
  app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=Number(b.dataset.answer);b.classList.toggle('good',n===ci);b.classList.toggle('bad',n===i&&!right);if(n!==ci&&n!==i)b.classList.add('dim')});
  $('#feedback').innerHTML=(right?`<div class="fb good">✅ Правильно! +3 🪙 +5 ⭐</div>`:`<div class="fb bad">❌ За попереднім ключем правильний варіант: ${ci+1}<small>${esc(q.options[ci])}</small></div>`)+
    (KEY_CONFLICT_IDS.has(q.id)?'<div class="fb warn">⚠️ У базі є таке саме запитання з іншим ключем — ця відповідь сумнівна.</div>':'');
  const b=$('#next');b.classList.remove('hidden');
  const stop=session.mode==='exam'&&session.errors>EXAM_MAX_ERRORS;
  const last=session.i+1>=session.ids.length;
  if(stop){
    /* третя помилка — іспит завершується автоматично */
    $('#feedback').insertAdjacentHTML('beforeend','<div class="fb bad">⛔ Третя помилка — іспит завершено. Результат збережено.</div>');
    $('#quit').classList.add('hidden');
    b.textContent='Переглянути результат';
    finish('errors',true);
    const rid=session.rid;
    autoT=setTimeout(()=>{if(session&&session.finished&&session.rid===rid)render()},2500);
    b.onclick=()=>{clearTimeout(autoT);if(session&&session.finished)render()};
  }else{
    b.textContent=last?'Результат 🏁':'Наступне →';
    b.onclick=()=>{
      if(!session||session.finished)return;
      if(session.i+1>=session.ids.length){finish('complete');return}
      session.i++;session.selected=null;saveSession();renderQuiz();window.scrollTo(0,0);
    };
  }
  if(scroll)requestAnimationFrame(()=>b.scrollIntoView({behavior:'smooth',block:'nearest'}));
}
/* reason: complete | errors | time | quit. silent — не перемальовувати екран */
function finish(reason,silent){
  if(!session||session.finished)return;
  stopTimer();
  const s=session;
  const answered=s.correct+s.errors;
  if(s.mode==='exam'&&s.errors>EXAM_MAX_ERRORS)reason='errors';
  else if(answered===s.ids.length)reason='complete'; /* усі відповіді дано — навіть якщо час сплив до натискання «Результат» */
  s.finished=true;s.reason=reason;s.expired=reason==='time';
  s.durationSec=Math.round((Math.min(Date.now(),s.deadline||Infinity)-s.startedAt)/1000);
  s.passed=s.mode==='exam'&&reason==='complete'&&s.errors<=EXAM_MAX_ERRORS&&answered===s.ids.length;
  /* один результат = один запис в історії */
  if(!state.history.some(h=>h.id===s.rid)){
    const record={id:s.rid,date:new Date().toISOString(),mode:s.mode,correct:s.correct,errors:s.errors,total:s.ids.length,expired:s.expired,reason,passed:s.passed,durationSec:s.durationSec};
    if(s.topic)record.topic=s.topic;
    if(s.category)record.category=s.category;
    /* 4.3: розбір — неправильні відповіді з номером, вибором користувача і ключем на момент відповіді */
    record.review=buildReview(s);
    state.history.unshift(record);state.history=state.history.slice(0,HISTORY_MAX);save();
  }
  clearSession();
  document.body.classList.remove('quizzing');
  if(!silent)renderResult();
}
function renderResult(){

  const verdict=s.passed?'Іспит складено за попередніми ключами':
    s.reason==='errors'?'Іспит не складено: 3 помилки':

  app.innerHTML=`<section class="card lav fade"><div class="result-hero"><div class="big">${icon}</div><h2>${title}</h2>

/* ====== 4.3: РОЗБІР ПОМИЛОК ====== */
function buildReview(s){
  const out=[];
  s.ids.forEach((id,k)=>{const q=byId.get(id);const sel=s.sels?s.sels[k]:null;if(!q||sel===null||sel===undefined)return;
    if(sel!==q.provisional_correct_index)out.push({id,n:k+1,sel,key:q.provisional_correct_index})});
  return out.slice(0,REVIEW_MAX);
}

  const body=list.length?list.map(r=>{
    const q=byId.get(r.id);

    const t=topicById.get(q.topic);

    return `<div class="rv"><div class="rv-meta">Запитання ${r.n} із ${total} · ID ${esc(q.id)} · тема ${esc(q.topic)}${t?' · '+esc(tName(t).toLowerCase()):''}</div>
      <p class="rv-q">${esc(q.question)}</p>${figureHTML(q)}
      <ol class="rv-opts">${q.options.map((o,i)=>{const mine=i===r.sel,key=i===keyNow;return `<li class="${key?'key':''} ${mine&&!key?'rv-mine':''}"><span>${esc(o)}</span>${mine&&!key?'<em>❌ Твоя відповідь</em>':''}${key?'<em>✅ Відповідь за ключем</em>':''}</li>`}).join('')}</ol>
      ${KEY_CONFLICT_IDS.has(q.id)?'<p class="tiny rv-warn">⚠️ У базі є таке саме запитання з іншим ключем — відповідь сумнівна.</p>':''}
      ${changed?'<p class="tiny rv-warn">ℹ️ Ключ цього запитання змінився після проходження тесту.</p>':''}</div>`}).join('')

  <div class="seg" id="seg">${[['all','Усе'],...Object.entries(CATS)].map(([k,v])=>`<button class="${shopCat===k?'on':''}" data-cat="${k}">${v}</button>`).join('')}</div>
  <div class="shop">${list.map(cardHTML).join('')}</div></div>`;
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{shopCat=b.dataset.cat;shop()});
  app.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  app.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const g=goodById.get(b.dataset.use);if(!g)return;if(!owns(g.id))return;if(isTheme(g)){state[g.cat]=g.id;save();toast('✨ '+g.name+' — обрано')}else{toggleItem(g.id);toast(shown(g.id)?'🏡 Повернуто в кімнату':'📦 Сховано з кімнати')}shop()});
}
function previewHTML(g){return isTheme(g)?`<div class="pv theme"><i class="${g.id}"></i></div>`:`<div class="pv ${['rug','garland','books'].includes(g.svg)?'wide':''}">${art(g)}</div>`}
function cardHTML(g){
  const own=owns(g.id);let btn;
  if(own){
    if(isTheme(g)){const on=state[g.cat]===g.id;btn=`<button class="btn ${on?'okd':'soft'}" data-use="${g.id}" ${on?'disabled':''}>${on?'✓ Обрано':'Обрати'}</button>`}
    else{const on=shown(g.id);btn=`<button class="btn ${on?'okd':'soft'}" data-use="${g.id}">${on?'✓ У кімнаті':'Поставити'}</button>`}
  }else if(state.coins>=g.price)btn=`<button class="btn" data-buy="${g.id}">Купити</button>`;
  else btn=`<button class="btn soft" disabled>Ще ${g.price-state.coins} 🪙</button>`;
  return `<div class="good-card">${own&&g.price>0?'<span class="ribbon">✓ Куплено</span>':(!own&&g.isNew?'<span class="ribbon new">Новинка</span>':'')}${previewHTML(g)}<div class="cat">${CATS[g.cat]}</div><div class="name">${esc(g.name)}</div><div class="price">${g.price?'🪙 '+g.price:'Безкоштовно'}</div>${btn}</div>`;
}
let buying=false;
async function buy(id){
  const g=goodById.get(id);if(buying||!g||owns(id)||state.coins<g.price)return;
  buying=true;
  const pv=isTheme(g)?`<div style="width:120px;height:90px;margin:0 auto 6px;border-radius:18px;overflow:hidden;position:relative"><i class="${g.id}" style="position:absolute;inset:0"></i></div>`:(g.svg?svgFor(g.svg):`<span style="font-size:64px">${g.emoji}</span>`);
  let ok=false;
  try{ok=await modal({icon:pv,title:g.name,text:`Купити за ${g.price} 🪙? Після покупки залишиться ${state.coins-g.price} 🪙.`,ok:`Купити · ${g.price} 🪙`,cancel:'Скасувати'})}finally{buying=false}
  /* повторна перевірка після підтвердження: монети не списуються двічі за той самий предмет */
  if(!ok||owns(id)||state.coins<g.price)return;
  state.coins-=g.price;if(!state.owned.includes(g.id))state.owned.push(g.id);state.hidden=state.hidden.filter(x=>x!==g.id);
  if(isTheme(g))state[g.cat]=g.id;
  save();syncHeader();confetti();toast(isTheme(g)?'✨ Нове оформлення кімнати!':'🏡 '+g.name+' — уже в кімнаті! Переставити можна в «Кімнаті»');shop();
}

/* ====== ІСТОРІЯ + РЕЗЕРВНА КОПІЯ ====== */
function markBackup(){state.lastBackupAt=Date.now();state.backupSnoozeUntil=0;save()}
function backupFileName(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `study-home-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`}
async function restoreFrom(text){
  let o;try{o=JSON.parse(String(text).trim())}catch(e){modal({icon:'⚠️',title:'Код не розпізнано',text:'Перевір, що вставлено весь текст повністю.'});return}
  if(!o||typeof o!=='object'||Array.isArray(o)||!('coins' in o||'xp' in o||'history' in o)){modal({icon:'⚠️',title:'Це не схоже на прогрес STUDY HOME'});return}
  const n=sanitize(o);
  const ok=await modal({icon:'📥',title:'Замінити поточний прогрес?',text:`У копії: 🪙 ${n.coins}, ⭐ ${n.xp}, тестів: ${n.history.length}, речей: ${n.owned.length}. Поточні дані буде замінено.`,ok:'Відновити',cancel:'Скасувати'});
  if(!ok)return;
  /* незавершений тест належить до старого прогресу — скидаємо його */
  stopTimer();session=null;clearSession();
  state=n;if(save()){toast('✅ Прогрес відновлено')}navigate('home');
}
function readPre43(){try{const o=JSON.parse(localStorage.getItem(PRE43_KEY)||'null');return o&&typeof o.raw==='string'?o:null}catch(e){return null}}
function historyView(){
  const H=state.history;const pre=readPre43();
  app.innerHTML=`<div><section class="card"><button class="btn ghost small" id="back" style="padding-left:0">← На головну</button><div class="eyebrow">Статистика</div><h2>📊 Історія навчання</h2>
  ${H.length?H.map((h,idx)=>{const m=MODE[h.mode]||MODE.topic;const d=new Date(h.date);const ok=passedRecord(h);const tn=h.topic&&topicById.get(h.topic)?' · тема '+esc(h.topic):'';const cat=h.category?' · '+esc(h.category==='ALL'?'усі':h.category):'';
    const rv=Array.isArray(h.review);
    return `<div class="hrow ${rv?'tapable':''}" ${rv?`data-review="${idx}" role="button" tabindex="0"`:''}><span class="hi">${m[0]}</span><span class="hm"><b>${m[1]}${tn}${cat}</b><small>${isNaN(d)?'':esc(d.toLocaleDateString('uk-UA'))+' '+esc(d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}))}${h.reason==='errors'?' · ⛔ 3 помилки':h.expired?' · ⏱ час вийшов':h.reason==='quit'?' · завершено достроково':''}${rv?` · 📝 розбір${h.review.length?' ('+h.review.length+')':''}`:''}</small></span><span class="hs">✅ ${Number(h.correct)||0} / ❌ ${Number(h.errors)||0}${h.mode==='exam'?`<br><small style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'складено':'не складено'}</small>`:''}</span></div>`}).join(''):'<p class="muted">Поки немає завершених тестів.</p>'}
  ${H.some(h=>!Array.isArray(h.review))&&H.length?'<p class="tiny muted" style="margin-top:8px">Розбір доступний для тестів, пройдених у версії 4.3 і новіших.</p>':''}
  </section>
  <section class="card wood"><h3>💾 Резервна копія прогресу</h3>
   <p class="tiny muted">Прогрес зберігається лише в цьому браузері. Safari може видалити дані сайту, якщо його не відкривати 7 днів, а іконка на початковому екрані має окреме від Safari сховище. Збережи копію у файл (застосунок «Файли») або скопіюй код у Нотатки.</p>
   <p class="tiny"><b>${state.lastBackupAt?'Остання копія: '+esc(new Date(state.lastBackupAt).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})):'Копію ще не робили.'}</b></p>
   <div class="actions"><button class="btn small" id="expFile">📄 Зберегти файл</button><button class="btn small" id="exp">📋 Скопіювати код</button></div>
   <div class="actions" style="margin-top:8px"><button class="btn small soft" id="impFile">📂 Відновити з файлу</button><button class="btn small soft" id="imp">📥 Відновити з коду</button></div>
   <input type="file" id="impInput" accept=".json,.txt,application/json,text/plain" class="hidden">
   <div id="bk" class="hidden" style="margin-top:12px"><textarea id="bkText" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><div class="actions" id="bkAct"></div></div>
   ${pre?`<p class="tiny muted" style="margin-top:12px">Автоматична копія прогресу до першого запуску 4.3 (${esc(new Date(pre.savedAt).toLocaleDateString('uk-UA'))}) збережена в цьому браузері.</p><div class="actions" style="margin-top:6px"><button class="btn small ghost" id="pre43">↩️ Відновити копію до 4.3</button></div>`:''}
  </section></div>`;
  $('#back').onclick=()=>navigate('home');
  app.querySelectorAll('[data-review]').forEach(r=>r.onclick=()=>{reviewIdx=Number(r.dataset.review);page='review';render();window.scrollTo(0,0)});
  $('#exp').onclick=async()=>{const code=JSON.stringify(state);const box=$('#bk'),ta=$('#bkText');box.classList.remove('hidden');ta.value=code;$('#bkAct').innerHTML='';
    try{await navigator.clipboard.writeText(code);markBackup();toast('📋 Код скопійовано — збережи його, наприклад, у Нотатках')}
    catch(e){ta.focus();ta.select();$('#bkAct').innerHTML='<button class="btn block soft" id="bkDone">✓ Я скопіював(-ла) код</button>';$('#bkDone').onclick=()=>{markBackup();toast('💾 Копію позначено');historyView()};toast('Виділи текст і скопіюй вручну')}};
  $('#expFile').onclick=()=>{
    try{
      const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=backupFileName();
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
      markBackup();toast('📄 Файл копії підготовлено');historyView();
    }catch(e){toast('Не вдалося створити файл — скопіюй код');$('#exp').click()}
  };
  $('#imp').onclick=()=>{const box=$('#bk'),ta=$('#bkText');box.classList.remove('hidden');ta.value='';ta.placeholder='Встав сюди код резервної копії';ta.focus();
    $('#bkAct').innerHTML='<button class="btn block" id="doImp">Відновити прогрес</button>';
    $('#doImp').onclick=()=>restoreFrom(ta.value)};
  const inp=$('#impInput');
  $('#impFile').onclick=()=>{inp.value='';inp.click()};
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;if(f.size>2e6){modal({icon:'⚠️',title:'Файл завеликий для копії прогресу'});return}
    const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.onerror=()=>modal({icon:'⚠️',title:'Не вдалося прочитати файл'});r.readAsText(f)};
  const p43=$('#pre43');if(p43)p43.onclick=()=>{const p=readPre43();if(p)restoreFrom(p.raw)};
}

/* ====== СТАРТ ====== */
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
$('#brand').onclick=()=>go('home');
$('#wCoins').onclick=()=>go('shop');
window.addEventListener('pageshow',e=>{if(e.persisted){state=sanitize(load());render();tick()}});
/* зміни з іншої вкладки — підхоплюємо, якщо зараз не триває тест */
window.addEventListener('storage',e=>{if(e.key!==KEY||(session&&!session.finished))return;state=sanitize(load());render()});
/* відновлення незавершеного тесту після перезавантаження сторінки */
(function(){
  const r=restoreSession();if(!r)return;
  session=r;page=pageFor(r.mode);
  if(r.deadline)timer=setInterval(tick,1000);
  setTimeout(()=>toast('▶ Продовжуємо незавершений тест'),300);
})();
render();
tick();
showStorageBanner();

</script>
</body>
</html>
